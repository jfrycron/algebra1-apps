<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solving Equations — Infinite Practice</title><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#eaf0f4;color:#262626;font-family:Geist,Arial,sans-serif}.shell{max-width:1120px;margin:30px auto;padding:0 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:38px;margin:0 0 5px}header p{margin:0;color:#60748a}.pill{border:1px solid #e5cdbf;background:#fff;border-radius:35px;padding:12px 18px;font-weight:700}.workspace{position:relative;margin-top:30px;min-height:650px;border-radius:16px;border:1px solid #d9e1e6;background:white;padding:28px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.directions{color:#627386;font-size:16px}select{font:inherit;border:1px solid #d7dfe4;background:#fff;border-radius:12px;padding:11px;max-width:100%}.problem{text-align:center;margin:65px auto 0;width:100%}.equation{font-size:clamp(38px,6vw,62px);font-weight:550}.steps{margin:18px auto 0;max-width:720px;text-align:center}.step{padding:13px 0}.step .eq{font-size:clamp(30px,4.5vw,46px)}.explain{font-size:15px;color:#627386;margin-top:7px}.end{color:#207250;font-weight:800}.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:26px}button{font:inherit;background:#bd5526;color:#fff;border:0;border-radius:14px;padding:15px 24px;font-weight:750;cursor:pointer}button:hover{background:#9e421b}button.alt{background:#f1e6dd;color:#422c22}.footer{text-align:center;color:#84909a;font-size:12px;padding:16px}@media(max-width:600px){h1{font-size:26px}.workspace{min-height:580px;padding:18px}.problem{margin-top:45px}}</style><div class="shell"><header><div><h1>Solving Equations</h1><p>Solve independently, then check each step.</p></div><div class="pill" id="count">Equations Solved 0</div></header><main class="workspace"><div class="top"><div class="directions">Solve the equation. Click Check My Work, then Continue to reveal each step.</div><select id="mode"><option value="two">Two-Step Equations</option><option value="both">Variables on Both Sides</option><option value="dist">Distributive Property</option><option value="combine">Combining Like Terms</option><option value="special">No Solution / Infinitely Many</option><option value="mixed">Mixed Practice</option></select></div><div class="problem"><div class="equation" id="equation"></div><div class="steps" id="steps" aria-live="polite"></div></div><div class="buttons"><button id="action">Check My Work</button><button class="alt" id="new">New Equation</button></div></main><div class="footer">Press Enter to reveal the next step.</div></div><script>
const el=id=>document.getElementById(id),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,nz=(a,b)=>{let v;do{v=rand(a,b)}while(!v);return v},term=(a,b)=>{let s=a===0?'':a===1?'x':a===-1?'-x':a+'x';return s+(b===0&&a!==0?'':a===0?String(b):b<0?' − '+(-b):' + '+b)},step=(eq,note)=>({eq,note});let cur,at=-1,solved=0,last='';
function generate(mode){if(mode==='mixed')mode=['two','both','dist','combine','special'][rand(0,4)];let x=rand(-15,15),a=nz(-8,8),b=rand(-14,14),c,d,eq,S=[];
if(mode==='two'){b=nz(-14,14);d=a*x+b;eq=term(a,b)+' = '+d;S=[step(a+'x = '+(d-b),'Subtracted '+b+' from both sides.'),step('x = '+x,'Divided both sides by '+a+'.')]}
if(mode==='both'){let z=nz(-7,7);a=nz(-7,7);c=a-z;b=rand(-12,12);d=z*x+b;eq=term(a,b)+' = '+term(c,d);S=[step(term(z,b)+' = '+d,'Subtracted '+c+'x from both sides.'),step(z+'x = '+(d-b),'Subtracted '+b+' from both sides.'),step('x = '+x,'Divided both sides by '+z+'.')]}
if(mode==='combine'){let u=nz(-7,7),v=nz(-7,7),z=u+v;if(!z){v++;z=u+v}b=rand(-12,12);d=z*x+b;eq=term(u,b)+(v<0?' − ':' + ')+(Math.abs(v)===1?'x':Math.abs(v)+'x')+' = '+d;S=[step(term(z,b)+' = '+d,'Combined like terms.'),step(z+'x = '+(d-b),'Subtracted '+b+' from both sides.'),step('x = '+x,'Divided both sides by '+z+'.')]}
if(mode==='dist'){let k=nz(-5,5),u=nz(-6,6),v=rand(-8,8),z=k*u;c=rand(-5,5);if(c===z)c++;d=(z-c)*x+k*v;eq=k+'('+term(u,v)+') = '+term(c,d);S=[step(term(z,k*v)+' = '+term(c,d),'Used the distributive property.'),step(term(z-c,k*v)+' = '+d,'Subtracted '+c+'x from both sides.'),step((z-c)+'x = '+(d-k*v),'Subtracted '+k*v+' from both sides.'),step('x = '+x,'Divided both sides by '+(z-c)+'.')]}
if(mode==='special'){let k=nz(-5,5),u=nz(-5,5),v=rand(-9,9),z=k*u,q=k*v,inf=rand(0,1)===0;d=inf?q:q+nz(-9,9);eq=k+'('+term(u,v)+') = '+term(z,d);S=[step(term(z,q)+' = '+term(z,d),'Used the distributive property.'),step(q+' = '+d,'Subtracted '+z+'x from both sides.'),step(inf?'Infinitely Many Solutions':'No Solution',inf?'The statement is true for every value of x.':'The statement is false for every value of x.')]}
return {eq,S,mode}}
function reset(){let p;for(let j=0;j<25;j++){p=generate(el('mode').value);if(p.eq!==last)break}cur=p;last=p.eq;at=-1;el('equation').textContent=cur.eq;el('steps').replaceChildren();el('action').textContent='Check My Work'}
function advance(){if(at===cur.S.length-1){reset();return}at++;let s=cur.S[at],node=document.createElement('div');node.className='step';let e=document.createElement('div');e.className='eq';e.textContent=s.eq;if(at===cur.S.length-1)e.classList.add('end');let n=document.createElement('div');n.className='explain';n.textContent=s.note;node.append(e,n);el('steps').append(node);if(at===cur.S.length-1){solved++;el('count').textContent='Equations Solved '+solved;el('action').textContent='Correct — Next Problem'}else el('action').textContent='Continue →'}
el('action').onclick=advance;el('new').onclick=reset;el('mode').onchange=reset;document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='SELECT'){e.preventDefault();advance()}});reset();</script></html>
