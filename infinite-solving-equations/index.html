<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solving Equations — Infinite Practice</title><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#eaf0f4;color:#262626;font-family:Geist,Arial,sans-serif}.shell{width:80%;max-width:none;margin:16px auto;padding:0 8px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-right:480px;min-height:64px}h1{font-size:38px;margin:0 0 1px}header p{margin:0;color:#60748a}.pill{white-space:nowrap;border:1px solid #e5cdbf;background:#fff;border-radius:35px;padding:12px 18px;font-weight:700}.workspace{position:relative;margin-top:10px;min-height:calc(100vh - 155px);border-radius:16px;border:1px solid #d9e1e6;background:white;padding:28px;display:flex;flex-direction:column}.top{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:nowrap;margin-top:-68px;min-height:54px;margin-bottom:26px;padding-right:0}.directions{color:#627386;font-size:16px}select{font:inherit;border:1px solid #d7dfe4;background:#fff;border-radius:12px;padding:11px;max-width:100%}.problem{margin:55px auto 0;width:100%;display:flex;flex-direction:column;align-items:center}.equation{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:clamp(42px,5vw,64px);font-weight:400}.steps{margin:0;max-width:100%;text-align:center}.step{padding:6px 0;display:contents}.step .eq{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:clamp(42px,5vw,64px);font-weight:400}.explain{font-size:16px;color:#627386;margin-top:0;text-align:left;align-self:center}.end{color:inherit;font-weight:inherit}.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:26px}button{font:inherit;background:#237a4c;color:#fff;border:0;border-radius:14px;padding:15px 24px;font-weight:750;cursor:pointer}button:hover{background:#19613b}button.alt{background:#f1e6dd;color:#422c22}.footer{text-align:center;color:#84909a;font-size:12px;padding:16px}@media(max-width:900px){.shell{width:94%}header{padding-right:0}.top{margin-top:12px;justify-content:flex-end;flex-wrap:wrap}}@media(max-width:600px){h1{font-size:26px}.workspace{min-height:580px;padding:18px}.problem{margin-top:45px}}.aligned{display:grid;grid-template-columns:minmax(0,1fr) max-content minmax(0,1fr);column-gap:0;row-gap:10px;align-items:baseline;width:100%;max-width:100%;}.mathcell{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:clamp(38px,4.7vw,62px);font-weight:400;line-height:1.2;white-space:pre}.lhs{text-align:right;justify-self:end}.rhs{text-align:left;justify-self:start;position:relative}.equalscol{text-align:center;padding:0 .24em}.annotation{font:400 clamp(13px,1.3vw,17px) Geist,Arial,sans-serif;color:#657486;position:absolute;left:calc(100% + 24px);top:50%;transform:translateY(-50%);white-space:nowrap}.classification{grid-column:1/4;text-align:center;font-family:"Cambria Math",Cambria,Georgia,serif;font-size:clamp(38px,4.7vw,62px)}@media(max-width:600px){.annotation{left:calc(100% + 10px);font-size:12px}.aligned{row-gap:8px}}.special-note{grid-column:1/4;text-align:center;color:#657486;font-size:16px}.changed-term{color:#B54B12;font-weight:650}.mathcell .changed-term{font-weight:650}</style><div class="shell"><header><div><h1>Solving Equations</h1><p>Solve the equation, then click Continue to reveal each step.</p></div></header><div class="top"><select id="mode"><option value="two">Two-Step Equations</option><option value="both" selected>Variables on Both Sides</option><option value="dist">Distributive Property</option><option value="combine">Combining Like Terms</option><option value="special">No Solution / Infinitely Many</option><option value="mixed">Mixed Practice</option></select><div class="pill" id="count">Equations Solved: 0</div></div><main class="workspace"><div class="problem"><div class="aligned" id="steps" aria-live="polite"></div></div><div class="buttons"><button id="action">Check My Work</button><button class="alt" id="new">New Equation</button></div></main><div class="footer">Press Enter to reveal the next step.</div></div><script>
const el=id=>document.getElementById(id),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,nz=(a,b)=>{let v;do{v=rand(a,b)}while(!v);return v},term=(a,b)=>{let s=a===0?'':a===1?'x':a===-1?'-x':a+'x';return s+(b===0&&a!==0?'':a===0?String(b):b<0?' − '+(-b):' + '+b)},step=(eq,note)=>({eq,note});let cur,at=-1,solved=0,last='';
function variable(a){return a===1?'x':a===-1?'-x':a+'x'}
function expression(a,b,reverse=false){if(!a)return String(b);if(!b)return variable(a);if(reverse)return b+(a<0?' − ':' + ')+variable(Math.abs(a));return variable(a)+(b<0?' − ':' + ')+Math.abs(b)}
function change(value,kind=''){if(value===0)return 'No term to move.';const label=Math.abs(value)+kind;return 'Moved '+(value<0?'−':'+')+label+' across as '+(value<0?'+':'−')+label+'.'}
function divide(a){return 'Divided by '+a+'.'}
function flip(e){return e.split(' = ').reverse().join(' = ')}
function generate(mode){
 if(mode==='mixed')mode=['two','both','dist','combine','special'][rand(0,4)];
 const x=rand(-15,15),steps=[];let eq='',a,b,c,d;
 if(mode==='two'){
   a=nz(-8,8);b=nz(-14,14);d=a*x+b;
   const reverse=rand(0,1)===1,swapped=rand(0,1)===1;
   eq=expression(a,b,reverse)+' = '+d;
   steps.push(step(variable(a)+' = '+(d-b),change(b)));
   steps.push(step('x = '+x,divide(a)));
   if(swapped){eq=flip(eq);for(const item of steps)item.eq=flip(item.eq)}
 }
 if(mode==='both'){
   const z=nz(-7,7);a=nz(-7,7);c=a-z;b=rand(-12,12);d=z*x+b;
   const reverse=rand(0,1)===1,reverseRight=rand(0,1)===1,swapped=rand(0,1)===1;
   eq=expression(a,b,reverse)+' = '+expression(c,d,reverseRight);
   steps.push(step(expression(z,b,reverse)+' = '+d,change(c,'x')));
   steps.push(step(variable(z)+' = '+(d-b),change(b)));
   steps.push(step('x = '+x,divide(z)));
   if(swapped){eq=flip(eq);for(const item of steps)item.eq=flip(item.eq)}
 }
 if(mode==='combine'){
   let u=nz(-7,7),v=nz(-7,7),z=u+v;
   if(z===0){v=v===7?v-1:v+1;z=u+v}
   b=rand(-12,12);d=z*x+b;
   const order=rand(0,1)===1?[2,0,1]:[0,2,1];
   const signed=[{type:'x',value:u},{type:'x',value:v},{type:'constant',value:b}];
   function writeTerms(items){
     return items.map((item,i)=>{
       const val=item.value;
       const core=item.type==='x'?variable(Math.abs(val)):String(Math.abs(val));
       return i===0?(val<0?'-':'')+core:(val<0?' − ':' + ')+core;
     }).join('');
   }
   const arranged=order.map(i=>signed[i]).filter(item=>item.value!==0);
   eq=writeTerms(arranged)+' = '+d;
   if(b!==0){
     const withoutConstant=arranged.filter(item=>item.type==='x');
     steps.push(step(writeTerms(withoutConstant)+' = '+(d-b),change(b)));
   }
   steps.push(step(variable(z)+' = '+(d-b),'Combined like terms.'));
   steps.push(step('x = '+x,divide(z)));
   if(rand(0,1)){eq=flip(eq);for(const item of steps)item.eq=flip(item.eq)}
 }
 if(mode==='dist'){
   const k=nz(-5,5),u=nz(-6,6),v=rand(-8,8),z=k*u;
   c=rand(-5,5);if(c===z)c++;
   d=(z-c)*x+k*v;
   const reverse=rand(0,1)===1,swapped=rand(0,1)===1;
   const reverseRight=rand(0,1)===1;eq=k+'('+expression(u,v,reverse)+') = '+expression(c,d,reverseRight);
   steps.push(step(expression(z,k*v,reverse)+' = '+expression(c,d,reverseRight),'Distributed '+k+'.'));
   if(c!==0)steps.push(step(expression(z-c,k*v,reverse)+' = '+d,change(c,'x')));
   steps.push(step(variable(z-c)+' = '+(d-k*v),change(k*v)));
   steps.push(step('x = '+x,divide(z-c)));
   if(swapped){eq=flip(eq);for(const item of steps)item.eq=flip(item.eq)}
 }
 if(mode==='special'){
   const k=nz(-5,5),u=nz(-5,5),v=rand(-9,9),z=k*u,q=k*v,inf=rand(0,1)===0;
   d=inf?q:q+nz(-9,9);
   const reverse=rand(0,1)===1,reverseRight=rand(0,1)===1;eq=k+'('+expression(u,v,reverse)+') = '+expression(z,d,reverseRight);
   steps.push(step(expression(z,q,reverse)+' = '+expression(z,d,reverseRight),'Distributed '+k+'.'));
   if(z!==0)steps.push(step(q+' = '+d,change(z,'x')));
   steps.push(step(inf?'Infinitely Many Solutions':'No Solution',inf?'The statement is true for every value of x.':'The statement is false for every value of x.'));
   if(rand(0,1)){eq=flip(eq);for(const item of steps)if(item.eq.includes(' = '))item.eq=flip(item.eq)}
 }
 return {eq,S:steps,mode};
}
function reset(){let p;for(let j=0;j<25;j++){p=generate(el('mode').value);if(p.eq!==last)break}cur=p;last=p.eq;at=-1;el('steps').replaceChildren();delete el('steps').dataset.previousEquation;renderRow(cur.eq,'');el('action').textContent='Continue'}
function tokenizeSide(text){
 const tokens=[];
 const re=/[+−-]?\s*(?:\d+(?:x)?|x|\([^()]*\))/g;
 let m;while((m=re.exec(text))!==null){let raw=m[0].trim();if(!raw)continue;tokens.push(raw.replace(/\s+/g,''))}
 return tokens.length?tokens:[text.trim()];
}
function normalizedTerm(token){return token.replace(/^[+]/,'').replace(/−/g,'-')}
function termTokens(text){return tokenizeSide(text)}
function appendTerms(node,text,priorText,highlight){
 if(!highlight||priorText===null){node.textContent=text;return}
 const tokens=termTokens(text),oldTokens=termTokens(priorText);
 const remaining=new Map();
 for(const t of oldTokens){const k=normalizedTerm(t);remaining.set(k,(remaining.get(k)||0)+1)}
 const fragments=[];
 for(const token of tokens){
  const key=normalizedTerm(token),count=remaining.get(key)||0;
  const changed=count===0;
  if(count)remaining.set(key,count-1);
  fragments.push({token,changed});
 }
 for(let i=0;i<fragments.length;i++){
  const {token,changed}=fragments[i];
  const match=token.match(/^([+−-]?)(.*)$/),sign=match[1],body=match[2];
  const printed=i===0?(sign==='+'?'':sign==='-'?'−':sign)+body:(sign==='-'||sign==='−'?' − ':' + ')+body;
  const span=document.createElement('span');
  if(changed)span.className='changed-term';
  span.textContent=printed;
  node.append(span);
 }
}
function renderRow(eq,note){
 const grid=el('steps'),parts=eq.split(' = ');
 if(parts.length!==2){
  const special=document.createElement('div');special.className='classification';special.textContent=eq;grid.append(special);
  if(note){const n=document.createElement('div');n.className='special-note';n.textContent='('+note+')';grid.append(n)}
  return;
 }
 const previous=grid.dataset.previousEquation||null;
 const oldParts=previous?previous.split(' = '):null;
 for(const [i,txt] of [parts[0],'=',parts[1]].entries()){
  const node=document.createElement('div');node.className='mathcell '+['lhs','equalscol','rhs'][i];
  if(i===1)node.textContent='=';
  else appendTerms(node,txt,oldParts?oldParts[i]:null,!!oldParts);
  grid.append(node);
 }
 if(note){const n=document.createElement('span');n.className='annotation';n.textContent='('+note+')';grid.lastElementChild.append(n)}
 grid.dataset.previousEquation=eq;
}
function advance(){if(at===cur.S.length-1){reset();return}at++;const s=cur.S[at];renderRow(s.eq,s.note);if(at===cur.S.length-1){solved++;el('count').textContent='Equations Solved: '+solved;el('action').textContent='Continue'}else el('action').textContent='Continue'}

el('action').onclick=advance;el('new').onclick=reset;el('mode').onchange=reset;document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='SELECT'){e.preventDefault();advance()}});reset();</script></html>
