<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exploring Linear Functions</title><style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:Geist,Arial,sans-serif}main{height:100dvh;max-width:1250px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:10px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}h1{font-size:clamp(20px,3vw,30px);margin:0}nav{display:flex;background:#dfe4eb;border-radius:30px;padding:3px}button{font:inherit;cursor:pointer;border:1px solid #cbd5e1;background:white;border-radius:9px;padding:8px 12px}nav button{border:0;background:transparent;border-radius:30px}nav button.active{background:white;box-shadow:0 1px 4px #0002}.workspace{flex:1;min-height:0;background:white;border:1px solid #cbd5e1;border-radius:20px;padding:12px;display:grid;grid-template-columns:minmax(220px,32%) 1fr;gap:12px}.controls,.plot{border:1px solid #dbe0e7;border-radius:14px;min-height:0;min-width:0}.controls{display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,2vh,22px);padding:16px;background:#fafafa}.plot{overflow:hidden;position:relative}canvas{width:100%;height:100%;display:block}.eq{font-family:Cambria,serif;font-size:clamp(24px,4vw,42px);display:flex;align-items:center;justify-content:center;gap:4px;min-height:54px}.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;font-size:.78em;line-height:1.05}.frac span:first-child{border-bottom:1.5px solid;padding:0 3px}.field{display:flex;align-items:center;justify-content:space-between;gap:8px}input[type=text]{width:90px;font:inherit;text-align:center;border:1px solid #bbc3cf;border-radius:8px;padding:6px}input[type=range]{width:100%;accent-color:#2878cf}.ends{display:flex;justify-content:space-between;font-size:12px;color:#667085}.compare{font-size:14px;display:flex;align-items:center;gap:7px}.legend{font-size:12px;color:#667085;min-height:15px}.error{font-size:12px;color:#9b2020;min-height:14px} [hidden]{display:none!important}@media(max-width:650px){main{padding:6px;gap:5px}.workspace{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:6px;gap:6px}.controls{padding:8px;gap:5px}.eq{min-height:32px;font-size:24px}.control{display:grid;grid-template-columns:120px 1fr;gap:6px;align-items:center}.ends{display:none}.legend,.error:empty{display:none}button{padding:5px 9px}header{justify-content:center}}@media(max-height:480px) and (min-width:651px){.controls{gap:4px;padding:8px}.eq{min-height:30px;font-size:24px}}
.eq{height:76px;min-height:76px;flex-shrink:0;line-height:1}.fifths{height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:24px;font-family:Cambria,serif;grid-column:1/-1}.fifths small{font:14px Geist,Arial;color:#667085}.controls{justify-content:center}@media(max-height:480px),(max-width:650px){.eq{height:48px;min-height:48px}.fifths{height:34px;font-size:19px}}.denominator{margin-top:6px;grid-column:1/-1}.denominator select{font:inherit;border:1px solid #bbc3cf;border-radius:8px;background:white;padding:4px 10px;width:90px}.controls{position:relative;gap:clamp(10px,2vh,20px);padding:18px;background:#fafafa}.settingsbar{position:absolute;right:10px;top:10px;z-index:3}.settingsbar button{font-size:21px;padding:3px 9px;background:transparent;border:0}.settingsbar #refs{position:absolute;right:0;top:38px;width:220px;background:white;border:1px solid #dbe0e7;border-radius:10px;padding:12px;box-shadow:0 4px 16px #0002;display:grid;gap:8px}.control{display:block;min-width:0}.mathvalue{font:24px Cambria,serif;margin-bottom:8px}.sliderrow{display:flex;align-items:center;gap:4px}.sliderrow input[type=text]{width:49px;min-width:0;padding:4px 0;border:1px solid transparent;background:transparent;color:#59616c;font-size:13px}.sliderrow input[type=text]:hover,.sliderrow input[type=text]:focus{border-color:#bbc3cf;background:white}.sliderrow input[type=range]{flex:1;min-width:0;margin:0}.precision{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:16px;font-size:13px;color:#667085}.segments{display:flex;background:#e6e9ee;padding:3px;border-radius:20px}.segments button{border:0;background:transparent;border-radius:20px;padding:5px 12px;font-size:13px}.segments button.active{background:white;box-shadow:0 1px 3px #0002;color:#172033}.error{min-height:14px}.eq{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:clamp(22px,3vw,40px)}@media(max-width:650px){.controls{padding:8px;gap:5px}.mathvalue{font-size:18px;margin:0}.precision{margin-top:4px}.settingsbar{top:3px;right:3px}.error:empty{display:none}.eq{height:38px;min-height:38px}}</style><main><header><h1>Exploring Linear Functions</h1><nav aria-label="Mode"><button data-mode="slope">Slope</button><button data-mode="intercept">Y-Intercept</button><button data-mode="both">Both</button></nav></header><section class="workspace"><div class="controls"><div class="settingsbar"><button id="settings" aria-label="Reference line settings" aria-expanded="false" title="Reference lines">⚙</button><div id="refs" hidden><label class="compare"><input id="refPos" type="checkbox" checked> y = 1x</label><label class="compare" id="negLabel"><input id="refNeg" type="checkbox"> y = −1x</label><label class="compare" id="parallelLabel"><input id="refParallel" type="checkbox" checked> Same slope, y-intercept 0</label></div></div><div class="eq" id="eq" aria-live="polite"></div><div class="control" id="mc"><div class="mathvalue" id="mv"></div><div class="sliderrow"><input id="smin" aria-label="Minimum slope" type="text" inputmode="decimal"><input id="ms" type="range" aria-label="Slope slider"><input id="smax" aria-label="Maximum slope" type="text" inputmode="decimal"></div><div class="precision"><span>Increments</span><div class="segments"><button data-step="0.1">0.1</button><button data-step="0.01">0.01</button></div></div></div><div class="control" id="bc"><div class="mathvalue" id="bv"></div><div class="sliderrow"><input id="bmin" aria-label="Minimum y-intercept" type="text" inputmode="decimal"><input id="bs" type="range" aria-label="Y-intercept slider"><input id="bmax" aria-label="Maximum y-intercept" type="text" inputmode="decimal"></div></div><div class="error" id="error" role="status"></div><button id="reset">↶ Reset</button></div><div class="plot"><button id="quadrant" aria-pressed="true" style="position:absolute;right:8px;top:8px;z-index:2;font-size:12px;background:#fffffff2">Zoom Out</button><canvas id="graph" aria-label="Coordinate plane"></canvas></div></section></main><script>
const $=id=>document.getElementById(id),c=$('graph'),ctx=c.getContext('2d');let step=.1,smin=-2,smax=2,bmin=-8,bmax=8;let first=true;let zoom=1,zoomFrame=0;let mode='slope',m=1,b=0,exactM='1',exactB='0';
function gcd(a,b){return b?gcd(b,a%b):Math.abs(a)}
function rational(v){for(let d=1;d<=100;d++){let n=Math.round(v*d);if(Math.abs(n/d-v)<1e-9)return d===1?String(n):n+'/'+d}return String(+v.toFixed(6))}
function parse(s){s=s.trim().replace(/−/g,'-');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:\s*\/\s*[+-]?(?:\d+(?:\.\d*)?|\.\d+))?$/.test(s))return NaN;let p=s.split('/').map(Number);return p.length===2?p[0]/p[1]:p[0]}
function fmt(s){let p=s.split('/');return p.length===2?(p[0][0]==='-'?'−':'')+'<span class="frac"><span>'+Math.abs(Number(p[0]))+'</span><span>'+p[1]+'</span></span>':s.replace('-','−')}
function num(v){return String(+v.toFixed(2)).replace('-','−')}
function refresh(){ $('ms').style.accentColor=m>0?'#1F75FE':m<0?'#EE204D':'#344054';for(const [id,v,lo,hi,inc] of [['ms',m,smin,smax,step],['bs',b,bmin,bmax,1]]){let el=$(id);el.min=lo;el.max=hi;el.step=inc;el.value=v}for(const [id,v] of [['smin',smin],['smax',smax],['bmin',bmin],['bmax',bmax]])$(id).value=num(v);$('mv').textContent='m = '+num(m);$('bv').textContent='b = '+num(b);$('mc').hidden=mode==='intercept';$('bc').hidden=mode==='slope';$('negLabel').hidden=mode==='intercept';$('parallelLabel').hidden=mode!=='both';$('eq').textContent='y = '+num(m)+'x'+(b===0?'':b<0?' − '+num(-b):' + '+num(b));document.querySelectorAll('[data-step]').forEach(el=>{el.classList.toggle('active',+el.dataset.step===step);el.setAttribute('aria-pressed',String(+el.dataset.step===step))});document.querySelectorAll('nav button').forEach(el=>{el.classList.toggle('active',el.dataset.mode===mode);el.setAttribute('aria-pressed',el.dataset.mode===mode)});draw()}
function setMode(v){mode=v;m=1;b=0;step=.1;smin=-2;smax=2;bmin=-8;bmax=8;$('refPos').checked=true;$('refNeg').checked=false;$('refParallel').checked=true;$('refs').hidden=true;$('settings').setAttribute('aria-expanded','false');$('error').textContent='';refresh()}
function draw(){let w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;let d=devicePixelRatio||1;c.width=Math.round(w*d);c.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);let base=Math.min(w,h)/20,close=Math.min(w-34,h-34)/10,u=base*Math.pow(close/base,zoom),ox=w/2+(30-w/2)*zoom,oy=h/2+(h-30-h/2)*zoom,X=x=>ox+x*u,Y=y=>oy-y*u;let xmin=-ox/u,xmax=(w-ox)/u,ymin=(oy-h)/u,ymax=oy/u;ctx.fillStyle='#c5cbd3';for(let x=Math.ceil(xmin);x<=xmax;x++)for(let y=Math.ceil(ymin);y<=ymax;y++){ctx.beginPath();ctx.arc(X(x),Y(y),1.1,0,Math.PI*2);ctx.fill()}function arrow(x,y,ang,col,size){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-size*Math.cos(ang)+size*.45*Math.sin(ang),y-size*Math.sin(ang)-size*.45*Math.cos(ang));ctx.lineTo(x-size*Math.cos(ang)-size*.45*Math.sin(ang),y-size*Math.sin(ang)+size*.45*Math.cos(ang));ctx.closePath();ctx.fill()}function segment(x1,y1,x2,y2,col,width,arrows,dash){let a=Math.atan2(y2-y1,x2-x1),s=arrows?12:0;ctx.strokeStyle=col;ctx.lineWidth=width;ctx.setLineDash(dash?[6,5]:[]);ctx.beginPath();ctx.moveTo(x1+s*Math.cos(a),y1+s*Math.sin(a));ctx.lineTo(x2-s*Math.cos(a),y2-s*Math.sin(a));ctx.stroke();ctx.setLineDash([]);if(arrows){arrow(x1,y1,a+Math.PI,col,14);arrow(x2,y2,a,col,14)}}segment(1,oy,w-1,oy,'#59616c',1.2,true,false);segment(ox,1,ox,h-1,'#59616c',1.2,true,false);ctx.fillStyle='#59616c';ctx.font='11px Geist,Arial';ctx.textAlign='center';for(let x=Math.ceil(xmin);x<xmax-0.5;x++)if(x&& (u>23||x%2===0))ctx.fillText(x,X(x),oy+14);ctx.textAlign='right';for(let y=Math.ceil(ymin);y<ymax-.5;y++)if(y&&(u>23||y%2===0))ctx.fillText(y,ox-7,Y(y)+4);
function line(k,j,col,width,dash){let lo=xmin,hi=xmax;if(k!==0){let a=(ymin-j)/k,z=(ymax-j)/k;lo=Math.max(lo,Math.min(a,z));hi=Math.min(hi,Math.max(a,z))}else if(j<ymin||j>ymax)return;if(lo>=hi)return;segment(X(lo),Y(k*lo+j),X(hi),Y(k*hi+j),col,width,!dash,dash)}
if($('refPos').checked){line(1,0,'#b6bbc3',1.25,true);let rad=2*u;ctx.strokeStyle='#858e9a';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(ox,oy,rad,-Math.PI/4,0);ctx.stroke();ctx.fillStyle='#737d8b';ctx.font='600 16px Geist,Arial';ctx.textAlign='left';ctx.fillText('45°',ox+rad+5,oy-rad*.36);}if(mode!=='intercept'&&$('refNeg').checked)line(-1,0,'#b6bbc3',1.25,true);if(mode==='both'&&$('refParallel').checked&&b!==0&&m!==1&&m!==-1)line(m,0,'#b6bbc3',1.25,true);else if(mode==='both'&&$('refParallel').checked&&b!==0&&((m===1&&!$('refPos').checked)||(m===-1&&!$('refNeg').checked)))line(m,0,'#b6bbc3',1.25,true);const color=m>0?'#1F75FE':m<0?'#EE204D':'#344054';line(m,b,color,3.5,false);let lo=xmin,hi=xmax;if(m!==0){let a=(ymin-b)/m,z=(ymax-b)/m;lo=Math.max(lo,Math.min(a,z));hi=Math.min(hi,Math.max(a,z))}if((hi-lo)*u*Math.hypot(1,m)>145){let x=lo+(hi-lo)*.60,y=m*x+b,angle=-Math.atan(m),label=m>0?'Positive Slope':m<0?'Negative Slope':'Zero Slope';ctx.save();ctx.translate(X(x),Y(y));ctx.rotate(angle);ctx.font='700 '+Math.max(12,Math.min(19,Math.min(w,h)/24))+'px Geist, Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.strokeStyle='white';ctx.lineWidth=5;ctx.strokeText(label,0,0);ctx.fillStyle=color;ctx.fillText(label,0,0);ctx.restore()}}
function snap(v,lo,hi,inc){return +Math.max(lo,Math.min(hi,lo+Math.round((v-lo)/inc)*inc)).toFixed(2)}
$('ms').oninput=()=>{m=+$('ms').value;refresh()};$('bs').oninput=()=>{b=+$('bs').value;refresh()};
for(const id of ['smin','smax','bmin','bmax']){let el=$(id);el.onfocus=()=>el.select();el.onchange=()=>{let v=parse(el.value),slope=id[0]==='s',inc=slope?step:1,lo=slope?smin:bmin,hi=slope?smax:bmax;v=+(Math.round(v/inc)*inc).toFixed(2);if(!Number.isFinite(v)||Math.abs(v)>100||(id.endsWith('min')?v>=hi:v<=lo)){$('error').textContent='Enter a valid range from −100 to 100.';refresh();return}if(id.endsWith('min'))lo=v;else hi=v;if(slope){smin=lo;smax=hi;m=snap(m,lo,hi,inc)}else{bmin=lo;bmax=hi;b=snap(b,lo,hi,inc)}$('error').textContent='';refresh()};el.onkeydown=e=>{if(e.key==='Enter')el.blur()}}
document.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>{step=+el.dataset.step;smin=+(Math.floor(smin/step+1e-8)*step).toFixed(2);smax=+(Math.ceil(smax/step-1e-8)*step).toFixed(2);m=snap(m,smin,smax,step);refresh()});$('settings').onclick=()=>{$('refs').hidden=!$('refs').hidden;$('settings').setAttribute('aria-expanded',String(!$('refs').hidden))};
$('quadrant').onclick=()=>{first=!first;$('quadrant').textContent=first?'Zoom Out':'Zoom In';$('quadrant').setAttribute('aria-pressed',String(first));cancelAnimationFrame(zoomFrame);const from=zoom,to=first?1:0,start=performance.now();function animate(now){let t=Math.min(1,(now-start)/420),e=t*t*(3-2*t);zoom=from+(to-from)*e;draw();if(t<1)zoomFrame=requestAnimationFrame(animate)}zoomFrame=requestAnimationFrame(animate)};document.querySelectorAll('nav button').forEach(el=>el.onclick=()=>setMode(el.dataset.mode));for(const id of ['refPos','refNeg','refParallel'])$(id).onchange=refresh;$('reset').onclick=()=>{setMode(mode);if(!first)$('quadrant').click()};new ResizeObserver(draw).observe(c);let q=new URLSearchParams(location.search).get('mode');setMode(['slope','intercept','both'].includes(q)?q:'slope');
</script></html>
