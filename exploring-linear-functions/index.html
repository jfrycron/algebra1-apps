<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exploring Linear Functions</title><style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:Geist,Arial,sans-serif}main{height:100dvh;max-width:1250px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:10px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}h1{font-size:clamp(20px,3vw,30px);margin:0}nav{display:flex;background:#dfe4eb;border-radius:30px;padding:3px}button{font:inherit;cursor:pointer;border:1px solid #cbd5e1;background:white;border-radius:9px;padding:8px 12px}nav button{border:0;background:transparent;border-radius:30px}nav button.active{background:white;box-shadow:0 1px 4px #0002}.workspace{flex:1;min-height:0;background:white;border:1px solid #cbd5e1;border-radius:20px;padding:12px;display:grid;grid-template-columns:minmax(220px,32%) 1fr;gap:12px}.controls,.plot{border:1px solid #dbe0e7;border-radius:14px;min-height:0;min-width:0}.controls{display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,2vh,22px);padding:16px;background:#fafafa}.plot{overflow:hidden;position:relative}canvas{width:100%;height:100%;display:block}.eq{font-family:Cambria,serif;font-size:clamp(24px,4vw,42px);display:flex;align-items:center;justify-content:center;gap:4px;min-height:54px}.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;font-size:.78em;line-height:1.05}.frac span:first-child{border-bottom:1.5px solid;padding:0 3px}.field{display:flex;align-items:center;justify-content:space-between;gap:8px}input[type=text]{width:90px;font:inherit;text-align:center;border:1px solid #bbc3cf;border-radius:8px;padding:6px}input[type=range]{width:100%;accent-color:#2878cf}.ends{display:flex;justify-content:space-between;font-size:12px;color:#667085}.compare{font-size:14px;display:flex;align-items:center;gap:7px}.legend{font-size:12px;color:#667085;min-height:15px}.error{font-size:12px;color:#9b2020;min-height:14px} [hidden]{display:none!important}@media(max-width:650px){main{padding:6px;gap:5px}.workspace{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:6px;gap:6px}.controls{padding:8px;gap:5px}.eq{min-height:32px;font-size:24px}.control{display:grid;grid-template-columns:120px 1fr;gap:6px;align-items:center}.ends{display:none}.legend,.error:empty{display:none}button{padding:5px 9px}header{justify-content:center}}@media(max-height:480px) and (min-width:651px){.controls{gap:4px;padding:8px}.eq{min-height:30px;font-size:24px}}
</style><main><header><h1>Exploring Linear Functions</h1><nav aria-label="Mode"><button data-mode="slope">Slope</button><button data-mode="intercept">Y-Intercept</button><button data-mode="both">Both</button></nav></header><section class="workspace"><div class="controls"><div class="eq" id="eq" aria-live="polite"></div><div class="control" id="mc"><div class="field"><label for="mt">Slope (m)</label><input id="mt" type="text" aria-label="Exact slope"></div><div><input id="ms" type="range" min="-8" max="8" step=".25" aria-label="Slope slider"><div class="ends"><span>-8</span><span>0</span><span>8</span></div></div></div><div class="control" id="bc"><div class="field"><label for="bt">Y-intercept (b)</label><input id="bt" type="text" aria-label="Exact y-intercept"></div><div><input id="bs" type="range" min="-8" max="8" step="1" aria-label="Y-intercept slider"><div class="ends"><span>-8</span><span>0</span><span>8</span></div></div></div><div style="display:flex;flex-direction:column;gap:5px"><label class="compare"><input id="refPos" type="checkbox" checked> y = x</label><label class="compare" id="negLabel"><input id="refNeg" type="checkbox" checked> y = −x</label><label class="compare" id="parallelLabel"><input id="refParallel" type="checkbox" checked> Same slope, y-intercept 0</label></div><div class="error" id="error" role="status"></div><button id="reset">Reset</button></div><div class="plot"><canvas id="graph" aria-label="Coordinate plane"></canvas></div></section></main><script>
const $=id=>document.getElementById(id),c=$('graph'),ctx=c.getContext('2d');let mode='slope',m=1,b=0,exactM='1',exactB='0';
function gcd(a,b){return b?gcd(b,a%b):Math.abs(a)}
function rational(v){for(let d=1;d<=100;d++){let n=Math.round(v*d);if(Math.abs(n/d-v)<1e-9)return d===1?String(n):n+'/'+d}return String(+v.toFixed(6))}
function parse(s){s=s.trim().replace(/−/g,'-');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:\s*\/\s*[+-]?(?:\d+(?:\.\d*)?|\.\d+))?$/.test(s))return NaN;let p=s.split('/').map(Number);return p.length===2?p[0]/p[1]:p[0]}
function fmt(s){let p=s.split('/');return p.length===2?(p[0][0]==='-'?'−':'')+'<span class="frac"><span>'+Math.abs(Number(p[0]))+'</span><span>'+p[1]+'</span></span>':s.replace('-','−')}
function refresh(){ $('mt').value=exactM;$('bt').value=exactB;$('ms').value=m;$('bs').value=b;$('mc').hidden=mode==='intercept';$('bc').hidden=mode==='slope';$('negLabel').hidden=mode==='intercept';$('parallelLabel').hidden=mode!=='both';let term=m===0?'':m===1?'x':m===-1?'−x':fmt(exactM)+'x';let tail=b===0?(m===0?'0':''):(m===0?fmt(exactB):(b<0?' − ':' + ')+fmt(exactB.replace('-','')));$('eq').innerHTML='y = '+term+tail;document.querySelectorAll('nav button').forEach(el=>{el.classList.toggle('active',el.dataset.mode===mode);el.setAttribute('aria-pressed',el.dataset.mode===mode)});draw()}
function setMode(v){mode=v;m=1;b=0;exactM='1';exactB='0';for(const id of ['refPos','refNeg','refParallel'])$(id).checked=true;$('error').textContent='';refresh()}
function draw(){let w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;let d=devicePixelRatio||1;c.width=Math.round(w*d);c.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);let u=Math.min(w,h)/20,ox=w/2,oy=h/2,X=x=>ox+x*u,Y=y=>oy-y*u;let xmin=-ox/u,xmax=ox/u,ymin=-oy/u,ymax=oy/u;ctx.fillStyle='#c5cbd3';for(let x=Math.ceil(xmin);x<=xmax;x++)for(let y=Math.ceil(ymin);y<=ymax;y++){ctx.beginPath();ctx.arc(X(x),Y(y),1.1,0,Math.PI*2);ctx.fill()}function arrow(x,y,ang,col,size){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-size*Math.cos(ang)+size*.45*Math.sin(ang),y-size*Math.sin(ang)-size*.45*Math.cos(ang));ctx.lineTo(x-size*Math.cos(ang)-size*.45*Math.sin(ang),y-size*Math.sin(ang)+size*.45*Math.cos(ang));ctx.closePath();ctx.fill()}function segment(x1,y1,x2,y2,col,width,arrows,dash){let a=Math.atan2(y2-y1,x2-x1),s=arrows?12:0;ctx.strokeStyle=col;ctx.lineWidth=width;ctx.setLineDash(dash?[6,5]:[]);ctx.beginPath();ctx.moveTo(x1+s*Math.cos(a),y1+s*Math.sin(a));ctx.lineTo(x2-s*Math.cos(a),y2-s*Math.sin(a));ctx.stroke();ctx.setLineDash([]);if(arrows){arrow(x1,y1,a+Math.PI,col,14);arrow(x2,y2,a,col,14)}}segment(1,oy,w-1,oy,'#59616c',1.2,true,false);segment(ox,1,ox,h-1,'#59616c',1.2,true,false);ctx.fillStyle='#59616c';ctx.font='11px Geist,Arial';ctx.textAlign='center';for(let x=Math.ceil(xmin)+1;x<xmax-0.5;x++)if(x&& (u>23||x%2===0))ctx.fillText(x,X(x),oy+14);ctx.textAlign='right';for(let y=Math.ceil(ymin)+1;y<ymax-.5;y++)if(y&&(u>23||y%2===0))ctx.fillText(y,ox-7,Y(y)+4);
function line(k,j,col,width,dash){let lo=xmin,hi=xmax;if(k!==0){let a=(ymin-j)/k,z=(ymax-j)/k;lo=Math.max(lo,Math.min(a,z));hi=Math.min(hi,Math.max(a,z))}else if(j<ymin||j>ymax)return;if(lo>=hi)return;segment(X(lo),Y(k*lo+j),X(hi),Y(k*hi+j),col,width,!dash,dash)}
if($('refPos').checked)line(1,0,'#b6bbc3',1.25,true);if(mode!=='intercept'&&$('refNeg').checked)line(-1,0,'#b6bbc3',1.25,true);if(mode==='both'&&$('refParallel').checked&&b!==0&&m!==1&&m!==-1)line(m,0,'#b6bbc3',1.25,true);else if(mode==='both'&&$('refParallel').checked&&b!==0&&((m===1&&!$('refPos').checked)||(m===-1&&!$('refNeg').checked)))line(m,0,'#b6bbc3',1.25,true);line(m,b,'#2878cf',3.5,false)}
for(let key of ['m','b']){let input=$(key+'t'),slider=$(key+'s');function apply(v){if(key==='m'){m=v;exactM=rational(v)}else{b=v;exactB=rational(v)}$('error').textContent='';refresh()}slider.oninput=()=>apply(+slider.value);input.onchange=()=>{let v=parse(input.value);if(!Number.isFinite(v)||Math.abs(v)>8){$('error').textContent='Enter a number or fraction from -8 to 8.';return}apply(v)};input.onkeydown=e=>{if(e.key==='Enter'){input.onchange();input.blur()}}}
document.querySelectorAll('nav button').forEach(el=>el.onclick=()=>setMode(el.dataset.mode));for(const id of ['refPos','refNeg','refParallel'])$(id).onchange=refresh;$('reset').onclick=()=>setMode(mode);new ResizeObserver(draw).observe(c);let q=new URLSearchParams(location.search).get('mode');setMode(['slope','intercept','both'].includes(q)?q:'slope');
</script></html>
