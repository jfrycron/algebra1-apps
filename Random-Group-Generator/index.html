(()=>{'use strict';const KEY='carron-random-groups-v1';const $=id=>document.getElementById(id);const palette=['#ffe78b','#f9bdc9','#b9e1f6','#c7e8b0','#dec9f6','#ffd4a8','#b8e6df','#f6c8e6','#fff0ae','#c6d6fa','#d5e8b9','#f6c9a4'];const defaultState=()=>({rosters:{'1st Hour':[],'2nd Hour':[],'3rd Hour':[],'4th Hour':[],'5th Hour':[],'6th Hour':[]},selected:'1st Hour',mode:'size',size:3,count:11,absent:{},attendanceDay:'',groups:[]});let state;try{const raw=JSON.parse(localStorage.getItem(KEY));state={...defaultState(),...raw};if(!state.rosters||typeof state.rosters!=='object')throw Error('invalid');}catch{state=defaultState()}let busy=false;const today=()=>new Date().toLocaleDateString('en-CA');if(state.attendanceDay!==today()){state.absent={};state.attendanceDay=today();state.groups=[]}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Browser storage is unavailable. Export your rosters as a backup.')}};const roster=()=>state.rosters[state.selected]||[];const absent=()=>new Set(state.absent[state.selected]||[]);const present=()=>roster().filter(n=>!absent().has(n));const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function updateSelect(){const keys=Object.keys(state.rosters);if(!keys.length){state.rosters['1st Hour']=[];state.selected='1st Hour'}if(!state.rosters[state.selected])state.selected=Object.keys(state.rosters)[0];$('classSelect').innerHTML=Object.keys(state.rosters).map(k=>`<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('');$('classSelect').value=state.selected;$('groupMode').value=state.mode;$('groupValue').value=state.mode==='size'?state.size:state.count;updateInfo()}function updateInfo(){$('absentCount').textContent=absent().size?`(${absent().size} absent)`:'';$('status').textContent=`${present().length} present`;$('hint').style.display=state.groups.length?'':'none'}function numGroups(n){if(!n)return 0;return state.mode==='size'?Math.ce .clientHeight||$('board').clientHeight-40;const {cols,rows}=gridDimensions(groups.length,w,h);const gap=Math.min(18,Math.max(8,w*.013));const capSmall=groups.length<=4;const cw=capSmall?Math.min(420,(w-(cols-1)*gap)/cols):(w-(cols-1)*13)/cols;const ch=capSmall?Math.min(360,(h-(rows-1)*gap)/rows):(h-(rows-1)*13)/rows;root.style.gridTemplateColumns=capSmall?`repeat(${cols}, minmax(0, ${cw}px))`:`repeat(${cols}, minmax(0, 1fr))`;root.style.gridTemplateRows=capSmall?`repeat(${rows}, minmax(0, ${ch}px))`:`repeat(${rows}, minmax(0, 1fr))`;root.style.justifyContent=capSmall?'center':'stretch';root.style.alignContent=capSmall?'center':'stretch';const maxNames=Math.max(...groups.map(g=>g.length),1);const titleSize=Math.max(12,Math.min(27,ch*.19,cw*.14));const nameSize=Math.max(10,Math.min(33,cw*.16,(ch-titleSize-24)/(maxNames*1.19)));root.style.setProperty('--title-size',titleSize+'px');root.style.setProperty('--name-size',nameSize+'px');root.innerHTML=groups.map((g,i)=>`<section class="note" data-group="${i}" style="background:${palette[i%palette.length]};--rot:${[-.5,.4,-.3,.2,0][i%5]}deg"><span class="pin" aria-hidden="true"></span><div class="note-title">Group ${i+1}</div><div class="names">${g.map(name=>`<div class="student" tabindex="0" draggable="true" data-name="${escapeHtml(name)}" title="Drag to another group or press Enter to move">${escapeHtml(name)}</div>`).join('')}</div></section>`).join('');bindDrag();fitStudentNames()}function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const rand=new Uint32Array(1);if(crypto&&crypto.getRandomValues)crypto.getRandomValues(rand);else rand[0]=Math.floor(Math.random()*4294967295);const j=rand[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function makeGroups(){const names=shuffled(present()),n=numGroups(names.length);if(!n)return [];const groups=Array.from({length:n},()=>[]);names.forEach((name,i)=>groups[i%n].push(name));return groups}async function shuffle(){

ill()};$('saveRoster').onclick=()=>{store();updateSelect();render()};$('addClass').onclick=()=>{store();const name=prompt('Name this class (for example, 7th Hour):');if(!name||!name.trim())return;const key=name.trim();if(state.rosters[key]){alert('That class already exists.');return}state.rosters[key]=[];state.selected=key;state.groups=[];save();fill()};$('renameClass').onclick=()=>{store();const old=sel.value;const name=prompt('New class name:',old);if(!name||!name.trim()||name.trim()===old)return;const key=name.trim();if(state.rosters[key]){alert('That class already exists.');return}state.rosters[key]=state.rosters[old];delete state.rosters[old];state.absent[key]=state.absent[old]||[];delete state.absent[old];state.selected=key;save();fill()};$('deleteClass').onclick=()=>{if(Object.keys(state.rosters).length===1){alert('Keep at least one class.');return}if(!confirm(`Delete ${sel.value} and its roster?`))return;delete state.rosters[sel.value];delete state.absent[sel.value];state.selected=Object.keys(state.rosters)[0];state.groups=[];save();fill()};$('exportBtn').onclick=()=>{store();const data={version:1,rosters:state.rosters};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='class-rosters-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data.rosters||typeof data.rosters!=='object'||Array.isArray(data.rosters))throw Error();const next={};for(const [k,v] of Object.entries(data.rosters)){if(!k.trim()||!Array.isArray(v)||!v.every(x=>typeof x==='string'))throw Error();next[k]=v.map(x=>x.trim()).filter(Boolean)}if(!Object.keys(next).length)throw Error();if(!confirm('Replace your saved class rosters with this backup?'))return;state.rosters=next;state.selected=Object.keys(next)[0];state.absent={};state.groups=[];save();fill();updateSelect();render()}catch{alert('That is not a valid roster backup file.')}};wireClose()}
function attendanceModal(){const names=roster();modal('Today’s Attendance',`<div class="row attendance-top"><strong id="attendanceSummary"></strong></div><div class="attendance-grid" id="people"></div><div class="attendance-footer"><button class="btn" id="allPresent">All Present</button><button class="btn" id="allAbsent">Deselect All</button><button class="btn primary" id="attendanceDone">Done</button></div>`);$('panel').querySelector('.modal').classList.add('attendance-modal');const lastNames=names.map(n=>n.trim().split(/\\s+/).slice(-1)[0]);function labelFor(n,i){const last=lastNames[i],matches=lastNames.filter(x=>x.toLowerCase()===last.toLowerCase()).length;if(matches===1)return last;const first=n.trim().split(/\\s+/)[0];return first+' '+last}function fitAttendance(){const grid=$('people');if(!grid)return;const n=Math.max(1,names.length),width=grid.clientWidth;const cols=Math.min(n,width<390?3:4);grid.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;grid.style.gridTemplateRows=`repeat(${Math.ceil(n/cols)},minmax(0,1fr))`}function paint(){const a=absent();$('attendanceSummary').textContent=`${names.length-a.size} present · ${a.size} absent`;$('people').innerHTML=names.map((n,i)=>`<button class="person ${a.has(n)?'absent':''}" data-name="${escapeHtml(n)}" title="${escapeHtml(n)}" aria-label="${escapeHtml(n)}: ${a.has(n)?'absent':'present'}" aria-pressed="${a.has(n)}">${escapeHtml(labelFor(n,i))}</button>`).join('');$('people').querySelectorAll('button').forEach(b=>b.onclick=()=>{const set=absent(),n=b.dataset.name;set.has(n)?set.delete(n):set.add(n);state.absent[state.selected]=[...set];state.groups=[];save();paint()});fitAttendance()}paint();$('allPresent').onclick=()=>{state.absent[state.selected]=[];state.groups=[];save();paint()};$('allAbsent').onclick=()=>{state.absent[state.selected]=[...names];state.groups=[];save();paint()};$('attendanceDone').onclick=close;wireClose()}
let dragName=null;function moveStudent(name,target){if(busy)return;const from=state.groups.findIndex(g=>g.includes(name));if(from<0||from===target)return;state.groups[from]=state.groups[from].filter(x=>x!==name);state.groups[target].push(name);if(state.groups[from].length===0)state.groups.splice(from,1);save();render()}function bindDrag(){document.querySelectorAll('.student').forEach(el=>{el.addEventListener('dragstart',e=>{dragName=el.dataset.name;e.dataTransfer.setData('text/plain',dragName);e.dataTransfer.effectAllowed='move';el.classList.add('dragging')});el.addEventListener('dragend',()=>{dragName=null;document.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'))});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const dest=prompt(`Move ${el.dataset.name} to which group number? (1–${state.groups.length})`);if(dest!==null&&Number.isInteger(+dest)&&+dest>=1&&+dest<=state.groups.length)moveStudent(el.dataset.name,+dest-1)}})});document.querySelectorAll('.note').forEach(note=>{note.addEventListener('dragover',e=>{e.preventDefault();note.classList.add('drop-target')});note.addEventListener('dragleave',e=>{if(!note.contains(e.relatedTarget))note.classList.remove('drop-target')});note.addEventListener('drop',e=>{e.preventDefault();note.classList.remove('drop-target');const name=e.dataTransfer.getData('text/plain')||dragName;moveStudent(name,+note.dataset.group)})}); // Touch and pen dragging support
let touch=null;document.querySelectorAll('.student').forEach(el=>{el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||busy)return;touch={name:el.dataset.name,startX:e.clientX,startY:e.clientY,pointer:e.pointerId,el};el.setPointerCapture(e.pointerId)});el.addEventListener('pointerup',e=>{if(!touch)return;const name=touch.name;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.note');if(target&&Math.hypot(e.clientX-touch.startX,e.clientY-touch.startY)>12)moveStudent(name,+target.dataset.group);touch=null});el.addEventListener('pointercancel',()=>touch=null)})}
$('classSelect').onchange=e=>{state.selected=e.target.value;state.groups=[];save();render()};$('groupMode').onchange=e=>{state.mode=e.target.value;$('groupValue').value=state.mode==='size'?state.size:state.count;state.groups=[];save();render()};$('groupValue').onchange=e=>{const v=Math.max(1,Math.min(50,parseInt(e.target.value)||1));e.target.value=v;state[state.mode]=v;state.groups=[];save();render()};const settingsMenu=$('settingsMenu'),settingsBtn=$('settingsBtn');function hideSettings(){settingsMenu.classList.add('hidden');settingsBtn.setAttribute('aria-expanded','false')}settingsBtn.onclick=e=>{e.stopPropagation();const open=settingsMenu.classList.toggle('hidden')===false;settingsBtn.setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!e.target.closest('.settings-wrap'))hideSettings()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideSettings()});$('rosterBtn').onclick=()=>{hideSettings();rosterModal()};$('attendanceBtn').onclick=attendanceModal;$('shuffleBtn').onclick=$('fsShuffle').onclick=shuffle;function fullscreen(on){$('app').classList.toggle('full',on);if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});setTimeout(render,120)}$('fullBtn').onclick=()=>fullscreen(true);$('fsExit').onclick=()=>fullscreen(false);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&$('app').classList.contains('full'))fullscreen(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('panel').classList.contains('hidden'))close()});$('panel').addEventListener('click',e=>{if(e.target===$('panel'))close()});new ResizeObserver(()=>render()).observe($('board'));window.addEventListener('resize',()=>{if(!$('panel').classList.contains('hidden')&&$('people'))fitAttendance()});save();updateSelect();render();})();
