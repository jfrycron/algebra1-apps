<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equation Explorer</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fb;color:#172033;font:16px "Segoe UI",Arial,sans-serif}.shell{width:min(1360px,calc(100% - 24px));margin:auto;padding:8px 0 14px}.page-title{font-size:clamp(24px,2.35vw,34px);line-height:1.05;font-weight:900;letter-spacing:-.035em;margin:0;min-height:78px;display:flex;align-items:center}.workspace{background:#fff;border:2px solid #d7dce7;border-radius:16px;box-shadow:0 8px 24px rgba(16,24,40,.1);height:calc(100vh - 100px);min-height:590px;max-height:790px;padding:28px 25px 32px;overflow:auto}.content{max-width:480px;margin:0 auto}.label{font-size:14px;font-weight:700;display:block;margin:0 0 8px}.eqrow{display:flex;gap:10px;width:100%}input{font:inherit;border:1px solid #bdc9d9;border-radius:9px;padding:10px 12px;min-width:0;background:white}input:focus{outline:3px solid #b9d7ff}.eqrow input{flex:1;font-size:21px;font-weight:600}button{font:600 15px Arial,sans-serif;border:0;border-radius:9px;padding:11px 17px;cursor:pointer;background:#2474e5;color:#fff}button:focus-visible{outline:3px solid #e4a82b}button.secondary{background:#eef2f7;color:#344054}.error{font-size:13px;color:#b13232;min-height:20px;margin:6px 0 3px}.tablearea{width:236px;margin:4px auto 0}.scrollbtn{display:block;width:100%;padding:6px;background:#e8eef6;color:#27435f;border:1px solid #d4dce7;border-radius:7px}.scrollbtn:active{background:#cbdff5}.table{border:1px solid #bfc4ca;margin:6px 0;overflow:hidden}.head,.tr{display:grid;grid-template-columns:1fr 1fr}.head>div{height:43px;background:#d8d8d8;color:#111;font-size:22px;font-weight:700;display:grid;place-items:center;border-bottom:1px solid #bfc4ca}.head>div:first-child,.tr>div:first-child{border-right:1px solid #bfc4ca}.tr>div{height:39px;display:grid;place-items:center;border-bottom:1px solid #d4d8dc;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}.tr:last-child>div{border-bottom:0}.tr.selected>div{background:#e0f5e5;font-weight:700}.rows{touch-action:pan-y;cursor:ns-resize;user-select:none}.jumps{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.jump{display:flex;gap:7px}.jump input{width:100%;min-width:0}.jump button{min-width:54px;padding:10px 12px}@media(max-width:600px){.shell{margin:12px auto;padding:0 10px}.page-title{font-size:29px}.workspace{padding:20px 14px;min-height:0}.content{max-width:100%}.eqrow input{font-size:18px}.jumps{gap:10px}.jump{gap:5px}.jump button{padding:9px}.label{font-size:13px}}</style></head><body><div class="shell"><h1 class="page-title">Equation Explorer</h1><main class="workspace"><div class="content"><label class="label" for="eq">Enter your equation</label><div class="eqrow"><input id="eq" value="T = 3F + 2" autocomplete="off" spellcheck="false"><button id="clear" class="secondary">Clear</button></div><div class="error" id="error" aria-live="polite"></div><section class="tablearea" aria-label="Equation table"><button class="scrollbtn" id="up" aria-label="Scroll to earlier values">▲</button><div class="table"><div class="head"><div id="ih">F</div><div id="dh">T</div></div><div class="rows" id="rows" tabindex="0" aria-label="Scroll table with trackpad or arrow keys"></div></div><button class="scrollbtn" id="down" aria-label="Scroll to later values">▼</button></section><section class="jumps"><div><label class="label" for="fig">Jump to figure</label><div class="jump"><input id="fig" type="number" placeholder="0"><button id="gofig">Go</button></div></div><div><label class="label" for="tot">Jump to total</label><div class="jump"><input id="tot" type="number" placeholder="0"><button id="gotot">Go</button></div></div></section></div></main></div><script>
const $=id=>document.getElementById(id),rows=$('rows');let start=1,selected=null,formula=null,animation=null;
function parse(s){s=s.replace(/\s+/g,'').replace(/−/g,'-').replace(/×/g,'*');let m=s.match(/^([a-zA-Z])=(.+)$/);if(!m)return null;let dep=m[1],rhs=m[2],vars=[...new Set((rhs.match(/[a-zA-Z]/g)||[]))];if(vars.length!==1||vars[0]===dep)return null;let ind=vars[0];if(!/^[0-9a-zA-Z+\-*/().^]+$/.test(rhs))return null;let expr=rhs.replace(/\^/g,'**').replace(/(\d)([a-zA-Z(])/g,'$1*$2').replace(/([a-zA-Z])(\()/g,'$1*$2').replace(/\)([a-zA-Z0-9(])/g,')*$1');expr=expr.replace(new RegExp(ind,'g'),'n');if(/[a-zA-Z]/.test(expr.replace(/n/g,'')))return null;let fn;try{fn=new Function('n','return ('+expr+')');if(!Number.isFinite(fn(1)))return null}catch{return null}return{dep,ind,fn};}
function fmt(n){return Number.isFinite(n)?Number(n.toPrecision(12)).toLocaleString('en-US',{maximumFractionDigits:10}):'undefined'}
function draw(){formula=parse($('eq').value);$('error').textContent=$('eq').value.trim()&&!formula?'Enter an equation using two different variables.':'';$('ih').textContent=formula?.ind||'F';$('dh').textContent=formula?.dep||'T';rows.innerHTML='';for(let i=0;i<9;i++){let n=start+i,div=document.createElement('div');div.className='tr'+(n===selected?' selected':'');let l=document.createElement('div'),r=document.createElement('div');l.textContent=fmt(n);r.textContent=formula?fmt(formula.fn(n)):'';div.append(l,r);rows.append(div)}}
function move(d){cancelAnimationFrame(animation);animation=null;selected=null;start+=d;draw()}
function animateTo(n){if(!Number.isSafeInteger(n)){show('Enter a whole number.');return}cancelAnimationFrame(animation);let from=start+4,to=n,dist=to-from,t0=performance.now(),duration=Math.min(1400,Math.max(400,Math.abs(dist)*18));selected=n;function tick(t){let p=Math.min(1,(t-t0)/duration),e=1-Math.pow(1-p,3);start=Math.round(from+dist*e)-4;draw();if(p<1)animation=requestAnimationFrame(tick);else{start=n-4;draw()}}animation=requestAnimationFrame(tick)}
function show(s){$('error').textContent=s}
function figure(){if($('fig').value.trim()==='')return;let n=Number($('fig').value);animateTo(n)}
function total(){if(!formula){show('Enter a valid equation first.');return}if($('tot').value.trim()==='')return;let target=Number($('tot').value);if(!Number.isFinite(target)){show('Enter a valid total.');return}let found=null;for(let d=0;d<=100000;d++){for(let n of d===0?[0]:[d,-d]){let y=formula.fn(n);if(Number.isFinite(y)&&Math.abs(y-target)<1e-8*Math.max(1,Math.abs(target))){found=n;break}}if(found!==null)break}if(found===null){show('No matching whole-number input found in the searched range.');return}show('');animateTo(found)}
$('eq').addEventListener('input',()=>{selected=null;draw()});$('clear').onclick=()=>{$('eq').value='';$('fig').value='';$('tot').value='';start=1;selected=null;draw();$('eq').focus()};$('gofig').onclick=figure;$('gotot').onclick=total;$('fig').addEventListener('keydown',e=>{if(e.key==='Enter')figure()});$('tot').addEventListener('keydown',e=>{if(e.key==='Enter')total()});
rows.addEventListener('wheel',e=>{e.preventDefault();move(e.deltaY>0?1:-1)},{passive:false});rows.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();move(e.key==='ArrowDown'?1:-1)}});let touchY=null;rows.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});rows.addEventListener('touchend',e=>{if(touchY!==null){let dy=touchY-e.changedTouches[0].clientY;move(Math.round(dy/35));touchY=null}},{passive:true});
for(let [id,d] of [['up',-1],['down',1]]){let el=$(id),timer=null;el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);move(d);timer=setInterval(()=>move(d),110)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>{clearInterval(timer);timer=null})}
draw();
</script></body></html>
