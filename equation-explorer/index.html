<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equation to Table</title><style>:root{--ink:#172033;--page:#f5f7fb;--blue:#2474e5}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--page);color:var(--ink);font:16px "Segoe UI",Arial,sans-serif}.shell{width:min(1360px,calc(100% - 24px));margin:0 auto;padding:8px 0 14px}.app-header{min-height:102px;padding:10px 4px 13px;display:flex;flex-direction:column;justify-content:center}.page-title{font-size:clamp(24px,2.35vw,34px);font-weight:900;letter-spacing:-.035em;line-height:1.1;margin:0 0 8px}.directions{font-size:15px;color:#667085;margin:0;line-height:1.4}.workspace{height:calc(100vh - 125px);min-height:610px;max-height:790px;background:#fff;border:2px solid #d7dce7;border-radius:16px;box-shadow:0 8px 24px #1018281a;overflow:hidden}.content{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:100%;width:100%;max-width:none;margin:0}.left-panel,.right-panel{min-width:0;display:flex;align-items:center;justify-content:center;padding:18px 20px}.left-panel{justify-content:flex-end;padding-right:24px}.right-panel{justify-content:flex-start;padding-left:24px;border-left:1px solid #e2e6ec}.controls-card,.tablearea{width:280px;max-width:100%;flex:0 1 280px}.controls-card{height:505px;border:1px solid #d7dce7;border-radius:15px;background:#f8fafc;box-shadow:0 4px 14px #10182812;padding:16px 14px;display:flex;flex-direction:column;justify-content:space-evenly;gap:12px;min-width:0}.control-block{width:100%;min-width:0;margin:0;background:#fff;border:1px solid #e7ebf1;border-radius:11px;padding:10px 8px}.label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}.eqrow,.jump{display:flex;align-items:stretch;gap:6px;min-width:0;width:100%}input{font:inherit;border:1px solid #bdc9d9;border-radius:9px;padding:10px 9px;background:#fff;min-width:0;width:0;flex:1 1 0}input:focus{outline:3px solid #b9d7ff}.eqrow input{font-size:17px;font-weight:600}button{font:700 14px "Segoe UI",Arial,sans-serif;border:0;border-radius:9px;padding:10px 12px;cursor:pointer;background:var(--blue);color:#fff;flex:0 0 auto}button.secondary{background:#eef2f7;color:#344054}.eqrow button{padding:9px 8px}.jump button{min-width:48px}.error{font-size:12px;color:#b13232;margin-top:5px}.error:empty{display:none}.tablearea{margin:0}.scrollbtn{width:100%;display:block;padding:9px;background:#e8eef6;color:#27435f;border:1px solid #d4dce7;border-radius:8px;font-size:16px}.table{border:1px solid #bfc4ca;margin:6px 0;overflow:hidden}.head,.tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.head>div{height:49px;background:#d8d8d8;color:#111;font-size:24px;font-weight:700;display:grid;place-items:center;border-bottom:1px solid #bfc4ca}.head>div:first-child,.tr>div:first-child{border-right:1px solid #bfc4ca}.tr>div{height:45px;min-width:0;display:grid;place-items:center;border-bottom:1px solid #d4d8dc;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}.tr:last-child>div{border-bottom:0}.tr.selected>div{background:#e0f5e5;font-weight:700}.rows{touch-action:pan-y;cursor:ns-resize;user-select:none}@media(max-width:650px){.workspace{height:auto;min-height:0;max-height:none;overflow:visible}.content{grid-template-columns:minmax(0,1fr)}.left-panel,.right-panel{justify-content:center;padding:22px 12px}.right-panel{border-left:0;border-top:1px solid #e2e6ec}.controls-card{height:auto;min-height:430px}.directions{font-size:14px}}.eqrow input{font-size:23px;font-weight:700}input[type="number"]{-moz-appearance:textfield;appearance:textfield}input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.right-panel{border-left:0}.controls-card{height:var(--table-stack-height,535px)}@media(max-width:650px){.controls-card{height:auto;min-height:430px}}.eqrow input{font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:24px;font-weight:600;letter-spacing:.025em;font-variant-numeric:lining-nums;padding-left:12px}.app-header{min-height:88px;padding:8px 4px 8px}.page-title{margin-bottom:5px}.workspace{height:calc(100vh - 111px)}.eqrow{gap:5px}.eqrow button{padding:9px 7px;font-size:13px}.eqrow input{font-size:22px;padding-left:8px}/* Keep the controls and table together as one centered group. */
.content{display:flex;align-items:center;justify-content:center;gap:48px;padding:18px 24px}
.left-panel,.right-panel{flex:0 1 auto;min-width:0;width:auto;padding:0;justify-content:center;align-items:center}
.controls-card{width:380px;max-width:100%;flex:none}
.tablearea{width:280px;max-width:100%;flex:none}
.eqrow input{min-width:0;flex:1 1 0}
@media(max-width:760px){.content{flex-direction:column;gap:22px;padding:22px 12px}.left-panel,.right-panel{width:100%}.controls-card{width:min(380px,100%)}.tablearea{width:min(280px,100%)}}
.jump{gap:5px}.jump button{flex:0 0 48px;width:48px;min-width:48px;padding:9px 4px;font-size:13px}.jump input{min-width:0;flex:1 1 0}#eq{background:#fff4cc;border-color:#dfca83}#eq:focus{background:#fff4cc}</style></head><body><div class="shell"><header class="app-header"><h1 class="page-title">Equation to Table</h1><p class="directions">Enter an equation to build a table. Scroll to explore values, or jump to an input or output.</p></header><main class="workspace"><div class="content"><section class="left-panel"><div class="controls-card"><div class="control-block"><label class="label" for="eq">Enter your equation</label><div class="eqrow"><input id="eq" value="" autocomplete="off" spellcheck="false"><button id="submitEq">Enter</button><button id="clear" class="secondary">Clear</button></div><div class="error" id="error" aria-live="polite"></div></div><div class="control-block"><label class="label" for="fig">Jump to input</label><div class="jump"><input id="fig" type="number" placeholder="0"><button id="gofig">Go</button><button id="clearfig" class="secondary">Clear</button></div></div><div class="control-block"><label class="label" for="tot">Jump to output</label><div class="jump"><input id="tot" type="number" placeholder="0"><button id="gotot">Go</button><button id="cleartot" class="secondary">Clear</button></div></div></div></section><section class="right-panel"><div class="tablearea" aria-label="Equation table"><button class="scrollbtn" id="up" aria-label="Scroll to earlier values">▲</button><div class="table"><div class="head"><div id="ih">F</div><div id="dh">T</div></div><div class="rows" id="rows" tabindex="0" aria-label="Scroll table with trackpad or arrow keys"></div></div><button class="scrollbtn" id="down" aria-label="Scroll to later values">▼</button></div></section></div></main></div><script>
const $=id=>document.getElementById(id),rows=$('rows');let start=1,selected=null,selectedInput=null,selectedOutput=null,formula=null,animation=null;
function parse(s){
 s=s.replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/×/g,'*');
 const parts=s.split('=');if(parts.length!==2||!parts[0]||!parts[1])return null;
 const vars=[...new Set((s.match(/[a-zA-Z]/g)||[]))];if(vars.length!==2)return null;
 const isolated=parts.map(p=>/^[a-zA-Z]$/.test(p)?p:null).filter(Boolean);
 let dep;
 if(isolated.length===1)dep=isolated[0];
 else dep=vars.find(v=>v.toLowerCase()==='y')||vars.find(v=>v.toLowerCase()==='t')||vars.find(v=>v.toLowerCase()!=='x'&&v.toLowerCase()!=='f')||vars[1];
 let ind=vars.find(v=>v!==dep);
 function side(expr){
  if(!/^[0-9a-zA-Z+\-*/().^]+$/.test(expr))throw Error('Invalid characters');
  let e=expr.replace(/\^/g,'**').replace(/(\d)([a-zA-Z(])/g,'$1*$2').replace(/([a-zA-Z])(\()/g,'$1*$2').replace(/\)([a-zA-Z0-9(])/g,')*$1');
  e=e.replace(/([a-zA-Z])([a-zA-Z])/g,'$1*$2');
  if([...e.matchAll(/[a-zA-Z]/g)].some(m=>m[0]!==dep&&m[0]!==ind))throw Error('Invalid variable');
  const fn=new Function(ind,dep,'"use strict";return ('+e+')');
  return (x,y)=>fn(x,y);
 }
 try{
  const left=side(parts[0]),right=side(parts[1]),g=(x,y)=>left(x,y)-right(x,y);
  const c=g(0,0),a=g(1,0)-c,b=g(0,1)-c;
  if(![a,b,c].every(Number.isFinite)||Math.abs(b)<1e-10)return null;
  for(const [x,y] of [[2,3],[-2,4],[3,-2],[0.5,1.5]]){
   const expected=a*x+b*y+c,actual=g(x,y);
   if(!Number.isFinite(actual)||Math.abs(actual-expected)>1e-7*Math.max(1,Math.abs(actual),Math.abs(expected)))return null;
  }
  return {dep,ind,slope:-a/b,intercept:-c/b,fn:x=>-(a*x+c)/b};
 }catch{return null}
}
function fmt(n){return Number.isFinite(n)?Number(n.toPrecision(12)).toLocaleString('en-US',{maximumFractionDigits:10}):'undefined'}
function draw(){$('ih').textContent=formula?.ind||'';$('dh').textContent=formula?.dep||'';rows.innerHTML='';for(let i=0;i<9;i++){let n=start+i,div=document.createElement('div');div.className='tr'+((n===selectedInput||n===selectedOutput)?' selected':'');let l=document.createElement('div'),r=document.createElement('div');l.textContent=formula?fmt(n):'';r.textContent=formula?fmt(formula.fn(n)):'';div.append(l,r);rows.append(div)}}
function move(d){cancelAnimationFrame(animation);animation=null;start+=d;draw()}
function animateTo(n){if(!Number.isSafeInteger(n)){show('Enter a whole-number input.');return}cancelAnimationFrame(animation);animation=null;let from=start,to=n-4,dist=to-from,t0=performance.now(),duration=Math.min(950,Math.max(260,Math.abs(dist)*12));selected=n;show('');if(!dist){draw();return}function tick(t){let p=Math.min(1,(t-t0)/duration),e=1-Math.pow(1-p,3);start=Math.round(from+dist*e);draw();if(p<1)animation=requestAnimationFrame(tick);else{start=to;animation=null;draw()}}animation=requestAnimationFrame(tick)}
function show(s){$('error').textContent=s}
function submitEquation(){const next=parse($('eq').value);if(!next){show('Enter a valid linear equation using two variables.');return}$('eq').value=formatEquation($('eq').value);cancelAnimationFrame(animation);animation=null;formula=next;start=1;selected=null;selectedInput=null;selectedOutput=null;show('');draw()}
function figure(){if(!formula){show('Enter a valid linear equation using two variables.');return}if($('fig').value.trim()==='')return;let n=Number($('fig').value);if(!Number.isSafeInteger(n)){show('Enter a whole-number input.');return}selectedInput=n;animateTo(n)}
function total(){if(!formula){show('Enter a valid linear equation using two variables.');return}if($('tot').value.trim()==='')return;let target=Number($('tot').value);if(!Number.isFinite(target)){show('Enter a valid total.');return}let {slope,intercept}=formula;if(Math.abs(slope)<1e-12){show('This equation has the same output for every input, so there is no unique location.');return}let input=(target-intercept)/slope,nearest=Math.round(input);if(!Number.isSafeInteger(nearest)||Math.abs(input-nearest)>1e-8*Math.max(1,Math.abs(input))){show('That output does not occur at a whole-number input.');return}selectedOutput=nearest;animateTo(nearest)}
// Format the equation immediately while preserving the insertion point.
function formatLiveEquation(){
 const field=$('eq'),raw=field.value;
 const left=field.selectionStart,right=field.selectionEnd;
 const formatted=formatEquation(raw);
 if(formatted===raw)return;
 const caretLeft=formatEquation(raw.slice(0,left)).length;
 const caretRight=formatEquation(raw.slice(0,right)).length;
 field.value=formatted;
 field.setSelectionRange(caretLeft,caretRight);
}
$('eq').addEventListener('input',()=>{$('error').textContent='';formatLiveEquation()});$('submitEq').onclick=submitEquation;$('clear').onclick=()=>{$('eq').value='';$('fig').value='';$('tot').value='';start=1;selected=null;selectedInput=null;selectedOutput=null;formula=null;show('');draw();$('eq').focus()};$('gofig').onclick=figure;$('gotot').onclick=total;$('clearfig').onclick=()=>{$('fig').value='';selectedInput=null;draw();$('fig').focus()};$('cleartot').onclick=()=>{$('tot').value='';selectedOutput=null;draw();$('tot').focus()};$('fig').addEventListener('keydown',e=>{if(e.key==='Enter')figure()});$('tot').addEventListener('keydown',e=>{if(e.key==='Enter')total()});
rows.addEventListener('wheel',e=>{e.preventDefault();move(e.deltaY>0?1:-1)},{passive:false});rows.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();move(e.key==='ArrowDown'?1:-1)}});let touchY=null;rows.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});rows.addEventListener('touchend',e=>{if(touchY!==null){let dy=touchY-e.changedTouches[0].clientY;move(Math.round(dy/35));touchY=null}},{passive:true});
for(const [id,d] of [['up',-1],['down',1]]){const el=$(id);let delay=null,repeat=null;function stop(){clearTimeout(delay);clearInterval(repeat);delay=null;repeat=null}el.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();stop();el.setPointerCapture(e.pointerId);move(d);delay=setTimeout(()=>{repeat=setInterval(()=>move(d),125)},420)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,stop);el.addEventListener('click',e=>e.preventDefault())}
// Keep mathematical notation legible without moving the cursor during typing.
function formatEquation(value){
 const compact=value.replace(/\s+/g,'').replace(/[−–]/g,'-');
 let out='';
 for(let i=0;i<compact.length;i++){
  const c=compact[i];
  if(c==='='||c==='+'||c==='-'){
   const prev=compact[i-1]||'';
   const unary=(c==='+'||c==='-')&&(i===0||' =+-*/^('.includes(prev));
   if(unary){out+=c;continue}
   out+=' '+(c==='-'?'−':c)+' ';
  }else{out+=c}
 }
 return out.trim();
}
$('eq').addEventListener('blur',()=>{$('eq').value=formatEquation($('eq').value)});
$('eq').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitEquation();$('eq').blur()}});
// Select the entire current entry when a student clicks into an input.
for(const id of ['fig','tot']){
 const field=$(id);
 field.addEventListener('focus',()=>field.select());
 field.addEventListener('click',()=>field.select());
}
// Match the control card's top and bottom to the complete table, including arrows.
const tableBody=document.querySelector('.table');
function syncPanelHeight(){document.querySelector('.content').style.setProperty('--table-stack-height',Math.ceil(tableBody.getBoundingClientRect().height)+'px')}
window.addEventListener('resize',syncPanelHeight);
draw();
syncPanelHeight();
</script></body></html>
