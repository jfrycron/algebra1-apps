<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equation Explorer</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fb;color:#172033;font:16px "Segoe UI",Arial,sans-serif}.shell{width:min(1360px,calc(100% - 24px));margin:auto;padding:8px 0 14px}.page-title{font-size:clamp(24px,2.35vw,34px);line-height:1.05;font-weight:900;letter-spacing:-.035em;margin:0;min-height:78px;display:flex;align-items:center}.workspace{background:#fff;border:2px solid #d7dce7;border-radius:16px;box-shadow:0 8px 24px rgba(16,24,40,.1);height:calc(100vh - 100px);min-height:590px;max-height:790px;padding:28px 25px 32px;overflow:auto}.content{max-width:480px;margin:0 auto}.label{font-size:14px;font-weight:700;display:block;margin:0 0 8px}.eqrow{display:flex;gap:10px;width:100%}input{font:inherit;border:1px solid #bdc9d9;border-radius:9px;padding:10px 12px;min-width:0;background:white}input:focus{outline:3px solid #b9d7ff}.eqrow input{flex:1;font-size:21px;font-weight:600}button{font:600 15px Arial,sans-serif;border:0;border-radius:9px;padding:11px 17px;cursor:pointer;background:#2474e5;color:#fff}button:focus-visible{outline:3px solid #e4a82b}button.secondary{background:#eef2f7;color:#344054}.error{font-size:13px;color:#b13232;min-height:20px;margin:6px 0 3px}.tablearea{width:236px;margin:4px auto 0}.scrollbtn{display:block;width:100%;padding:6px;background:#e8eef6;color:#27435f;border:1px solid #d4dce7;border-radius:7px}.scrollbtn:active{background:#cbdff5}.table{border:1px solid #bfc4ca;margin:6px 0;overflow:hidden}.head,.tr{display:grid;grid-template-columns:1fr 1fr}.head>div{height:43px;background:#d8d8d8;color:#111;font-size:22px;font-weight:700;display:grid;place-items:center;border-bottom:1px solid #bfc4ca}.head>div:first-child,.tr>div:first-child{border-right:1px solid #bfc4ca}.tr>div{height:39px;display:grid;place-items:center;border-bottom:1px solid #d4d8dc;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}.tr:last-child>div{border-bottom:0}.tr.selected>div{background:#e0f5e5;font-weight:700}.rows{touch-action:pan-y;cursor:ns-resize;user-select:none}.jumps{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.jump{display:flex;gap:7px}.jump input{width:100%;min-width:0}.jump button{min-width:54px;padding:10px 12px}@media(max-width:600px){.shell{margin:12px auto;padding:0 10px}.page-title{font-size:29px}.workspace{padding:20px 14px;min-height:0}.content{max-width:100%}.eqrow input{font-size:18px}.jumps{gap:10px}.jump{gap:5px}.jump button{padding:9px}.label{font-size:13px}}.app-header{min-height:100px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:5px 4px 12px}.page-title{min-height:0;margin:0 0 7px}.directions{margin:0;color:#667085;font-size:15px;line-height:1.35}.workspace{height:calc(100vh - 126px);min-height:590px;max-height:790px;padding:0;overflow:hidden}.content{max-width:none;width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;margin:0}.left-panel,.right-panel{min-width:0;display:flex;flex-direction:column;justify-content:center}.left-panel{padding:30px clamp(24px,4vw,64px);gap:30px}.right-panel{border-left:1px solid #e2e6ec;align-items:center;padding:18px}.control-block{width:100%;max-width:420px;margin:0 auto}.eqrow input{width:100%;font-size:21px}.jump input{width:100%}.jump button{min-width:66px}.tablearea{width:280px;margin:0}.scrollbtn{padding:9px}.head>div{height:49px;font-size:24px}.tr>div{height:45px;font-size:19px}@media(max-width:700px){.app-header{min-height:95px}.workspace{height:auto;max-height:none;overflow:visible}.content{grid-template-columns:1fr}.left-panel{padding:28px 22px;gap:22px}.right-panel{border-left:0;border-top:1px solid #e2e6ec;padding:22px}.tablearea{width:min(280px,100%)}.directions{font-size:14px}}.content{--center-pull:42px}.left-panel{align-items:flex-end;padding:18px 0;transform:translateX(var(--center-pull))}.right-panel{align-items:flex-start;padding:18px 0;transform:translateX(calc(-1 * var(--center-pull)))}.controls-card{width:280px;height:calc(49px + 9 * 45px + 2 * 9px + 12px);height:505px;border:1px solid #cbd3df;border-radius:15px;background:#fff;display:flex;flex-direction:column;justify-content:space-evenly;padding:20px 16px;gap:12px;box-shadow:0 2px 8px rgba(16,24,40,.035)}.controls-card .control-block{margin:0}.controls-card .eqrow input{font-size:17px}.controls-card .eqrow button{padding:10px 11px}.controls-card .jump button{min-width:50px;padding:10px 12px}.controls-card .error{margin:3px 0 0;min-height:0}.right-panel .tablearea{margin-left:0}.tablearea{width:280px}@media(max-width:700px){.left-panel,.right-panel{transform:none;align-items:center;padding:20px}.controls-card{height:auto;min-height:410px;width:min(280px,100%)}.right-panel .tablearea{margin:0 auto}}.controls-card{background:#f8fafc;border:1px solid #d7dce7;box-shadow:0 4px 14px rgba(16,24,40,.07)}.controls-card .control-block{background:#fff;border:1px solid #e7ebf1;border-radius:11px;padding:11px 10px}.controls-card .control-block .label{margin-bottom:7px}.controls-card .error:empty{display:none}/* Keep each panel strictly within its own half; never translate across divider. */.content{grid-template-columns:minmax(0,1fr) minmax(0,1fr);--center-pull:0px}.left-panel,.right-panel{transform:none;min-width:0;box-sizing:border-box}.left-panel{align-items:flex-end;padding:18px 22px 18px 12px}.right-panel{align-items:flex-start;padding:18px 12px 18px 22px}.controls-card,.tablearea{width:min(280px,100%);max-width:100%;flex-shrink:0;box-sizing:border-box}.controls-card{height:505px;overflow:hidden;padding:18px 14px;gap:10px}.controls-card .control-block{min-width:0;max-width:100%;width:100%;box-sizing:border-box}.controls-card .eqrow,.controls-card .jump{display:flex;width:100%;min-width:0;max-width:100%;gap:6px}.controls-card input{min-width:0;flex:1 1 0;width:0;max-width:100%}.controls-card button{flex:0 0 auto;min-width:0}.controls-card .eqrow button{padding:9px 8px;font-size:14px}.controls-card .jump button{padding:9px 11px}.controls-card .control-block{padding:10px 8px}@media(max-width:700px){.left-panel,.right-panel{align-items:center;padding:20px}.controls-card{height:auto;min-height:410px;overflow:visible}.content{grid-template-columns:minmax(0,1fr)}}</style></head><body><div class="shell"><header class="app-header"><h1 class="page-title">Equation Explorer</h1><p class="directions">Enter an equation to build a table. Scroll to explore values, or jump to a figure or total.</p></header><main class="workspace"><div class="content"><section class="left-panel"><div class="controls-card"><div class="control-block"><label class="label" for="eq">Enter your equation</label><div class="eqrow"><input id="eq" value="" autocomplete="off" spellcheck="false"><button id="clear" class="secondary">Clear</button></div><div class="error" id="error" aria-live="polite"></div></div><div class="control-block"><label class="label" for="fig">Jump to figure</label><div class="jump"><input id="fig" type="number" placeholder="0"><button id="gofig">Go</button></div></div><div class="control-block"><label class="label" for="tot">Jump to total</label><div class="jump"><input id="tot" type="number" placeholder="0"><button id="gotot">Go</button></div></div></div></section><section class="right-panel"><div class="tablearea" aria-label="Equation table"><button class="scrollbtn" id="up" aria-label="Scroll to earlier values">▲</button><div class="table"><div class="head"><div id="ih">F</div><div id="dh">T</div></div><div class="rows" id="rows" tabindex="0" aria-label="Scroll table with trackpad or arrow keys"></div></div><button class="scrollbtn" id="down" aria-label="Scroll to later values">▼</button></div></section></div></main></div><script>
const $=id=>document.getElementById(id),rows=$('rows');let start=1,selected=null,formula=null,animation=null;
function parse(s){s=s.replace(/\s+/g,'').replace(/−/g,'-').replace(/×/g,'*');let m=s.match(/^([a-zA-Z])=(.+)$/);if(!m)return null;let dep=m[1],rhs=m[2],vars=[...new Set((rhs.match(/[a-zA-Z]/g)||[]))];if(vars.length!==1||vars[0]===dep)return null;let ind=vars[0];if(!/^[0-9a-zA-Z+\-*/().^]+$/.test(rhs))return null;let expr=rhs.replace(/\^/g,'**').replace(/(\d)([a-zA-Z(])/g,'$1*$2').replace(/([a-zA-Z])(\()/g,'$1*$2').replace(/\)([a-zA-Z0-9(])/g,')*$1');expr=expr.replace(new RegExp(ind,'g'),'n');if(/[a-zA-Z]/.test(expr.replace(/n/g,'')))return null;let fn;try{fn=new Function('n','return ('+expr+')');if(!Number.isFinite(fn(1)))return null}catch{return null}return{dep,ind,fn};}
function fmt(n){return Number.isFinite(n)?Number(n.toPrecision(12)).toLocaleString('en-US',{maximumFractionDigits:10}):'undefined'}
function draw(){formula=parse($('eq').value);$('error').textContent=$('eq').value.trim()&&!formula?'Enter an equation using two different variables.':'';$('ih').textContent=formula?.ind||'F';$('dh').textContent=formula?.dep||'T';rows.innerHTML='';for(let i=0;i<9;i++){let n=start+i,div=document.createElement('div');div.className='tr'+(n===selected?' selected':'');let l=document.createElement('div'),r=document.createElement('div');l.textContent=fmt(n);r.textContent=formula?fmt(formula.fn(n)):'';div.append(l,r);rows.append(div)}}
function move(d){cancelAnimationFrame(animation);animation=null;selected=null;start+=d;draw()}
function animateTo(n){if(!Number.isSafeInteger(n)){show('Enter a whole number.');return}cancelAnimationFrame(animation);let from=start+4,to=n,dist=to-from,t0=performance.now(),duration=Math.min(1400,Math.max(400,Math.abs(dist)*18));selected=n;function tick(t){let p=Math.min(1,(t-t0)/duration),e=1-Math.pow(1-p,3);start=Math.round(from+dist*e)-4;draw();if(p<1)animation=requestAnimationFrame(tick);else{start=n-4;draw()}}animation=requestAnimationFrame(tick)}
function show(s){$('error').textContent=s}
function figure(){if($('fig').value.trim()==='')return;let n=Number($('fig').value);animateTo(n)}
function total(){if(!formula){show('Enter a valid equation first.');return}if($('tot').value.trim()==='')return;let target=Number($('tot').value);if(!Number.isFinite(target)){show('Enter a valid total.');return}let found=null;for(let d=0;d<=100000;d++){for(let n of d===0?[0]:[d,-d]){let y=formula.fn(n);if(Number.isFinite(y)&&Math.abs(y-target)<1e-8*Math.max(1,Math.abs(target))){found=n;break}}if(found!==null)break}if(found===null){show('No matching whole-number input found in the searched range.');return}show('');animateTo(found)}
$('eq').addEventListener('input',()=>{selected=null;draw()});$('clear').onclick=()=>{$('eq').value='';$('fig').value='';$('tot').value='';start=1;selected=null;draw();$('eq').focus()};$('gofig').onclick=figure;$('gotot').onclick=total;$('fig').addEventListener('keydown',e=>{if(e.key==='Enter')figure()});$('tot').addEventListener('keydown',e=>{if(e.key==='Enter')total()});
rows.addEventListener('wheel',e=>{e.preventDefault();move(e.deltaY>0?1:-1)},{passive:false});rows.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();move(e.key==='ArrowDown'?1:-1)}});let touchY=null;rows.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});rows.addEventListener('touchend',e=>{if(touchY!==null){let dy=touchY-e.changedTouches[0].clientY;move(Math.round(dy/35));touchY=null}},{passive:true});
for(let [id,d] of [['up',-1],['down',1]]){let el=$(id),timer=null;el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);move(d);timer=setInterval(()=>move(d),110)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>{clearInterval(timer);timer=null})}
draw();
</script></body></html>
