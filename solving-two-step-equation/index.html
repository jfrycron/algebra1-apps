<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solving Equations — Drag Prototype</title>
<style>
:root{
  --bg:#EEF3F8; --paper:#FFFFFF; --ink:#24211e; --muted:#66717d;
  --accent:#b95525; --good:#286654; --bad:#842f2f; --line:#dfd4c7;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#EEF3F8;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.app{max-width:980px;margin:auto;padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(30px,5vw,48px);letter-spacing:-1px}.subtitle{margin:6px 0 0;color:var(--muted)}
button{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#eee5db;color:#3f3128;border:1px solid #d8c8b9}
.board{position:relative;margin-top:22px;background:var(--paper);border:2px solid #D8E0E8;border-radius:10px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.08);transition:background 1.2s ease,border-color 1.2s ease,box-shadow 1.2s ease}.board.completed{background:#CFEFD8;border-color:#8CC9A0;box-shadow:0 10px 28px rgba(40,102,84,.20)}
.instruction{text-align:center;font-weight:800;background:#fff7e9;border:1px solid #eed1a4;border-radius:14px;padding:12px;margin-bottom:24px}
.equation-stage{min-height:250px;display:flex;align-items:center;justify-content:center;position:relative;overflow:visible}
.equation{display:flex;align-items:center;justify-content:center;gap:.34em;font-family:"Cambria Math",Cambria,Georgia,serif;font-size:clamp(34px,7vw,64px);font-weight:600;line-height:1.2;white-space:nowrap;padding:45px 15px}
.side-expression{display:flex;align-items:center;justify-content:center;gap:.34em;min-height:1.35em;position:relative}
.side-expression.compress-empty-first,.side-expression.compress-empty-second,.side-expression.compress-zero{gap:0}
.side-expression .lane{transition:none}
.equation.measure-no-transition .side-expression,.equation.measure-no-transition .lane{transition:none!important}
.term.compression-placeholder{opacity:0!important}
.equation.squeezing{animation:equationSqueeze 1.8s cubic-bezier(.22,.8,.25,1)}
@keyframes equationSqueeze{0%{letter-spacing:0}45%{letter-spacing:.018em}100%{letter-spacing:0}}
.lane{position:relative;height:1.35em;display:flex;align-items:center;justify-content:center;min-width:0}.term{position:relative;display:inline-flex;align-items:baseline;justify-content:center;padding:5px 3px;border-radius:8px;cursor:grab;touch-action:none;user-select:none;transition:background .35s,transform .35s,opacity .55s,box-shadow .35s}
.term-sign{position:static;display:inline-block;min-width:.55em;text-align:center;margin-right:.12em;pointer-events:none}
.term-core{display:inline-block}
.term.merging-source{opacity:0!important}
.term.merging-target{animation:targetFade 4.35s ease forwards}
@keyframes targetFade{0%,70%{opacity:1}84%,100%{opacity:0}}
.zero-target{font-family:"Cambria Math",Cambria,Georgia,serif;opacity:.62;cursor:grab;padding:5px 12px;border-radius:8px;transition:.35s}.zero-target.target{opacity:1;background:#e7f3ee;box-shadow:0 0 0 4px rgba(40,102,84,.18);transform:scale(1.06)}.term:hover,.term.ready{background:#eaf0f8;box-shadow:0 0 0 3px rgba(72,104,149,.12)}.term:active{cursor:grabbing}.term.source{opacity:.2}.term.target{background:#e7f3ee;box-shadow:0 0 0 4px rgba(40,102,84,.18);transform:scale(1.06)}
.equals{display:inline-flex;align-items:center;justify-content:center;min-width:.7em;text-align:center;color:#423a34;font-weight:700;margin:0 .08em;transition:margin 1.5s ease}
.equation.compact-final{gap:.24em}
.equation.compact-final .side-expression{display:flex;width:auto;min-width:0;grid-template-columns:none;gap:0;transition:width 1.5s ease}
.equation.compact-final .lane:empty{display:none}
.equation.compact-final .lane{width:auto;height:1.35em}
.equation.compact-final .term-sign{min-width:.48em;margin-right:.08em}
.equation.compact-final .equals{margin:0 .06em}
.drag-ghost{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;font-family:"Cambria Math",Cambria,Georgia,serif;font-size:clamp(34px,7vw,64px);font-weight:600;padding:5px 9px;border-radius:9px;background:transparent;box-shadow:none;opacity:.62;text-shadow:0 2px 8px rgba(255,255,255,.95);transform:translate(-50%,-50%);transition:color .28s,transform .28s,opacity .28s}
.drag-ghost.crossed{background:transparent;color:#8b3d16;opacity:.72;transform:translate(-50%,-50%) scale(1.1)}
.cross-note{position:fixed;z-index:9998;pointer-events:none;transform:translate(-50%,-115%);font-weight:800;font-size:14px;background:#2f2925;color:#fff;padding:7px 10px;border-radius:9px;white-space:nowrap;opacity:0;transition:opacity .12s}.cross-note.show{opacity:1}
.merge-preview{position:absolute;left:0;top:0;pointer-events:none;z-index:20;font-family:"Cambria Math",Cambria,Georgia,serif;font-size:clamp(34px,7vw,64px);font-weight:600;line-height:1.2;white-space:nowrap}
.merge-group{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap}
.merge-pair{position:relative;display:flex;align-items:baseline;justify-content:center;gap:0;white-space:nowrap;will-change:transform,opacity}
.merge-piece{position:absolute;left:0;top:0;display:inline-block;will-change:transform,opacity,color}
.merge-piece .merge-old-sign,.merge-piece .merge-old-core{display:inline-block;will-change:opacity,filter;}.merge-piece .merge-old-sign{margin-right:.02em}
.term-core .variable-symbol,.term-core .coeff-one{display:inline-block}
.term-core .coeff-one{will-change:opacity,filter}
.merge-piece.like-highlight,.merge-result.like-highlight{color:#1f75fe;text-shadow:0 0 .01px currentColor}
.merge-underline{height:3px;width:100%;min-width:2.2em;margin-top:.08em;border-radius:999px;background:rgba(80,72,66,.20);transform:scaleX(0);transform-origin:center;opacity:0;will-change:transform,opacity,width}
.merge-result{position:absolute;left:0;top:0;display:inline-flex;align-items:baseline;justify-content:center;padding:5px 3px;border-radius:8px;opacity:0;transform:translate(-50%,-50%);white-space:nowrap;will-change:transform,opacity,color}.merge-result .term-sign,.merge-result .term-core,.merge-result .coeff-one,.merge-result .variable-symbol{font:inherit;line-height:inherit}
.drop-spacer{display:flex;align-items:center;justify-content:center;width:0;min-width:0;height:1.35em;overflow:visible;opacity:0;transition:width .95s cubic-bezier(.22,.8,.25,1),opacity .45s ease;flex:0 0 auto}
.drop-spacer.show{opacity:1}
.drop-slot{position:relative;z-index:18;display:flex;align-items:baseline;justify-content:center;height:1.18em;padding:4px 9px;border:2px dashed rgba(92,84,77,.24);border-radius:9px;background:rgba(92,84,77,.025);font-family:"Cambria Math",Cambria,Georgia,serif;font-size:inherit;font-weight:600;white-space:nowrap;pointer-events:none;opacity:0;transform:scaleX(.78);transform-origin:left center;transition:opacity .45s ease,transform .8s cubic-bezier(.22,.8,.25,1)}
.drop-spacer.show .drop-slot{opacity:1;transform:scaleX(1)}
.drop-slot .slot-text{opacity:.28}
.term.like-match{background:rgba(40,102,84,.09);color:var(--good);box-shadow:0 0 0 3px rgba(40,102,84,.13)}
.equation.insertion-open .term,.equation.insertion-open .zero-target,.equation.insertion-open .equals{transition:transform .9s cubic-bezier(.22,.8,.25,1),background .35s,color .35s,box-shadow .35s,opacity .35s}


.division-zone{display:none;flex-direction:column;align-items:center;gap:10px;margin:-12px auto 18px;max-width:460px}.division-zone.show{display:flex}.division-prompt{font-weight:800;text-align:center}.division-entry{display:flex;align-items:center;justify-content:center;gap:10px}.division-entry.hidden{display:none}.division-choices{display:grid;grid-template-columns:repeat(2,minmax(108px,1fr));gap:12px;width:min(100%,360px)}.division-choices.two-options{grid-template-columns:minmax(108px,180px);justify-content:center}.division-choice{min-height:58px;padding:12px 18px;border:2px solid #bda78f;border-radius:14px;background:#fff;color:var(--ink);font-family:"Cambria Math",Cambria,Georgia,serif;font-size:24px;font-weight:800;box-shadow:0 3px 9px rgba(70,48,30,.09)}.division-choice:hover{border-color:#568675;transform:translateY(-1px)}.division-choice:active{transform:translateY(0)}.division-choice.wrong{border-color:#b94a48;background:#fff0ef;color:#8b2826;animation:choiceShake .28s ease}.division-choice.correct{border-color:var(--good);background:#edf8f3;color:var(--good)}.division-choice:disabled{cursor:default}.division-input{display:none}.division-submit{display:none}@keyframes choiceShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}.division-continue{display:none;min-width:170px;padding:14px 22px;background:var(--good);color:#fff;font-size:18px;box-shadow:0 5px 14px rgba(40,102,84,.18)}.division-continue.show{display:block}.division-continue:disabled{opacity:.55;cursor:default;box-shadow:none}.division-work{display:none}
.inplace-division{display:flex;align-items:center;justify-content:center;gap:.24em;font-family:"Cambria Math",Cambria,Georgia,serif;font-size:clamp(34px,7vw,64px);font-weight:600;white-space:nowrap}
.inplace-fraction{display:inline-grid;grid-template-rows:auto 3px auto;justify-items:center;align-items:center;min-width:1.35em;opacity:0;filter:blur(5px);animation:fractionDissolve 1.25s cubic-bezier(.22,.8,.25,1) forwards}
.inplace-fraction .num{padding:0 .12em .05em;display:inline-flex;align-items:baseline;justify-content:center}
.inplace-fraction .bar{height:3px;background:currentColor;width:100%;opacity:1}
.inplace-fraction .den{padding-top:.03em;opacity:1;transform:none}
.inplace-division .equals{margin:0 .06em}
.cancel-coeff,.cancel-x-den,.keep-x,.other-num,.other-den,.fraction-bar,.answer-value{display:inline-block;will-change:transform,opacity,filter}
.inplace-fraction{position:relative}
.answer-value{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;white-space:nowrap}
.final-travel-layer{position:absolute;inset:0;pointer-events:none;z-index:40;font-family:"Cambria Math",Cambria,Georgia,serif;font-size:clamp(34px,7vw,64px);font-weight:600;white-space:nowrap}.final-travel-piece{position:absolute;left:0;top:0;will-change:transform}.final-measure{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:.24em;visibility:hidden;font-family:"Cambria Math",Cambria,Georgia,serif;font-size:clamp(34px,7vw,64px);font-weight:600;white-space:nowrap}.final-simple{display:flex;align-items:center;justify-content:center;gap:.24em;font-family:"Cambria Math",Cambria,Georgia,serif;font-size:clamp(34px,7vw,64px);font-weight:600;white-space:nowrap}

.completion-check-inline{position:absolute;left:0;top:0;color:var(--good);width:clamp(38px,6vw,56px);height:clamp(38px,6vw,56px);border:clamp(2px,.34vw,4px) solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;font-size:clamp(25px,4vw,38px);font-weight:900;line-height:1;opacity:0;transform-origin:center;will-change:transform,opacity}
.completion-check-inline::before{content:'✓';transform:translateY(-.02em)}
.completion-check-inline.show{animation:checkAppear 1.05s .2s cubic-bezier(.22,.8,.25,1) forwards}
.final-travel-layer.celebrate{animation:finalAnswerCelebrate 1.25s cubic-bezier(.2,.9,.25,1) forwards}
.equation.static-celebrate{animation:finalAnswerCelebrate 1.25s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes checkAppear{0%{opacity:0;transform:translateY(-50%) scale(.45) rotate(-12deg)}62%{opacity:1;transform:translateY(-50%) scale(1.15) rotate(2deg)}100%{opacity:1;transform:translateY(-50%) scale(1) rotate(0)}}
@keyframes finalAnswerCelebrate{0%{transform:scale(1)}55%{transform:scale(1.17)}100%{transform:scale(1.12)}}
@keyframes fractionDissolve{0%{opacity:0;filter:blur(5px)}45%{opacity:.38;filter:blur(2px)}100%{opacity:1;filter:blur(0)}}
@keyframes denDrop{to{opacity:1;transform:translateY(0)}}
.message[hidden]{display:none!important}.message{min-height:58px;margin-top:8px;padding:14px 16px;border:1px solid #dfd3c7;border-radius:14px;background:#f5f0e9;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;font-weight:800}.message.good{background:#eaf4f0;border-color:#bcd6cc;color:#24594b}.message.bad{background:#faecec;border-color:#e4bebe;color:#7c2b2b}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
button[hidden]{display:none!important}
.session-stats{display:flex;justify-content:center;gap:22px;margin:16px auto 0;padding:9px 16px;width:max-content;max-width:100%;border:1px solid #ded2c5;border-radius:999px;background:rgba(255,255,255,.72);color:var(--muted);font-size:14px;font-weight:800}.session-stats strong{color:var(--ink);font-size:16px;margin-left:5px}.check-work-btn{opacity:0;transform:translateY(5px);transition:opacity .45s ease,transform .45s ease}.check-work-btn.reveal{opacity:1;transform:translateY(0)}
.verification-panel{position:absolute;inset:8px 0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;opacity:0;transform:translateY(8px);transition:opacity .38s ease,transform .38s ease;pointer-events:none}.verification-panel.show{opacity:1;transform:translateY(0);pointer-events:auto}.equation-stage.verifying{display:block;min-height:250px}.equation-stage.verifying .equation{display:none}.equation-stage.verifying .verification-panel{position:relative;inset:auto;width:100%;padding:0;justify-content:flex-start}.verification-card{position:relative;box-sizing:border-box;width:min(680px,96%);margin:0 auto;background:#fff;border:1px solid #dfd4c7;border-radius:20px;padding:18px 20px;box-shadow:0 10px 25px rgba(62,42,24,.12);overflow:hidden}.verification-close{position:absolute;top:9px;right:11px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#6f665f;font:700 28px/1 Arial,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .18s ease,color .18s ease,transform .12s ease}.verification-close:hover{background:#f1ebe5;color:#2f2925}.verification-close:active{transform:scale(.94)}.verification-close:focus-visible{outline:3px solid rgba(31,117,254,.28);outline-offset:2px}.verification-title{text-align:center;font-size:18px;font-weight:900;color:var(--good);margin-bottom:12px}.verification-steps{display:flex;flex-direction:column;gap:7px}.verification-row{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:12px;min-height:42px;opacity:0;transform:translateY(8px);transition:opacity .42s ease,transform .42s ease,background .35s ease}.verification-row.show{opacity:1;transform:translateY(0)}.verification-label{text-align:right;color:var(--muted);font-size:13px;font-weight:800}.verification-math{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:clamp(25px,4.5vw,38px);font-weight:600;text-align:center;white-space:nowrap}.verification-row.substitute .verification-math{color:#1f75fe}.verification-row.final{border-radius:12px;padding:5px 8px}.verification-row.final.equal{background:#eaf4f0;color:var(--good)}.verification-result{text-align:center;margin-top:9px;font-weight:900;color:var(--good);opacity:0;visibility:hidden;transition:opacity .45s ease}.verification-result.show{visibility:visible;opacity:1}.verification-controls{display:flex;justify-content:center;align-items:center;min-height:48px;margin-top:12px}.verification-continue{min-width:150px;padding:11px 22px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 4px 0 rgba(83,47,24,.18);transition:transform .12s ease,opacity .2s ease}.verification-continue:hover{transform:translateY(-1px)}.verification-continue:active{transform:translateY(1px)}.verification-continue.finished{visibility:hidden!important;opacity:0!important;pointer-events:none!important;transform:none!important}
@media(max-width:650px){.app{padding:12px}.board{padding:14px}.equation-stage{min-height:220px}.equation{gap:.3em;padding:86px 2px 48px}.side-expression{gap:.24em}.term{padding:4px 2px}.term-sign{min-width:.44em;margin-right:.06em}.division-entry{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div><h1>Solving Equations</h1><p class="subtitle">Move a term beside its like term, then watch them combine.</p></div>
    <button class="primary" id="newBtn">New Equation</button>
  </div>
  <div class="session-stats" aria-label="Session progress"><span>Equations Solved <strong id="solvedCount">0</strong></span><span>Work Checked <strong id="checkedCount">0</strong></span></div>
  <section class="board">
    <div class="equation-stage" id="stage"><div class="equation" id="equation"></div><div class="verification-panel" id="verificationPanel" hidden aria-live="polite"></div></div>
    <div class="division-zone" id="divisionZone"><div class="division-prompt" id="divisionPrompt">What should we divide both sides by?</div><div class="division-entry" id="divisionEntry"><div class="division-choices" id="divisionChoices" role="group" aria-label="Choose a divisor"></div><input class="division-input" id="divisionInput" inputmode="decimal" aria-label="Divisor" placeholder=""><button class="division-submit" id="divisionSubmit">Divide</button></div><button class="division-continue" id="divisionContinue" type="button">Continue →</button><div class="division-work" id="divisionWork"></div></div>
    <div class="message" id="message" hidden></div>
    <div class="actions"><button class="primary" id="nextBtn" hidden>Next Problem</button><button class="secondary check-work-btn" id="checkWorkBtn" hidden>Check My Work</button><button class="secondary" id="restartBtn">Restart Equation</button></div>
  </section>
</div>
<div class="drag-ghost" id="ghost" hidden></div><div class="cross-note" id="crossNote">Crossed = → use the opposite</div>
<script>
(()=>{
function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function randomNonzero(min,max){let n=0;while(n===0)n=randomInt(min,max);return n;}
function generateEquation(){
  // Every displayed coefficient and constant stays between -16 and 16, excluding zero.
  // Build from an integer solution so every generated equation solves cleanly.
  for(let tries=0;tries<5000;tries++){
    const solution=randomNonzero(-10,10);
    const leftCoeff=randomNonzero(-16,16);
    let rightCoeff=randomNonzero(-16,16);
    if(rightCoeff===leftCoeff)continue;
    const leftConstant=randomNonzero(-16,16);
    const rightConstant=(leftCoeff-rightCoeff)*solution+leftConstant;
    if(rightConstant===0 || rightConstant < -16 || rightConstant > 16)continue;
    const eq={
      left:[{v:leftCoeff,t:'x'},{v:leftConstant,t:'c'}],
      right:[{v:rightCoeff,t:'x'},{v:rightConstant,t:'c'}]
    };
    return randomizeEquationOrder(eq);
  }
  // Safe fallback within the same range.
  return randomizeEquationOrder({left:[{v:-12,t:'x'},{v:15,t:'c'}],right:[{v:4,t:'x'},{v:-1,t:'c'}]});
}
let original,state,drag=null,locked=false,insertion=null;
// Original equations use conventional notation (x and −x). After the first
// arithmetic operation, coefficients of 1 remain explicit until the final answer.
let arithmeticStarted=false;
let divisionSteps=[],divisionStepBusy=false,divisionAdvancePending=false,divisionChoicePending=false;
function queueDivisionStep(action,busyMs){divisionSteps.push({action,busyMs});}
function updateDivisionContinue(){
  if(!divisionContinue)return;
  const hasWork=locked&&(divisionSteps.length||divisionStepBusy);
  divisionContinue.classList.toggle('show',hasWork);
  divisionContinue.disabled=divisionStepBusy||!divisionSteps.length;
}
function advanceDivisionStep(){
  if(!locked||!divisionSteps.length)return;
  if(divisionStepBusy){divisionAdvancePending=true;return;}
  const step=divisionSteps.shift();
  divisionStepBusy=true;
  divisionAdvancePending=false;
  updateDivisionContinue();
  step.action();
  setTimeout(()=>{
    divisionStepBusy=false;
    if(divisionSteps.length){
      if(divisionAdvancePending){
        divisionAdvancePending=false;
        advanceDivisionStep();
      }else{
        updateDivisionContinue();
        setMessage('Tap Continue for the next step.','good');
      }
    }else{
      updateDivisionContinue();
    }
  },step.busyMs);
}
const board=document.querySelector('.board'),eqEl=document.getElementById('equation'),stage=document.getElementById('stage'),message=document.getElementById('message'),ghost=document.getElementById('ghost'),crossNote=document.getElementById('crossNote'),divisionZone=document.getElementById('divisionZone'),divisionPrompt=document.getElementById('divisionPrompt'),divisionEntry=document.getElementById('divisionEntry'),divisionChoices=document.getElementById('divisionChoices'),divisionInput=document.getElementById('divisionInput'),divisionSubmit=document.getElementById('divisionSubmit'),divisionContinue=document.getElementById('divisionContinue'),divisionWork=document.getElementById('divisionWork');
const nextBtn=document.getElementById('nextBtn'),checkWorkBtn=document.getElementById('checkWorkBtn'),verificationPanel=document.getElementById('verificationPanel'),solvedCountEl=document.getElementById('solvedCount'),checkedCountEl=document.getElementById('checkedCount');
let solvedCount=0,checkedCount=0,currentSolution=null,currentSolvedRecorded=false,currentChecked=false,checkRevealTimer=null,verificationRun=0;
const clone=x=>JSON.parse(JSON.stringify(x));
function randomizeEquationOrder(eq){
  const out=clone(eq);
  if(Math.random()<.5)out.left.reverse();
  if(Math.random()<.5)out.right.reverse();
  return out;
}
function absText(t){if(t.t==='x'){if(Math.abs(t.v)===1)return'x';return Math.abs(t.v)+'x'}return String(Math.abs(t.v));}
function signedText(t){if(t.t==='x'){if(t.v===1)return'x';if(t.v===-1)return'−x';return String(t.v).replace('-','−')+'x'}return String(t.v).replace('-','−');}
function explicitSignedText(t){const core=absText(t);return (t.v<0?'−':'+')+core;}
// Blue grouped expressions are formatted as a self-contained expression:
// the first term never carries a leading plus, while coefficients of 1
// remain explicit so students can see 1x during the combining step.
function blueGroupedTermText(t,isFirst=false){
  const core=t.t==='x'&&Math.abs(t.v)===1?'1x':absText(t);
  if(isFirst)return t.v<0?'−'+core:core;
  return (t.v<0?'−':'+')+core;

    stage.appendChild(measure);
    const tx=measure.querySelector('.fm-x').getBoundingClientRect();
    const te=measure.querySelector('.fm-eq').getBoundingClientRect();
    const ta=measure.querySelector('.fm-a').getBoundingClientRect();

    const layer=document.createElement('div');
    layer.className='final-travel-layer';
    const makePiece=(text,r,cls)=>{
      const el=document.createElement('span');
      el.className='final-travel-piece '+cls;
      el.textContent=text;
      el.style.transform=`translate(${r.left-stageRectNow.left}px,${r.top-stageRectNow.top}px)`;
      layer.appendChild(el);
      return el;
    };
    const px=makePiece('x',xRect,'travel-x');
    const pe=makePiece('=',eqRect,'travel-eq');
    const pa=makePiece(resultText,ansRect,'travel-answer');
    stage.appendChild(layer);

    // The travel layer is now pixel-for-pixel over the originals. Hide the
    // entire fraction once—rather than hiding individual pieces—so no second
    // answer can remain visible underneath it.
    root.style.visibility='hidden';

    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const move=(el,from,to)=>el.animate([
        {transform:`translate(${from.left-stageRectNow.left}px,${from.top-stageRectNow.top}px)`},
        {transform:`translate(${to.left-stageRectNow.left}px,${to.top-stageRectNow.top}px)`}
      ],{duration:1425,easing:'cubic-bezier(.22,.8,.25,1)',fill:'forwards'});
      const ax=move(px,xRect,tx);
      const ae=move(pe,eqRect,te);
      const aa=move(pa,ansRect,ta);
      setMessage('Keep your eyes on the x and the answer as they slide into the finished equation.','good');

      Promise.all([ax.finished,ae.finished,aa.finished]).then(()=>{
        data.c.v=result;
        data.x.v=1;
        addHistory(`${before}  →  ${equationText(state)}`);

        // Keep the same three traveling elements as the final answer. There is
        // no second render, so the quotient cannot duplicate or flash.
        px.style.transform=`translate(${tx.left-stageRectNow.left}px,${tx.top-stageRectNow.top}px)`;
        pe.style.transform=`translate(${te.left-stageRectNow.left}px,${te.top-stageRectNow.top}px)`;
        pa.style.transform=`translate(${ta.left-stageRectNow.left}px,${ta.top-stageRectNow.top}px)`;
        eqEl.innerHTML='';
        measure.remove();
        divisionZone.classList.remove('show');

        // Celebration begins only after the mathematical motion is complete.
        // Keep it restrained: a soft green board and one green checkmark just
        // to the right of the finished expression.
        board.classList.add('completed');
        const check=document.createElement('span');
        check.className='completion-check-inline';
        check.textContent='';
        const checkGap=Math.max(18,parseFloat(getComputedStyle(eqEl).fontSize)*.28);
        check.style.left=(ta.right-stageRectNow.left+checkGap)+'px';
        check.style.top=(ta.top-stageRectNow.top+(ta.height/2))+'px';
        check.style.transform='translateY(-50%) scale(.45)';
        layer.appendChild(check);
        layer.classList.add('celebrate');
        requestAnimationFrame(()=>check.classList.add('show'));
        setMessage(`Solved! x = ${resultText}`,'good');
        revealCompletionActions(result);
        locked=false;
      });
    }));
    });
  },3300);
  updateDivisionContinue();
}
divisionSubmit.addEventListener('click',submitDivision);
divisionContinue.addEventListener('click',advanceDivisionStep);
divisionInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitDivision();});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&locked&&(divisionSteps.length||divisionStepBusy)){
    e.preventDefault();
    if(e.repeat)return;
    advanceDivisionStep();
  }
});
function start(eq){clearTimeout(checkRevealTimer);hideVerification();currentSolution=null;currentSolvedRecorded=false;currentChecked=false;nextBtn.hidden=true;checkWorkBtn.hidden=true;checkWorkBtn.classList.remove('reveal');arithmeticStarted=false;divisionSteps=[];divisionStepBusy=false;divisionAdvancePending=false;divisionChoicePending=false;divisionPrompt.style.display='';divisionEntry.classList.remove('hidden');divisionChoices.innerHTML='';divisionContinue.classList.remove('show');divisionContinue.disabled=false;board.classList.remove('completed');eqEl.classList.remove('static-celebrate');stage.querySelectorAll('.final-travel-layer,.final-measure,.completion-check-inline').forEach(el=>el.remove());const normalized={left:[eq.left[0]||null,eq.left[1]||null],right:[eq.right[0]||null,eq.right[1]||null]};original=clone(normalized);state=clone(normalized);addHistory(equationText(state));render();}
document.getElementById('newBtn').onclick=()=>start(generateEquation());document.getElementById('restartBtn').onclick=()=>start(original);nextBtn.addEventListener('click',()=>start(generateEquation()));checkWorkBtn.addEventListener('click',runVerification);updateSessionStats();start(generateEquation());
})();
</script>
