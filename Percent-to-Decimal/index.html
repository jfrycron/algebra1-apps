<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percent to Decimal — Infinite Practice</title><style>
:root{font-family:Geist,Inter,"Segoe UI",Arial,sans-serif;color:#1b2935;background:#eaf0f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;transition:background .25s}body.complete{background:#24b354}.workspace{width:min(580px,100%);background:#fff;border:1px solid #cbd5df;border-radius:20px;padding:26px 28px;box-shadow:0 8px 25px #20304412}header{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:22px}h1{font-size:27px;letter-spacing:-.6px;margin:0 0 5px}.instructions{color:#64748b;font-size:14px;margin:0}.pill{border:1px solid #cbd5df;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:13px;color:#475569}table{border-collapse:collapse;table-layout:fixed;width:min(370px,100%);margin:auto}th,td{border:1px solid #cbd5df;text-align:center}th{background:#e5e9ee;font-size:18px;padding:10px}td{height:51px;font-size:21px}tbody tr:nth-child(even){background:#f7f9fb}.entry{display:flex;align-items:center;justify-content:center;gap:5px}input{width:90px;height:36px;border:1.5px solid #b8c6d5;border-radius:7px;text-align:center;font:inherit;font-size:19px;outline:none;background:#fff}input:focus{border-color:#2563eb}input.good{background:#e1f7e7;border-color:#1e9c54}input.bad{background:#fff0ee;border-color:#bb3f3f}input:disabled{opacity:1;color:#126437}.mark{width:19px;font-weight:700;font-size:21px}.mark.yes{color:#16803b}.mark.no{color:#b91c1c}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}.status{color:#64748b;font-size:13px;max-width:245px}.status.done{color:#16803b;font-weight:700}button{border:0;background:#243e57;color:white;border-radius:999px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}button:disabled{background:#bac4ce;cursor:not-allowed}@media(max-width:480px){.workspace{padding:18px 12px}h1{font-size:23px}td{height:48px}}
</style></head><body><main class="workspace"><header><div><h1>Percent to Decimal</h1></div><span class="pill" id="round">Table 1</span></header><table><thead><tr><th>Decimal</th><th>Percent</th></tr></thead><tbody id="rows"></tbody></table><div class="footer"><button id="action" disabled>Check Answers</button><button id="newTable" type="button">New Table</button></div></main><script>
const rows=document.getElementById('rows'),action=document.getElementById('action'),roundEl=document.getElementById('round'),newTable=document.getElementById('newTable');
let round=0,questions=[],seen=new Set(),results=Array(8).fill(false),hasChecked=false;
const initial=[['.6',60],['.07',7],['.29',29],['.09',9],['.51',51],['.899',89.9],['.2375',23.75],['.8',80]];
function makeQuestions(){
 if(round===0){initial.forEach(x=>seen.add(x[0]));return initial.map(([d,p])=>({d,p}));}
 const next=[];
 // Six whole-number percents, one one-decimal percent, and one two-decimal percent.
 const kinds=['whole','whole','whole','whole','whole','whole','tenths','hundredths'];
 for(let i=kinds.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[kinds[i],kinds[j]]=[kinds[j],kinds[i]]}
 for(const kind of kinds){
  let p,d,key,attempt=0;
  do{
   if(kind==='whole')p=Math.floor(Math.random()*100)+1;
   else if(kind==='tenths')p=(Math.floor(Math.random()*999)+1)/10;
   else p=(Math.floor(Math.random()*9999)+1)/100;
   if(kind==='tenths'&&Number.isInteger(p))continue;
   if(kind==='hundredths'&&Number.isInteger(p*10))continue;
   d=(p/100).toString().replace(/^0(?=\\.)/,'');
   key=String(p);attempt++;
  }while((seen.has(key)||next.some(q=>q.p===p))&&attempt<1000);
  seen.add(key);next.push({d,p});
 }
 return next;
}
function inputs(){return [...rows.querySelectorAll('input')]}
function refresh(){const all=inputs();if(results.every(Boolean)){action.disabled=true;action.textContent='Check Answers';document.body.classList.add('complete');return}action.textContent='Check Answers';action.disabled=all.some(i=>!i.value.trim());}
function draw(){document.body.classList.remove('complete');questions=makeQuestions();results=Array(8).fill(false);hasChecked=false;roundEl.textContent='Table '+(round+1);rows.innerHTML='';questions.forEach((q,index)=>{const tr=document.createElement('tr');const left=document.createElement('td');const right=document.createElement('td');right.textContent=q.p+'%';const wrap=document.createElement('div');wrap.className='entry';const input=document.createElement('input');input.inputMode='decimal';input.autocomplete='off';input.setAttribute('aria-label','Decimal for '+q.p+' percent');const mark=document.createElement('span');mark.className='mark';mark.setAttribute('aria-live','polite');wrap.append(input,mark);left.append(wrap);tr.append(left,right);rows.append(tr);input.addEventListener('input',()=>{if(!results[index]){input.classList.remove('bad');mark.textContent=''}refresh()});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const editable=inputs().filter(x=>!x.disabled);const next=editable.find(x=>inputs().indexOf(x)>index)||editable[0];if(next&&next!==input)next.focus();else if(!action.disabled)action.focus()}})});refresh()}
function check(){if(results.every(Boolean))return;const all=inputs();if(all.some(x=>!x.value.trim()))return;let count=0;all.forEach((input,i)=>{if(results[i]){count++;return}const raw=input.value.trim();const value=Number(raw);const ok=raw!==''&&Number.isFinite(value)&&Math.abs(value-Number(questions[i].d))<1e-7;results[i]=ok;input.classList.toggle('good',ok);input.classList.toggle('bad',!ok);input.disabled=ok;const mark=input.parentNode.querySelector('.mark');mark.textContent=ok?'✓':'×';mark.className='mark '+(ok?'yes':'no');if(ok)count++});hasChecked=true;refresh();if(count<8)inputs().find(x=>!x.disabled)?.focus()}
action.addEventListener('click',check);newTable.addEventListener('click',()=>{round++;draw();inputs()[0].focus()});draw();
</script></body></html>
