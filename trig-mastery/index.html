<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trig Mastery</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0f4;color:#182333;font:17px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}body.good{background:#65d78a}main{width:min(760px,96vw);background:white;border-radius:24px;padding:clamp(18px,4vw,36px);box-shadow:0 8px 32px #0001}header,nav,footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}h1{font-size:24px;margin:0}button,select,input{font:inherit;border:1px solid #ccd3dc;border-radius:12px;background:white;padding:12px;color:inherit}button{cursor:pointer}button:hover{background:#eef4fa}button:disabled{opacity:.55;cursor:default}.primary{background:#17663b;color:white;border:0}.primary:hover{background:#12532f}.lesson{background:#f2f6fb;border-radius:16px;padding:20px;text-align:center;margin:20px 0}.big{font-size:clamp(28px,6vw,48px);font-weight:600;text-align:center;margin:24px 0}.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.choices button{min-width:90px;font-size:23px}.muted{color:#596579;font-size:14px}#feedback{text-align:center;min-height:30px;margin:16px 0}#next{display:block;margin:auto}footer{margin-top:24px}progress{width:100%;accent-color:#16834b}input{width:min(220px,100%)}[hidden]{display:none!important}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15}.frac span:first-child{border-bottom:2px solid;padding:0 6px}.frac span:last-child{padding:0 6px}
</style><main><header><h1>Trig Mastery</h1><span class="muted" id="saved"></span></header><nav style="margin-top:18px"><select id="stage" aria-label="Lesson"></select><select id="mode" aria-label="Practice mode"><option value="choice">Recognition</option><option value="recall">Recall</option></select></nav><div id="lesson" class="lesson"></div><button id="teach">Teaching card</button><div class="big" id="question"></div><div class="choices" id="choices"></div><div id="feedback" role="status"></div><button class="primary" id="next" hidden>Correct — Next Problem</button><footer><span id="stats" class="muted"></span><button id="advance" hidden>Next lesson</button></footer><progress id="bar" max="10" value="0"></progress><footer><button id="export">Export progress</button><button id="import">Import progress</button><input type="file" id="file" accept="application/json" hidden></footer></main><script>
const $=id=>document.getElementById(id), pairs=[['sin','csc','Sine','Cosecant','O','H'],['cos','sec','Cosine','Secant','A','H'],['tan','cot','Tangent','Cotangent','O','A']], names=['Sine & cosecant','Add cosine & secant','Add tangent & cotangent','Mixed reciprocal partners','Reciprocal fractions'];const key='trig-mastery-v1';let data={stage:0,mode:'choice',records:{},streaks:{}};try{let d=JSON.parse(localStorage.getItem(key));if(d&&d.records&&d.streaks)data=d}catch{}let stage=Math.max(0,Math.min(4,Number(data.stage)||0)),q,done=false,missed=false,started=0,previous='',teachOpen=true;const frac=(a,b)=>'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>';function save(){data.stage=stage;data.mode=$('mode').value;try{localStorage.setItem(key,JSON.stringify(data));$('saved').textContent='Progress saved on this device'}catch{$('saved').textContent='Storage unavailable — export progress'}}names.forEach((n,i)=>$('stage').add(new Option((i+1)+' · '+n,i)));$('stage').value=stage;$('mode').value=data.mode==='recall'?'recall':'choice';function pool(){let out=[];pairs.slice(0,Math.min(stage+1,3)).forEach((p,i)=>{for(let j=0;j<2;j++){let a=p[j],b=p[1-j];out.push({id:stage===4?'f'+a:a,p:i,a,b,html:stage===4?frac('1',a+' θ')+' = ?':a+' ↔ ?'})}});return out}function card(){let p=pairs[q.p];$('lesson').innerHTML='<strong>'+p[2]+' &amp; '+p[3]+'</strong><div style="font-size:26px;margin:14px">'+p[0]+' θ = '+frac(p[4],p[5])+' &nbsp; '+p[1]+' θ = '+frac(p[5],p[4])+'</div><div>'+p[0]+' ↔ '+p[1]+'</div><p class="muted">Same sides. Flipped fraction. Reciprocal partners.</p>';$('lesson').hidden=!teachOpen}function stats(){let s=data.streaks[stage+'-'+$('mode').value]||0;$('stats').textContent=s+' correct in a row';$('bar').value=Math.min(10,s);$('advance').hidden=s<10||stage===4}function next(){let all=pool(), candidates=all.filter(x=>x.id!==previous);if(!candidates.length)candidates=all;let weights=candidates.map(x=>{let r=data.records[x.id+'-'+$('mode').value]||{right:0,wrong:0};return 1+4*(r.wrong+1)/(r.right+r.wrong+2)}),n=Math.random()*weights.reduce((a,b)=>a+b,0);q=candidates[candidates.length-1];for(let i=0;i<candidates.length;i++){n-=weights[i];if(n<=0){q=candidates[i];break}}previous=q.id;done=false;missed=false;started=Date.now();document.body.classList.remove('good');$('question').innerHTML=q.html;$('feedback').textContent='';$('next').hidden=true;$('choices').replaceChildren();card();if($('mode').value==='recall'){let input=document.createElement('input');input.placeholder='Type function';input.setAttribute('aria-label','Answer');let b=document.createElement('button');b.textContent='Check';b.onclick=()=>answer(input.value);input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();done?next():answer(input.value)}};$('choices').append(input,b);input.focus()}else{let opts=pairs.flatMap(p=>p.slice(0,2)).filter(x=>x!==q.a);opts=opts.filter(x=>x!==q.b).sort(()=>Math.random()-.5).slice(0,2).concat(q.b).sort(()=>Math.random()-.5);opts.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>answer(x);$('choices').append(b)})}stats()}function answer(v){if(done)return;v=v.trim().toLowerCase();let aliases={sine:'sin',cosine:'cos',tangent:'tan',cosecant:'csc',secant:'sec',cotangent:'cot'};v=aliases[v]||v;if(!v)return;let k=q.id+'-'+$('mode').value,r=data.records[k]||(data.records[k]={right:0,wrong:0,ms:0,last:0}),s=stage+'-'+$('mode').value;if(v===q.b){if(!missed){r.right++;r.ms+=Date.now()-started;data.streaks[s]=(data.streaks[s]||0)+1}r.last=Date.now();done=true;document.body.classList.add('good');$('feedback').textContent=q.a+' ↔ '+q.b;$('next').hidden=false;$('choices').querySelectorAll('button').forEach(b=>b.disabled=true)}else{r.wrong++;r.last=Date.now();missed=true;data.streaks[s]=0;$('feedback').textContent='Try again. '+q.a+' and '+q.b+' are partners.';teachOpen=true;card()}save();stats()}$('next').onclick=()=>{teachOpen=false;next()};$('teach').onclick=()=>{teachOpen=!teachOpen;card()};$('stage').onchange=()=>{stage=Number($('stage').value);teachOpen=true;previous='';save();next()};$('mode').onchange=()=>{teachOpen=true;save();next()};$('advance').onclick=()=>{if(stage<4){$('stage').value=stage+1;$('stage').onchange()}};document.addEventListener('keydown',e=>{if(e.key==='Enter'&&done&&e.target.tagName!=='INPUT'){e.preventDefault();$('next').click()}});$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='trig-mastery-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let d=JSON.parse(await $('file').files[0].text());if(!d.records||!d.streaks||!Number.isInteger(d.stage)||d.stage<0||d.stage>4)throw Error();data=d;stage=d.stage;$('stage').value=stage;$('mode').value=d.mode==='recall'?'recall':'choice';save();teachOpen=true;next()}catch{alert('Unable to import progress.')}};save();next();
</script></html>
