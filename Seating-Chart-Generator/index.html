<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seating Chart Generator</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#243042}*{box-sizing:border-box}body{margin:0;background:#eee9df}button,select{font:inherit}button{cursor:pointer}.app{height:100dvh;display:flex;flex-direction:column}.toolbar{background:#fffefa;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 9px #0002;z-index:2}.brand{font-weight:800;font-size:20px;margin-right:auto}.btn,select{border:1px solid #b7bdc3;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.btn.primary{background:#237448;color:white;border-color:#237448}.btn:hover{filter:brightness(.95)}.btn:disabled{opacity:.4}.status{font-size:12px;color:#53606a}.chart{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:12px 16px 18px;gap:8px;background-color:#eed8b9;background-image:linear-gradient(90deg,#cda87b1c 1px,transparent 1px),linear-gradient(#cda87b1c 1px,transparent 1px);background-size:32px 32px}.front,.back{font-weight:900;letter-spacing:.15em;font-size:clamp(11px,1.6vh,16px);color:#52606a;text-align:center}.smartboard{width:min(48%,490px);height:clamp(22px,4.8vh,43px);border:5px solid #343b44;border-radius:6px;background:linear-gradient(180deg,#333e4b,#141a23);box-shadow:0 5px 0 #858a8f,0 8px 7px #0003;position:relative}.smartboard:after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:3px;background:#64b9ee;border-radius:4px}.seats{width:min(100%,1120px);flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));column-gap:clamp(4px,1.5vw,22px);row-gap:clamp(3px,1.2vh,15px);align-items:stretch;justify-items:stretch}.seat{position:relative;min-width:0;min-height:0;display:flex;align-items:flex-end;justify-content:center;padding-top:clamp(10px,2vh,19px);outline:none}.chair{position:absolute;top:0;width:54%;height:42%;max-height:33px;background:linear-gradient(#1b67bf,#074288);border:2px solid #073569;border-radius:40% 40% 22% 22%;box-shadow:inset 0 3px 3px #8bc6ff99,0 2px 2px #0004}.chair:after{content:"";position:absolute;top:3px;left:40%;width:20%;height:3px;border-radius:9px;background:#d3a96e}.desktop{position:relative;width:100%;height:79%;background:linear-gradient(145deg,#fff,#f1f3f4);border:2px solid #7b8083;border-radius:8px;box-shadow:0 3px 2px #0002;display:flex;align-items:center;justify-content:center;padding:5px 7px;text-align:center;overflow:hidden}.student-name{font-size:clamp(10px,1.4vw,19px);font-weight:800;overflow-wrap:anywhere;line-height:1.12}.seat.empty .desktop{background:#f5f6f6a9}.seat.empty .student-name{font-weight:400;color:#a1a5a8;font-size:12px}.seat.locked .desktop{border:3px solid #d79a21}.lock{position:absolute;top:0;right:0;z-index:1;border:0;background:#fffefaee;border-radius:5px;padding:2px 4px;font-size:13px;display:none}.seat:hover .lock,.seat:focus-within .lock,.seat.locked .lock{display:block}.seat.drag-over .desktop{outline:4px solid #1c965c}.extra{width:min(100%,1120px);display:flex;justify-content:center;height:clamp(44px,9vh,90px);flex-shrink:0}.extra .seat{width:min(16%,160px);height:100%}.extra{gap:clamp(12px,3vw,42px)}.chart.teacher .seats{transform:rotate(180deg)}.chart.teacher .seats .seat{transform:rotate(180deg)}.chart.teacher .extra{transform:rotate(180deg)}.chart.teacher .extra .seat{transform:rotate(180deg)}.chart.teacher .front{order:5}.chart.teacher .smartboard{order:4}.chart.teacher .extra{order:2}.chart.teacher .seats{order:3}.chart.teacher .back{order:1}.settings{position:relative}.settings-menu{position:absolute;right:0;top:calc(100% + 8px);width:250px;padding:13px;background:#fffefa;border:1px solid #c9c9c9;border-radius:10px;box-shadow:0 10px 22px #0003;display:flex;flex-direction:column;gap:10px}.settings-menu label{font-size:13px;display:flex;align-items:center;gap:8px}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#0008;z-index:10;display:grid;place-items:center;padding:16px}.modal{background:white;border-radius:12px;padding:20px;width:min(500px,95vw);max-height:90vh;overflow:auto}.modal h2{margin-top:0}.attendance-list{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.attendance-list button{padding:7px 3px;font-size:12px;border:1px solid #bfc8ce;border-radius:6px;background:#edf8ee;overflow-wrap:anywhere}.attendance-list button.absent{background:#f8d4d0;color:#8e2821}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.full .toolbar{display:none}.full .chart{padding:8px}.floating{display:none;position:fixed;bottom:14px;right:14px;z-index:3;gap:7px;opacity:.25}.full .floating{display:flex}.floating:hover,.floating:focus-within{opacity:1}@media(max-width:850px){.brand{width:100%;font-size:17px}.toolbar{gap:6px;padding:7px}.btn,select{padding:7px}.desktop{padding:2px}.student-name{font-size:clamp(9px,1.5vw,15px)}.seat{padding-top:10px}.chair{max-height:22px}}@media print{@page{size:landscape;margin:8mm}.toolbar,.floating,.modal-backdrop{display:none!important}.app{height:185mm}.chart{height:185mm;print-color-adjust:exact;-webkit-print-color-adjust:exact}.lock{display:none!important}.student-name{font-size:12pt}}
.seat{align-items:flex-start;padding-top:0;padding-bottom:clamp(10px,2vh,19px)}.chair{top:auto;bottom:0;border-radius:22% 22% 40% 40%;box-shadow:inset 0 -3px 3px #8bc6ff99,0 2px 2px #0004}.desktop{z-index:1}.seat .lock{z-index:2} .seat.blocked .desktop{background:#b6bcc2;border:2px dashed #737a80;box-shadow:none;color:#525a62}.seat.blocked .student-name{font-size:clamp(18px,3vh,32px);font-weight:900;color:#626b73}.seat.blocked .chair{opacity:.4}.seat.blocked .lock{display:none} .seat.occupied .lock{display:block;top:25%;right:3px;min-width:29px;min-height:29px;background:#f5f8ff;border:1px solid #a7b4c3;border-radius:8px;font-size:16px;box-shadow:0 1px 3px #0003}.seat.occupied.locked .lock{background:#fff0bf;border-color:#c48b16}.seat.occupied.locked .desktop{background:linear-gradient(145deg,#fff8d7,#fff1bc);border-color:#d79a21}.seat.occupied .lock:hover{background:#d8eaff}.seat.blocked .lock,.seat.empty .lock{display:none!important}@media(max-width:850px){.seat.occupied .lock{min-width:24px;min-height:24px;font-size:13px;right:0;top:22%}} .seat.occupied .lock{position:absolute!important;top:auto!important;bottom:1px!important;right:1px!important;width:19px!important;height:19px!important;min-width:0!important;min-height:0!important;padding:0!important;font-size:11px!important;line-height:16px!important;border-radius:4px!important;box-shadow:none!important;z-index:4!important}.seat.occupied .student-name{padding:0 9px}.seat.occupied.locked .desktop{outline:2px solid #d79a21}.seat.occupied.locked .lock{background:#f5d889!important}.seat.occupied .lock{opacity:.9} .seat .lock-indicator{position:absolute;z-index:5;top:0;right:4px;font-size:13px;line-height:1;pointer-events:none}.seat.locked .desktop{background:#fff4c8!important;border:3px solid #cf931d!important}.seat.locked .student-name{color:#1c2937}.seat .lock{display:none!important}.seat:not(.locked) .lock-indicator{display:none}.chart.teacher .front,.chart.teacher .back{flex-shrink:0} .chart.teacher .seat{align-items:flex-end;padding-top:clamp(10px,2vh,19px);padding-bottom:0}.chart.teacher .seat .chair{top:0;bottom:auto;border-radius:40% 40% 22% 22%;box-shadow:inset 0 3px 3px #8bc6ff99,0 2px 2px #0004}.seat.occupied:not(.locked):not(.blocked){cursor:grab}.seat.dragging{opacity:.5}.seat.drag-over .desktop{outline:4px solid #1c965c}.chart.teacher .seat .lock-indicator{top:auto;bottom:0} .seat .seat-lock{display:none;position:absolute;z-index:8;bottom:0;left:50%;transform:translateX(-50%);width:22px;height:19px;padding:0;border:1px solid #8a98a6;border-radius:5px;background:#fff;font-size:12px;line-height:16px;cursor:pointer;touch-action:manipulation}.seat.occupied:not(.blocked) .seat-lock{display:block}.seat.locked .seat-lock{background:#ffe4a0;border-color:#bf841b}.seat .seat-lock:hover{background:#dceaf9}.chart.teacher .seat .seat-lock{top:0;bottom:auto}.seat .lock-indicator{display:none!important}.seat.occupied .desktop{height:74%}.seat .seat-lock:focus-visible{outline:3px solid #2478d0} 
/* Slim wall-mounted Smartboard: keep the restored seating layout unchanged */
.chart{position:relative}
.chart .smartboard{height:clamp(9px,1.5vh,15px);border:2px solid #343b44;border-radius:3px;box-shadow:0 2px 2px #0002;flex-shrink:0;margin-top:-7px;margin-bottom:0}
.chart .smartboard:after{bottom:-2px;height:2px}
.chart .front{margin-bottom:-7px}
.chart.teacher .smartboard{margin-top:0;margin-bottom:-7px}
.chart.teacher .front{margin-bottom:0;margin-top:-7px}

/* Warm peach square floor tiles matched to the uploaded Attendance Layout */
.chart{background-color:#f5d6b2;background-image:linear-gradient(90deg,rgba(173,113,68,.11) 1px,transparent 1px),linear-gradient(rgba(173,113,68,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.14) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.10) 50%,transparent 50%);background-size:24px 24px,24px 24px,96px 96px,96px 96px;background-position:0 0,0 0,0 0,48px 48px}

/* Give FRONT its own breathing room below the wall edge */
.chart:not(.teacher) .front{margin:0!important;padding-top:7px;line-height:1.4;flex-shrink:0;position:relative;z-index:1}
.chart:not(.teacher) .smartboard{margin-top:0!important}
.chart.teacher .front{margin:0!important;padding-bottom:7px;line-height:1.4;flex-shrink:0;position:relative;z-index:1}

/* Simple teaching cart locator beside the Smartboard */
.chart{position:relative}
.teaching-cart-marker{position:absolute;top:clamp(45px,8vh,80px);left:max(10px,calc(50% - min(24%,245px) - 128px));width:112px;height:39px;border:2px solid #415269;border-radius:5px;background:#fffdf5;box-shadow:0 2px 3px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#263c54;font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:10px;line-height:1.05;text-align:center;z-index:1;pointer-events:none}
.teaching-cart-marker span:first-child{font-size:10px;color:#9c4e19}
.chart.teacher .teaching-cart-marker{top:auto;bottom:clamp(45px,8vh,80px);left:auto;right:max(10px,calc(50% - min(24%,245px) - 128px))}
@media(max-width:700px){.teaching-cart-marker{width:80px;height:34px;font-size:8px;left:8px;top:43px}.teaching-cart-marker span:first-child{font-size:8px}.chart.teacher .teaching-cart-marker{right:8px;bottom:43px}}

/* Reserve an actual front-wall row for cart and Smartboard: no desk overlap */
.chart .front-fixtures{order:initial;position:relative;width:100%;height:clamp(42px,6.4vh,57px);flex:0 0 auto;display:flex;align-items:flex-start;justify-content:center;margin:0;padding:0}
.chart .front-fixtures .smartboard{width:min(48%,490px);height:clamp(9px,1.5vh,15px);margin:0!important;flex-shrink:0}
.chart .front-fixtures .teaching-cart-marker{position:absolute;top:0;bottom:auto;left:max(6px,calc(50% - min(24%,245px) - 124px));right:auto;width:112px;height:39px;margin:0;z-index:1}
.chart.teacher .front-fixtures{order:4;align-items:flex-end}
.chart.teacher .front-fixtures .smartboard{order:initial;margin:0!important}
.chart.teacher .front-fixtures .teaching-cart-marker{top:auto;bottom:0;left:auto;right:max(6px,calc(50% - min(24%,245px) - 124px))}
@media(max-width:700px){.chart .front-fixtures .teaching-cart-marker{left:4px;width:78px;height:34px}.chart.teacher .front-fixtures .teaching-cart-marker{right:4px;left:auto}}

/* Rotate teaching cart and its lettering 90 degrees counterclockwise */
.chart .front-fixtures .teaching-cart-marker{transform:rotate(-90deg);transform-origin:center center;top:13px}
.chart.teacher .front-fixtures .teaching-cart-marker{top:auto;bottom:13px}
@media(max-width:700px){.chart .front-fixtures .teaching-cart-marker{top:10px}.chart.teacher .front-fixtures .teaching-cart-marker{top:auto;bottom:10px}}
</style></head><body><div class="app" id="app"><header class="toolbar"><div class="brand">Seating Chart Generator</div><label>Class <select id="classSelect"></select></label><button class="btn primary" id="shuffleBtn">↻ Shuffle Seats</button><button class="btn" id="clearBtn">Clear</button><button class="btn" id="viewBtn">Teacher View</button><button class="btn" id="fullBtn">⛶ Full Screen</button><div class="settings"><button class="btn" id="settingsBtn" aria-expanded="false">⚙ Settings</button><div class="settings-menu hidden" id="settingsMenu"><button class="btn" id="attendanceBtn">Attendance</button><label><input type="checkbox" id="extraToggle"> Show extra desks (31st and 32nd)</label><button class="btn" id="unlockBtn">Unlock All Seats</button><button class="btn" id="printBtn">Print Seating Chart</button><button class="btn" id="resetBtn">Clear Seating Chart</button><div class="status">Rosters are shared with Random Group Generator in this browser. Manage them there.</div></div></div></header><main class="chart" id="chart"><div class="front">FRONT</div><div class="front-fixtures"><div class="smartboard" role="img" aria-label="Overhead view of classroom Smartboard"></div><div class="teaching-cart-marker" aria-label="You are here: teaching cart"><span>YOU ARE HERE</span><span>TEACHING CART</span></div></div><div class="seats" id="seats"></div><div class="extra" id="extra"></div><div class="back">BACK</div></main><div class="floating"><button class="btn primary" id="fsShuffle">↻ Shuffle</button><button class="btn" id="fsExit">Exit Full Screen</button></div></div><div class="modal-backdrop hidden" id="modalBackdrop"><div class="modal"><h2>Today's Attendance</h2><p>Select students who are absent. Attendance is shared with the group generator.</p><div id="attendanceList" class="attendance-list"></div><div class="modal-actions"><button class="btn" id="allPresent">All Present</button><button class="btn primary" id="attendanceDone">Done</button></div></div></div>
<script>
(()=>{'use strict';
const KEY='carron-random-groups-v1',SEAT_KEY='carron-seating-chart-v1', $=id=>document.getElementById(id);
let groupData={},saved={};try{groupData=JSON.parse(localStorage.getItem(KEY))||{}}catch{}try{saved=JSON.parse(localStorage.getItem(SEAT_KEY))||{}}catch{}
if(!groupData.rosters||typeof groupData.rosters!=='object')groupData.rosters={'1st Hour':[],'2nd Hour':[],'3rd Hour':[],'4th Hour':[],'5th Hour':[],'6th Hour':[]};
const today=()=>new Date().toLocaleDateString('en-CA');if(groupData.attendanceDay!==today()){groupData.absent={};groupData.attendanceDay=today();groupData.groups=[];try{localStorage.setItem(KEY,JSON.stringify(groupData))}catch{}}
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected=Object.keys(groupData.rosters).includes(saved.selected)?saved.selected:(groupData.selected||Object.keys(groupData.rosters)[0]),teacher=false,dragSource=null,suppressClickUntil=0;
const roster=()=>groupData.rosters[selected]||[], absent=()=>new Set((groupData.absent||{})[selected]||[]),present=()=>roster().filter(n=>!absent().has(n));
function chart(){if(!saved.charts)saved.charts={};if(!saved.charts[selected])saved.charts[selected]={seats:Array(32).fill(null),locks:Array(32).fill(false),blocked:Array(32).fill(false),extra:false};const c=saved.charts[selected];c.seats=Array.from({length:32},(_,i)=>c.seats?.[i]||null);c.locks=Array.from({length:32},(_,i)=>!!c.locks?.[i]);c.blocked=Array.from({length:32},(_,i)=>!!c.blocked?.[i]);return c}
function save(){saved.selected=selected;try{localStorage.setItem(SEAT_KEY,JSON.stringify(saved))}catch{alert('Browser storage unavailable.')}}function saveAttendance(){try{localStorage.setItem(KEY,JSON.stringify(groupData))}catch{}}
function syncRosters(){try{const fresh=JSON.parse(localStorage.getItem(KEY));if(fresh?.rosters){groupData=fresh;if(groupData.attendanceDay!==today()){groupData.absent={};groupData.attendanceDay=today();groupData.groups=[];saveAttendance()}}}catch{}}
function renderSelect(){syncRosters();const names=Object.keys(groupData.rosters);if(!names.includes(selected))selected=names[0];$('classSelect').innerHTML=names.map(n=>'<option value="'+escapeHtml(n)+'">'+escapeHtml(n)+'</option>').join('');$('classSelect').value=selected}
function normalize(){const c=chart(),allowed=new Set(present()),seen=new Set();c.seats=c.seats.map((n,i)=>{if(c.blocked[i]||!n||!allowed.has(n)||seen.has(n))return null;seen.add(n);return n});if(present().length>30)c.extra=true;save()}
function seatMarkup(i){const c=chart(),n=c.seats[i],locked=c.locks[i],blocked=c.blocked[i];return '<div class="seat '+(!n?'empty ':'')+(n?'occupied ':'')+(locked?'locked ':'')+(blocked?'blocked':'')+'" data-seat="'+i+'" draggable="'+(!locked&&!!n)+'" tabindex="0" title="'+(n?escapeHtml(n):'Empty desk')+'"><div class="chair"></div><div class="desktop"><span class="student-name">'+(blocked?'✕':n?escapeHtml(n):'')+'</span></div><button type="button" class="seat-lock" draggable="false" data-lock-seat="'+i+'" aria-label="'+(locked?'Unlock ':'Lock ')+escapeHtml(n||'empty seat')+'" title="'+(locked?'Unlock student':'Lock student')+'">'+(locked?'🔒':'🔓')+'</button></div>'}
function render(){normalize();const c=chart();$('extraToggle').checked=c.extra;$('extra').classList.toggle('hidden',!c.extra);$('seats').innerHTML=Array.from({length:30},(_,i)=>seatMarkup(i)).join('');$('extra').innerHTML=seatMarkup(30)+seatMarkup(31);bindSeats()}
function swap(from,to){const c=chart();if(from===to||from<0||to<0||c.locks[from]||c.locks[to]||c.blocked[from]||c.blocked[to]||(to>=30&&!c.extra))return;[c.seats[from],c.seats[to]]=[c.seats[to],c.seats[from]];save();render()}
function toggleLock(i){const c=chart();if(!c.seats[i]||c.blocked[i])return;c.locks[i]=!c.locks[i];dragSource=null;save();render()}
function bindSeats(){
document.querySelectorAll('.seat').forEach(el=>{
const i=Number(el.dataset.seat);
el.addEventListener('dragstart',e=>{
if(chart().locks[i]||chart().blocked[i]||!chart().seats[i]){e.preventDefault();return}
dragSource=i;
e.dataTransfer.setData('text/plain',String(i));
e.dataTransfer.effectAllowed='move';
el.classList.add('dragging');
});
el.addEventListener('dragover',e=>{if(chart().blocked[i]||chart().locks[i])return;e.preventDefault();e.dataTransfer.dropEffect='move';el.classList.add('drag-over')});
el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
el.addEventListener('drop',e=>{
e.preventDefault();el.classList.remove('drag-over');

const raw=e.dataTransfer.getData('text/plain');
const from=raw===''?dragSource:Number(raw);
if(from!==null&&Number.isInteger(from)){swap(from,i);suppressClickUntil=Date.now()+350}
dragSource=null;
});
el.addEventListener('dragend',()=>{el.classList.remove('dragging');dragSource=null;suppressClickUntil=Date.now()+350});
el.addEventListener('click',()=>{
if(Date.now()<suppressClickUntil)return;
if(dragSource!==null){swap(dragSource,i);dragSource=null;return}
if(!chart().seats[i]){const c=chart();c.blocked[i]=!c.blocked[i];save();render();return}
if(!chart().locks[i]&&!chart().blocked[i]){dragSource=i;el.style.outline='3px solid #23844c'}
});
el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}});
});
document.querySelectorAll('[data-lock-seat]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggleLock(Number(b.dataset.lockSeat))}));
}
function shuffle(){normalize();const c=chart(),people=present(),lockedNames=new Set(c.seats.filter((n,i)=>c.locks[i]&&n));const pool=people.filter(n=>!lockedNames.has(n));const capacity=c.seats.filter((n,i)=>!c.blocked[i]&&(i<30||c.extra)).length;if(people.length>capacity){alert('Not enough available desks for '+people.length+' students. Click a blocked desk to make it available.');return}for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}let k=0;for(let i=0;i<32;i++){if(!c.locks[i])c.seats[i]=(c.blocked[i]||(i>=30&&!c.extra))?null:(pool[k++]||null)}save();render()}
function attendance(){syncRosters();const a=absent();$('attendanceList').innerHTML=roster().map(n=>'<button class="'+(a.has(n)?'absent':'')+'" data-name="'+escapeHtml(n)+'" aria-pressed="'+a.has(n)+'">'+escapeHtml(n)+'</button>').join('');$('attendanceList').querySelectorAll('button').forEach(b=>b.onclick=()=>{const a=absent(),n=b.dataset.name;a.has(n)?a.delete(n):a.add(n);groupData.absent[selected]=[...a];groupData.groups=[];saveAttendance();attendance()});$('modalBackdrop').classList.remove('hidden')}
$('classSelect').onchange=e=>{selected=e.target.value;save();render()};$('shuffleBtn').onclick=$('fsShuffle').onclick=shuffle;$('attendanceBtn').onclick=attendance;$('attendanceDone').onclick=()=>{$('modalBackdrop').classList.add('hidden');render()};$('allPresent').onclick=()=>{groupData.absent[selected]=[];groupData.groups=[];saveAttendance();attendance()};
$('viewBtn').onclick=()=>{teacher=!teacher;$('chart').classList.toggle('teacher',teacher);$('viewBtn').textContent=teacher?'Student View':'Teacher View'};
$('settingsBtn').onclick=()=>{const hidden=$('settingsMenu').classList.toggle('hidden');$('settingsBtn').setAttribute('aria-expanded',String(!hidden))};document.addEventListener('click',e=>{if(!e.target.closest('.settings'))$('settingsMenu').classList.add('hidden')});
$('extraToggle').onchange=e=>{const c=chart();if(!e.target.checked&&(c.seats[30]||c.seats[31])){alert('Move students from the extra desks before hiding them.');e.target.checked=true;return}c.extra=e.target.checked;save();render()};
$('unlockBtn').onclick=()=>{chart().locks.fill(false);save();render()};$('clearBtn').onclick=()=>{if(confirm('Clear all students from the desks for this class? Blocked desks will stay blocked.')){chart().seats.fill(null);chart().locks.fill(false);save();render()}};$('printBtn').onclick=()=>window.print();$('resetBtn').onclick=()=>{if(confirm('Clear all seat assignments for this class? Blocked desks will stay blocked.')){chart().seats.fill(null);chart().locks.fill(false);save();render()}};
function fullscreen(on){$('app').classList.toggle('full',on);if(on)document.documentElement.requestFullscreen?.().catch(()=>{});else if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{})}$('fullBtn').onclick=()=>fullscreen(true);$('fsExit').onclick=()=>fullscreen(false);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)$('app').classList.remove('full')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){dragSource=null;$('modalBackdrop').classList.add('hidden');render()}});window.addEventListener('storage',e=>{if(e.key===KEY){renderSelect();render()}});
renderSelect();render();
