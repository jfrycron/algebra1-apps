<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Identity Property of Multiplication</title>
<style>
:root{--ink:#172033;--muted:#667085;--line:#d9dee8;--panel:#fff;--bg:#f4f7fb;--good:#137a45;--bad:#9b1c1c;--blue:#2457c5}
*{box-sizing:border-box}body{margin:0;font-family:Geist,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(900px,96vw);background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 50px #1d29391a;padding:28px 34px;min-height:610px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.pills{display:flex;gap:7px}.pill{width:34px;height:9px;border-radius:999px;background:#e5e9f0}.pill.on{background:#6179aa}
h1{font-size:34px;margin:12px 0 8px}.lead{font-size:18px;color:var(--muted);margin:0 0 26px}.stack{display:grid;gap:15px;margin-top:18px;margin-bottom:72px}
.q{border:1px solid var(--line);border-radius:16px;padding:18px 20px;font-size:26px;display:flex;align-items:center;gap:12px;min-height:76px;transition:.25s}.q.locked{display:none}.q.done{border-color:#b8dbc8;background:#f5fbf7}
input{font:inherit;width:95px;border:0;border-bottom:3px solid #8390a8;outline:none;text-align:center;background:transparent}.q.done input{color:var(--good);border-color:var(--good)}
button{font:inherit}.check{border:0;background:var(--blue);color:white;padding:11px 17px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}.feedback{font-size:15px;font-weight:700;margin-left:auto}.good{color:var(--good)}.bad{color:var(--bad)}
.shake{animation:shake .28s}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.next{position:absolute;right:34px;bottom:28px;border:0;background:#172033;color:#fff;border-radius:999px;padding:12px 21px;font-weight:750;cursor:pointer}.next[hidden]{display:none}
.reveal{margin:34px auto 0;max-width:650px;text-align:center;border:2px solid #cad4e6;border-radius:20px;padding:30px}.reveal h2{font-size:31px;margin:0 0 16px}.reveal .rule{font-size:24px;font-weight:750;line-height:1.45}.reveal .example{font-size:31px;margin-top:22px}
.mc{display:grid;gap:12px;margin-top:22px;margin-bottom:72px}.choice{width:100%;text-align:left;padding:16px 18px;border:1px solid var(--line);background:white;border-radius:14px;cursor:pointer;font-size:18px}.choice:hover{border-color:#91a4c8}.choice.correct{border-color:#78bd98;background:#f2fbf6}.choice.wrong{border-color:#c98888;background:#fff5f5}.prompt{font-size:24px;font-weight:750;margin-top:26px}
.finish{text-align:center;padding:70px 20px}.finish h2{font-size:38px;margin:0 0 12px}.finish p{font-size:20px;color:var(--muted)}
@media(max-width:650px){.app{padding:22px;min-height:640px}.q{font-size:21px;flex-wrap:wrap}.next{right:22px}h1{font-size:29px}}
</style></head>
<body><div class="shell"><main class="app" id="app"></main></div>
<script>
const pages=[
{type:"fill",title:"What happens when we multiply by 1?",lead:"Fill in each blank. A new question will appear after each correct answer.",qs:[["8 × 1 =","8"],["1 × 14 =","14"],["23 × 1 =","23"],["1 × 37 =","37"]]},
{type:"fill",title:"Keep looking for the pattern.",lead:"Fill in each blank.",qs:[["___ × 1 = 16","16","left"],["1 × ___ = 29","29","mid"],["-6 × 1 =","-6"],["1 × (-11) =","-11"]]},
{type:"reveal"},
{type:"fill",title:"Use the property.",lead:"Fill in each blank.",qs:[["34 × 1 =","34"],["___ × 1 = 71","71","left"],["1 × ___ = -18","-18","mid"],["105 × 1 =","105"]]},
{type:"mc",title:"Identify the property.",prompt:"Which equation demonstrates the Identity Property of Multiplication?",choices:[["7 + 0 = 7",0],["7 × 1 = 7",1],["7 × 3 = 3 × 7",0],["7 × (3 + 2) = 21 + 14",0]]},
{type:"fill",title:"More practice.",lead:"Fill in each blank.",qs:[["1 × 48 =","48"],["92 × 1 =","92"],["___ × 1 = -25","-25","left"],["1 × ___ = 63","63","mid"]]},
{type:"mc",title:"Identify the property.",prompt:"Which equation demonstrates the Identity Property of Multiplication?",choices:[["4 × (6 × 2) = (4 × 6) × 2",0],["9 + 0 = 9",0],["12 × 1 = 12",1],["5 × 8 = 8 × 5",0]]},
{type:"mc",title:"One more.",prompt:"Which equation demonstrates the Identity Property of Multiplication?",choices:[["3 × (4 + 2) = 12 + 6",0],["1 × (-15) = -15",1],["6 + 4 = 4 + 6",0],["2 × (3 × 5) = (2 × 3) × 5",0]]},
{type:"finish"}];
let page=0;const app=document.getElementById("app");
function chrome(title){return '<div class="top"><div class="eyebrow">Identity Property of Multiplication</div><div class="pills">'+pages.map((_,i)=>'<span class="pill '+(i===page?'on':'')+'"></span>').join('')+'</div></div>'+(title?'<h1>'+title+'</h1>':'')}
function render(){const p=pages[page];
if(p.type==="fill"){app.innerHTML=chrome(p.title)+'<p class="lead">'+p.lead+'</p><div class="stack" id="stack"></div><button class="next" id="next" hidden>Next →</button>';const stack=document.getElementById("stack");p.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q "+(i?"locked":"");let display=q[0];if(q[2]==="left"||q[2]==="mid")display=display.replace("___",'<input inputmode="numeric" aria-label="answer">');else display+=' <input inputmode="numeric" aria-label="answer">';d.innerHTML='<span>'+display+'</span><button class="check">Check</button><span class="feedback"></span>';stack.appendChild(d)});wireFill(p)}
else if(p.type==="reveal"){app.innerHTML=chrome("")+'<div class="reveal"><h2>Identity Property of Multiplication</h2><div class="rule">When a number is multiplied by 1,<br>its value stays the same.</div><div class="example">a × 1 = a &nbsp;&nbsp; and &nbsp;&nbsp; 1 × a = a</div></div><button class="next" id="next">Practice It →</button>';document.getElementById("next").onclick=advance}
else if(p.type==="mc"){app.innerHTML=chrome(p.title)+'<div class="prompt">'+p.prompt+'</div><div class="mc">'+p.choices.map((c,i)=>'<button class="choice" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+c[0]+'</button>').join('')+'</div><div id="mcfb" class="lead" style="margin-top:18px"></div><button class="next" id="next" hidden>Next →</button>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>checkMC(b,p))}
else app.innerHTML=chrome("")+'<div class="finish"><h2>Nice work!</h2><p>You used and identified the Identity Property of Multiplication.</p><div style="font-size:34px;font-weight:800;margin-top:28px">a × 1 = a</div></div>'}
function wireFill(p){const qs=[...document.querySelectorAll(".q")];qs.forEach((d,i)=>{const input=d.querySelector("input"),btn=d.querySelector(".check");const check=()=>{if(input.value.trim()===p.qs[i][1]){d.classList.add("done");btn.remove();input.disabled=true;d.querySelector(".feedback").innerHTML='<span class="good">Correct ✓</span>';if(i<qs.length-1){qs[i+1].classList.remove("locked");setTimeout(()=>qs[i+1].querySelector("input").focus(),80)}else document.getElementById("next").hidden=false}else{d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");d.querySelector(".feedback").innerHTML='<span class="bad">Try again</span>';input.select()}};btn.onclick=check;input.addEventListener("keydown",e=>{if(e.key==="Enter")check()})});qs[0].querySelector("input").focus();document.getElementById("next").onclick=advance}
function checkMC(b,p){if(b.classList.contains("correct"))return;document.querySelectorAll(".choice").forEach(x=>x.classList.remove("wrong"));const good=p.choices[+b.dataset.i][1]===1;if(good){b.classList.add("correct");document.querySelectorAll(".choice").forEach(x=>x.disabled=true);document.getElementById("mcfb").innerHTML='<span class="good">Correct! That is the Identity Property of Multiplication.</span>';document.getElementById("next").hidden=false}else{b.classList.add("wrong");document.getElementById("mcfb").innerHTML='<span class="bad">Not quite. Look for an equation where multiplying by 1 leaves the value unchanged.</span>'}}
function advance(){page++;render()}render();
</script></body></html>
