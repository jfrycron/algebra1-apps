<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Identity Property of Multiplication</title>
<style>
:root{--ink:#172033;--muted:#667085;--page:#f5f7fb;--blue:#2474e5;--blue-dark:#1459b9;--green:#15805f;--line:#d7dce7}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--page);color:var(--ink);font-family:Geist,"Segoe UI",Arial,sans-serif}button,input{font:inherit}
.app-shell{width:min(1360px,calc(100% - 24px));margin:auto;padding:8px 0 14px}
.app-header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;min-height:78px}
.app-header h1{margin:0;font-size:clamp(24px,2.35vw,34px);line-height:1.05;font-weight:900;letter-spacing:-.035em}.title-group p{margin:8px 0 6px;color:var(--muted);font-size:.93rem}.header-slot{display:flex;justify-content:flex-end;align-items:center}
.pills{display:flex;gap:4px;background:#eef2f7;border-radius:999px;padding:4px}.pill{width:28px;height:12px;border:0;border-radius:999px;background:#d5dbe5;padding:0;cursor:pointer}.pill:hover:not(:disabled){background:#9fb8e8}.pill.on{background:var(--blue)}.pill:disabled{opacity:.45;cursor:not-allowed}
.workspace{position:relative;border:2px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 8px 24px #1018281a;height:calc(100vh - 100px);min-height:590px;max-height:790px;overflow:hidden;padding:18px 22px 24px}
.workspace h1{text-align:center;font-size:clamp(30px,3vw,42px);margin:28px 0 8px;font-weight:900;letter-spacing:-.035em}.lead{text-align:center;font-size:1.05rem;color:#475467;margin:0 0 22px}
.stack{display:grid;gap:12px;margin:18px auto 72px;max-width:760px}.q{border:2px solid #d8dfe9;border-radius:16px;padding:15px 18px;font-size:clamp(22px,2.5vw,30px);display:flex;align-items:center;gap:12px;min-height:70px;transition:.25s}.q.locked{display:none}.q.done{border-color:#b8dbc8;background:#f5fbf7}
input{width:95px;height:48px;border:2px solid #a9b4c5;border-radius:10px;outline-color:var(--blue);text-align:center;font-size:1.25rem;font-weight:800}.q.done input{color:var(--green);border-color:var(--green)}
.check,.next{border:0;border-radius:12px;background:var(--blue);color:#fff;padding:12px 22px;font-weight:850;cursor:pointer;box-shadow:0 3px 0 var(--blue-dark)}.feedback{font-size:15px;font-weight:700;margin-left:auto}.good{color:var(--green)}.bad{color:#a92335}
.shake{animation:workspaceShake .26s linear 1}@keyframes workspaceShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.next{position:absolute;right:22px;bottom:24px}.next[hidden]{display:none}.back{position:absolute;left:22px;bottom:24px;border:1px solid #cbd2de;background:#eef1f6;color:#344054;border-radius:12px;padding:11px 18px;font-weight:800;cursor:pointer}
.reveal{margin:70px auto 0;max-width:700px;text-align:center;border-radius:18px;background:#f8fafc;padding:38px}.reveal h2{font-size:clamp(30px,3vw,42px);margin:0 0 18px;font-weight:900}.reveal .rule{font-size:24px;font-weight:750;line-height:1.45}.reveal .example{font-size:32px;margin-top:24px;font-weight:850}
.prompt{text-align:center;font-size:clamp(24px,2.6vw,34px);font-weight:850;margin:46px auto 22px;max-width:800px}.mc{display:grid;gap:12px;margin:0 auto 72px;max-width:760px}.choice{width:100%;text-align:left;padding:15px 18px;border:2px solid #d8dfe9;background:white;border-radius:14px;cursor:pointer;font-size:18px;font-weight:700}.choice:hover{border-color:#91a4c8}.choice.correct{border-color:#78bd98;background:#f2fbf6}.choice.wrong{border-color:#a92335;background:#fff5f5}
.finish{text-align:center;padding:120px 20px}.finish h2{font-size:42px;margin:0 0 12px}.finish p{font-size:20px;color:var(--muted)}body.success{background:#bdf1d6}
@media(max-width:700px){.app-header{grid-template-columns:1fr auto}.workspace{min-height:600px;height:calc(100dvh - 100px);padding:12px}.pill{width:18px}.q{font-size:21px;flex-wrap:wrap}.next{right:12px}.back{left:12px}}
</style></head>
<body><main class="app-shell"><header class="app-header"><div class="title-group"><h1>Identity Property of Multiplication</h1><p id="subtitle">Discover what happens when a number is multiplied by 1.</p></div><div class="header-slot" id="nav-slot"></div></header><section class="workspace" id="app"></section></main>
<script>
const pages=[
{type:"fill",title:"What happens when we multiply by 1?",lead:"Fill in each blank. A new question will appear after each correct answer.",qs:[["8 × 1 =","8"],["1 × 14 =","14"],["23 × 1 =","23"],["1 × 37 =","37"]]},
{type:"fill",title:"Keep looking for the pattern.",lead:"Fill in each blank.",qs:[["___ × 1 = 16","16","left"],["1 × ___ = 29","29","mid"],["−6 × 1 =","-6"],["1 × (−11) =","-11"]]},
{type:"reveal"},
{type:"fill",title:"Use the property.",lead:"Fill in each blank.",qs:[["34 × 1 =","34"],["___ × 1 = 71","71","left"],["1 × ___ = −18","-18","mid"],["105 × 1 =","105"]]},
{type:"mc",title:"Identify the property.",prompt:"Which equation demonstrates the Identity Property of Multiplication?",choices:[["7 + 0 = 7",0],["7 × 1 = 7",1],["7 × 3 = 3 × 7",0],["7 × (3 + 2) = 21 + 14",0]]},
{type:"mc",title:"Identify the property.",prompt:"Which equation demonstrates the Identity Property of Multiplication?",choices:[["4 × (6 × 2) = (4 × 6) × 2",0],["9 + 0 = 9",0],["12 × 1 = 12",1],["5 × 8 = 8 × 5",0]]},
{type:"mc",title:"Identify the property.",prompt:"Which equation demonstrates the Identity Property of Multiplication?",choices:[["3 × (4 + 2) = 12 + 6",0],["1 × (−15) = −15",1],["6 + 4 = 4 + 6",0],["2 × (3 × 5) = (2 × 3) × 5",0]]},
{type:"mc",title:"Identify the property.",prompt:"Which equation demonstrates the Identity Property of Multiplication?",choices:[["18 × 1 = 18",1],["8 + 0 = 8",0],["2 × 9 = 9 × 2",0],["5 × (2 + 4) = 10 + 20",0]]},
{type:"finish"}];
const params=new URLSearchParams(location.search);let page=Math.max(0,Math.min(pages.length-1,(parseInt(params.get("page")||"1",10)||1)-1));let maxUnlocked=page;const app=document.getElementById("app");
function chrome(title){document.getElementById("nav-slot").innerHTML='<div class="pills" aria-label="Page navigation">'+pages.map((_,i)=>'<button class="pill '+(i===page?'on':'')+'" type="button" aria-label="Go to page '+(i+1)+'" onclick="goToPage('+i+')" '+(i>maxUnlocked?'disabled':'')+'></button>').join('')+'</div>';return (title?'<h1>'+title+'</h1>':'')+(page>0?'<button class="back" type="button" onclick="back()">← Back</button>':'')}
function goToPage(i){if(i>=0&&i<=maxUnlocked&&i<pages.length){document.body.classList.remove("success");page=i;render()}}
function render(){const p=pages[page];
if(p.type==="fill"){app.innerHTML=chrome(p.title)+'<p class="lead">'+p.lead+'</p><div class="stack" id="stack"></div><button class="next" id="next" hidden>Next →</button>';const stack=document.getElementById("stack");p.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q "+(i?"locked":"");let display=q[0];if(q[2]==="left"||q[2]==="mid")display=display.replace("___",'<input inputmode="numeric" aria-label="answer">');else display+=' <input inputmode="numeric" aria-label="answer">';d.innerHTML='<span>'+display+'</span><button class="check">Check</button><span class="feedback"></span>';stack.appendChild(d)});wireFill(p)}
else if(p.type==="reveal"){app.innerHTML=chrome("")+'<div class="reveal"><h2>Identity Property of Multiplication</h2><div class="rule">When a number is multiplied by 1,<br>its value stays the same.</div><div class="example">a × 1 = a &nbsp;&nbsp; and &nbsp;&nbsp; 1 × a = a</div></div><button class="next" id="next">Practice It →</button>';document.getElementById("next").onclick=advance}
else if(p.type==="mc"){app.innerHTML=chrome(p.title)+'<div class="prompt">'+p.prompt+'</div><div class="mc">'+p.choices.map((c,i)=>'<button class="choice" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+c[0]+'</button>').join('')+'</div><div id="mcfb" class="lead" style="margin-top:18px"></div><button class="next" id="next" type="button" onclick="advance()" hidden>Next →</button>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>checkMC(b,p))}
else app.innerHTML=chrome("")+'<div class="finish"><h2>Nice work!</h2><p>You used and identified the Identity Property of Multiplication.</p><div style="font-size:34px;font-weight:800;margin-top:28px">a × 1 = a</div></div>'}
function wireFill(p){const qs=[...document.querySelectorAll(".q")];qs.forEach((d,i)=>{const input=d.querySelector("input"),btn=d.querySelector(".check");const check=()=>{if(input.value.trim()===p.qs[i][1]){d.classList.add("done");btn.remove();input.disabled=true;d.querySelector(".feedback").innerHTML='<span class="good">Correct ✓</span>';if(i<qs.length-1){qs[i+1].classList.remove("locked");setTimeout(()=>qs[i+1].querySelector("input").focus(),80)}else document.getElementById("next").hidden=false;document.body.classList.add("success")}else{d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");d.querySelector(".feedback").innerHTML='<span class="bad">Try again</span>';input.select()}};btn.onclick=check;input.addEventListener("keydown",e=>{if(e.key==="Enter")check()})});qs[0].querySelector("input").focus();document.getElementById("next").onclick=advance}
function checkMC(b,p){if(b.classList.contains("correct"))return;document.querySelectorAll(".choice").forEach(x=>x.classList.remove("wrong"));const good=p.choices[+b.dataset.i][1]===1;if(good){b.classList.add("correct");document.querySelectorAll(".choice").forEach(x=>x.disabled=true);document.getElementById("mcfb").innerHTML='<span class="good">Correct! That is the Identity Property of Multiplication.</span>';document.getElementById("next").hidden=false;document.body.classList.add("success")}else{b.classList.add("wrong");document.getElementById("mcfb").innerHTML='<span class="bad">Not quite. Look for an equation where multiplying by 1 leaves the value unchanged.</span>'}}
function advance(){if(page<pages.length-1){maxUnlocked=Math.max(maxUnlocked,page+1);document.body.classList.remove("success");page++;render()}}
function back(){if(page>0){document.body.classList.remove("success");page--;render()}}
document.addEventListener("keydown",e=>{if(e.key==="Enter"){const n=document.getElementById("next");if(n&&!n.hidden){e.preventDefault();advance()}}});
render();
</script></body></html>
