<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graphing a Linear Equation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eef2;font-family:Arial,Helvetica,sans-serif;color:#182a3b;transition:background .25s}body.correct{background:#26b765}main{max-width:1050px;margin:24px auto;padding:0 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(23px,3vw,34px);margin:8px 0 20px}.pill{border-radius:25px;padding:10px 17px;background:white;border:1px solid #cdd7df;font-weight:700}.panel{background:white;border:1px solid #d8e0e8;border-radius:22px;padding:24px;box-shadow:0 6px 25px #1b2c3b0b}.layout{display:grid;grid-template-columns:1fr 1.4fr;gap:22px}.equation{font-size:clamp(30px,4vw,48px);font-weight:700;text-align:center;margin:22px 0}.equation sup{font-size:60%}.prompt{text-align:center;color:#586778;line-height:1.5;min-height:50px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}button{background:#1b5d93;color:white;border:0;border-radius:25px;padding:13px 21px;font-size:16px;font-weight:700;cursor:pointer}button.secondary{background:#edf2f6;color:#28445c}button:disabled{opacity:.4;cursor:default}.graphWrap{width:100%;max-width:570px;margin:auto;touch-action:none}svg{width:100%;display:block;cursor:crosshair;user-select:none}.feedback{min-height:52px;text-align:center;font-weight:700;font-size:19px;padding-top:16px}.feedback.good{color:#078345}.feedback.bad{color:#bd3838}.small{font-size:14px;color:#677789;text-align:center}.rise{stroke:#e59c20;stroke-width:4;stroke-dasharray:7 5;fill:none}.graphline{stroke:#267bd3;stroke-width:3.5;fill:none}.point{fill:#267bd3;stroke:white;stroke-width:2}.preview{stroke:#267bd3;stroke-width:3;opacity:.7;stroke-dasharray:8 5}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{padding:15px}main{margin:10px auto}.equation{margin:12px 0}h1{margin-bottom:10px}}
</style></head><body><main><header><h1>Graphing a Linear Equation</h1><span class="pill" id="count">1</span></header><div class="layout"><section class="panel"><div class="small">Graph the equation</div><div class="equation" id="equation"></div><div class="prompt" id="prompt">Click the y-intercept to place your first point.</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="secondary" id="reset">Try Again</button><button id="next" disabled>Correct — Next Problem</button></div></section><section class="panel"><div class="graphWrap"><svg id="graph" viewBox="0 0 520 520" role="img" aria-label="Interactive coordinate plane. Click the y-intercept, then a second lattice point."></svg></div></section></div></main>
<script>
const svg=document.getElementById('graph'), eq=document.getElementById('equation'), prompt=document.getElementById('prompt'),feedback=document.getElementById('feedback'),next=document.getElementById('next'),count=document.getElementById('count');
const NS='http://www.w3.org/2000/svg',O=260,S=23,MIN=-10,MAX=10;
let first=null,second=null,hover=null,problem=null,index=0,done=false,previous='';
function el(tag,attrs={},parent=svg){let e=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}
function coord(p){return [O+p.x*S,O-p.y*S]}
function format(m,b){let slope=m.n===0?'0':m.d===1?(Math.abs(m.n)===1?'':String(Math.abs(m.n))):Math.abs(m.n)+'/'+m.d;let sign=m.n<0?'−':'';let term=m.n===0?'':sign+slope+'x';if(m.n===0)return 'y = '+b;if(b===0)return 'y = '+term;return 'y = '+(term?term+(b<0?' − ':' + '):'')+Math.abs(b)*(term?1:Math.sign(b)||1)}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}
function generate(){let opts=[{n:0,d:1},{n:1,d:1},{n:-1,d:1},{n:2,d:1},{n:-2,d:1},{n:3,d:1},{n:-3,d:1},{n:1,d:2},{n:-1,d:2},{n:2,d:3},{n:-2,d:3},{n:3,d:2},{n:-3,d:2},{n:1,d:3},{n:-1,d:3},{n:3,d:4},{n:-3,d:4}];let choices=[];for(let m of opts)for(let b=-5;b<=5;b++){let ys=[b+m.n/m.d*(-m.d),b+m.n/m.d*m.d];if(ys.some(y=>y>=MIN&&y<=MAX))choices.push({m,b})}let p;do{p=choices[Math.floor(Math.random()*choices.length)]}while(choices.length>1&&format(p.m,p.b)===previous);previous=format(p.m,p.b);return p}
function lineThrough(a,b){let dx=b.x-a.x,dy=b.y-a.y;if(dx===0)return null;let ya=a.y+(MIN-a.x)*dy/dx,yb=a.y+(MAX-a.x)*dy/dx;return {a:{x:MIN,y:ya},b:{x:MAX,y:yb}}}
function render(){svg.replaceChildren();el('rect',{x:0,y:0,width:520,height:520,fill:'#fff'});for(let i=MIN;i<=MAX;i++){let v=O+i*S;el('line',{x1:v,y1:30,x2:v,y2:490,stroke:i===0?'#34485a':'#e2e9ef','stroke-width':i===0?2:1});el('line',{x1:30,y1:v,x2:490,y2:v,stroke:i===0?'#34485a':'#e2e9ef','stroke-width':i===0?2:1});if(i!==0){let tx=el('text',{x:v,y:O+16,'text-anchor':'middle','font-size':11,fill:'#526476'});tx.textContent=i;let ty=el('text',{x:O-9,y:O-v+4,'text-anchor':'end','font-size':11,fill:'#526476'});ty.textContent=i}}let xlab=el('text',{x:493,y:O-9,'font-size':16,fill:'#34485a'});xlab.textContent='x';let ylab=el('text',{x:O+10,y:22,'font-size':16,fill:'#34485a'});ylab.textContent='y';
if(first){let b=second||hover;if(b&&(b.x!==first.x||b.y!==first.y)){let l=lineThrough(first,b);if(l){let [x1,y1]=coord(l.a),[x2,y2]=coord(l.b);let clip=el('defs');let cp=el('clipPath',{id:'clipplot'},clip);el('rect',{x:30,y:30,width:460,height:460},cp);el('line',{x1,y1,x2,y2,class:second?'graphline':'preview','clip-path':'url(#clipplot)'})}}}
if(second){let corner={x:second.x,y:first.y},[a,b]=coord(first),[c,d]=coord(corner),[e,f]=coord(second);el('path',{d:'M'+a+' '+b+' L'+c+' '+d+' L'+e+' '+f,class:'rise'});let tx=el('text',{x:(a+c)/2,y:b+((first.y<0)?-9:17),'text-anchor':'middle','font-size':15,'font-weight':700,fill:'#b57611'});tx.textContent='run '+(second.x-first.x);let ty=el('text',{x:e+9,y:(d+f)/2,'font-size':15,'font-weight':700,fill:'#b57611'});ty.textContent='rise '+(second.y-first.y)}
if(first){let [x,y]=coord(first);el('circle',{cx:x,cy:y,r:7,class:'point'})}if(second){let [x,y]=coord(second);el('circle',{cx:x,cy:y,r:7,class:'point'})}}
function pointFromEvent(e){let r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*520/r.width,y=(e.clientY-r.top)*520/r.height;return {x:Math.max(MIN,Math.min(MAX,Math.round((x-O)/S))),y:Math.max(MIN,Math.min(MAX,Math.round((O-y)/S)))}}
function clear(){first=second=hover=null;done=false;next.disabled=true;document.body.classList.remove('correct');feedback.textContent='';feedback.className='feedback';prompt.textContent='Click the y-intercept to place your first point.';render()}
function newProblem(){problem=generate();index++;count.textContent=index;eq.textContent=format(problem.m,problem.b);clear()}
svg.addEventListener('pointermove',e=>{if(first&&!second&&!done){hover=pointFromEvent(e);render()}});
svg.addEventListener('pointerleave',()=>{if(!second){hover=null;render()}});
svg.addEventListener('click',e=>{if(done||second)return;let p=pointFromEvent(e);if(!first){first=p;prompt.textContent='Move the cursor and click a second point.';feedback.textContent='';render();return}if(p.x===first.x&&p.y===first.y)return;second=p;hover=null;render();let good=first.x===0&&first.y===problem.b&&(second.y-first.y)*problem.m.d===(second.x-first.x)*problem.m.n;if(good){done=true;document.body.classList.add('correct');feedback.className='feedback good';feedback.textContent='Correct!';prompt.textContent='';next.disabled=false}else{feedback.className='feedback bad';feedback.textContent=first.x!==0||first.y!==problem.b?'Check your y-intercept.':'Check your slope.';prompt.textContent='Study the rise and run, then try again.';setTimeout(()=>{if(!done&&second===p){second=null;hover=null;render()}},1400)}});
document.getElementById('reset').addEventListener('click',clear);next.addEventListener('click',newProblem);newProblem();
</script></body></html>
