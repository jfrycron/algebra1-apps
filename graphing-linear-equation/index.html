<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graphing a Linear Equation</title>
<style>
@font-face{font-family:Geist;src:url('/algebra1-apps/write-linear-equation-from-graph/geist-latin.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#f5f7fb;color:#172033;font-family:Geist,'Segoe UI',Arial,sans-serif;transition:background .2s}body.correct{background:#24c75b}
main{width:min(1360px,calc(100% - 24px));height:100dvh;margin:auto;padding:8px 0 12px;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:78px;flex:none}
h1{letter-spacing:-.035em;font-size:clamp(23px,2.35vw,34px);font-weight:900;line-height:1.05;margin:0 0 8px}
.directions{color:#667085;font-size:clamp(13px,1.05vw,16px);margin:0}
.pill{border-radius:999px;padding:5px 7px;display:flex;gap:2px;background:#eef2f7;border:1px solid #d7dce7;flex-shrink:0}
.page{border:0;border-radius:50%;width:31px;height:31px;display:grid;place-items:center;background:transparent;color:#475467;font-weight:800;font-size:13px;cursor:pointer;padding:0}.page.active{background:#172033;color:#fff}.page:hover:not(.active){background:#dbe5f2}
.workspace{flex:1;min-height:0;background:white;border:2px solid #d7dce7;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px #1018281a}
.layout{height:100%;display:grid;grid-template-columns:minmax(210px,29%) minmax(0,71%);align-items:stretch}
.panel{min-width:0;background:white}.panel:first-child{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;border-right:1px solid #e4e9f1}
.panel:last-child{display:flex;align-items:center;justify-content:center;padding:5px}
.equation{font-size:clamp(29px,3.4vw,47px);font-weight:760;text-align:center;white-space:nowrap;line-height:1.3;padding:16px 8px;border:1.5px solid #cdd8e7;border-radius:16px;width:100%;max-width:340px;min-height:92px;display:flex;justify-content:center;align-items:center}
.frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;font-size:.8em;line-height:1.05;margin:0 .1em}.frac span:first-child{border-bottom:3.5px solid currentColor;padding:0 .12em .08em}.frac span:last-child{padding:.08em .12em 0}
.small{font-size:13px;color:#667085;text-align:center;margin-bottom:12px}.prompt{display:none}
.actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-top:20px}button.action{background:#172033;color:white;border:0;border-radius:10px;padding:12px 15px;font-size:15px;font-weight:800;cursor:pointer}button.secondary{background:#eef2f7;color:#172033}button:disabled{opacity:.35;cursor:default}
.graphWrap{height:100%;width:100%;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
svg{width:auto;height:auto;max-width:100%;max-height:min(calc(100dvh - 155px), 690px);aspect-ratio:1/1;display:block;cursor:crosshair;user-select:none}
.feedback{min-height:30px;text-align:center;font-weight:750;font-size:16px;padding-top:14px}.feedback.good{color:#15805f}.feedback.bad{color:#cf3f4f}
.graphline{stroke:#267bd3;stroke-width:3.5;fill:none}.preview{stroke:#267bd3;stroke-width:3;opacity:.65;stroke-dasharray:8 5}.point{fill:#267bd3;stroke:white;stroke-width:2}
@media(max-width:760px){header{min-height:68px}h1{font-size:22px}.directions{font-size:12px}.pill{gap:0;padding:3px}.page{width:23px;height:27px;font-size:11px}.layout{grid-template-columns:minmax(150px,33%) minmax(0,67%)}.panel:first-child{padding:7px}.equation{font-size:clamp(19px,4vw,30px);min-height:65px}.actions{margin-top:10px}button.action{font-size:12px;padding:9px 5px}}
</style></head><body><main><header><div><h1>Graphing a Linear Equation</h1><p class="directions">Graph the equation by selecting two points.</p></div><nav class="pill" id="count" aria-label="Problems 1 through 10"></nav></header><div class="workspace"><div class="layout"><section class="panel"><div class="small">Graph the equation</div><div class="equation" id="equation"></div><div class="prompt" id="prompt"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="action secondary" id="reset">Try Again</button><button class="action" id="next" disabled>Correct — Next Problem</button></div></section><section class="panel"><div class="graphWrap"><svg id="graph" viewBox="0 0 520 520" role="img" aria-label="Interactive coordinate plane"></svg></div></section></div></div></main>
<script>
const svg=document.getElementById('graph'), eq=document.getElementById('equation'), prompt=document.getElementById('prompt'),feedback=document.getElementById('feedback'),next=document.getElementById('next'),count=document.getElementById('count');
const NS='http://www.w3.org/2000/svg',O=260,S=23,MIN=-10,MAX=10;
let first=null,second=null,hover=null,problem=null,index=0,done=false,previous='';
function el(tag,attrs={},parent=svg){let e=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}
function coord(p){return [O+p.x*S,O-p.y*S]}
function format(m,b){let slope=m.n===0?'0':m.d===1?(Math.abs(m.n)===1?'':String(Math.abs(m.n))):Math.abs(m.n)+'/'+m.d;let sign=m.n<0?'−':'';let term=m.n===0?'':sign+slope+'x';if(m.n===0)return 'y = '+b;if(b===0)return 'y = '+term;return 'y = '+(term?term+(b<0?' − ':' + '):'')+Math.abs(b)*(term?1:Math.sign(b)||1)}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}
function generate(){let opts=[{n:0,d:1},{n:1,d:1},{n:-1,d:1},{n:2,d:1},{n:-2,d:1},{n:3,d:1},{n:-3,d:1},{n:1,d:2},{n:-1,d:2},{n:2,d:3},{n:-2,d:3},{n:3,d:2},{n:-3,d:2},{n:1,d:3},{n:-1,d:3},{n:3,d:4},{n:-3,d:4}];let choices=[];for(let m of opts)for(let b=-5;b<=5;b++){let ys=[b+m.n/m.d*(-m.d),b+m.n/m.d*m.d];if(ys.some(y=>y>=MIN&&y<=MAX))choices.push({m,b})}let p;do{p=choices[Math.floor(Math.random()*choices.length)]}while(choices.length>1&&format(p.m,p.b)===previous);previous=format(p.m,p.b);return p}
function equationHTML(m,b){let sign=m.n<0?'−':'';let n=Math.abs(m.n);let slope=m.n===0?'':m.d===1?(n===1?'':String(n)):'<span class="frac"><span>'+n+'</span><span>'+m.d+'</span></span>';let term=m.n===0?'':sign+slope+'x';if(m.n===0)return 'y = '+b;if(b===0)return 'y = '+term;return 'y = '+term+(b<0?' − ':' + ')+Math.abs(b)}function lineThrough(a,b){let dx=b.x-a.x,dy=b.y-a.y;if(dx===0)return null;let t=[];for(let x of [-9.65,9.65]){let k=(x-a.x)/dx,y=a.y+k*dy;if(y>=-9.65&&y<=9.65)t.push({k,x,y})}if(dy!==0)for(let y of [-9.65,9.65]){let k=(y-a.y)/dy,x=a.x+k*dx;if(x>=-9.65&&x<=9.65)t.push({k,x,y})}t.sort((u,v)=>u.k-v.k);return t.length>=2?{a:t[0],b:t[t.length-1]}:null}
function render(){svg.replaceChildren();el('rect',{x:0,y:0,width:520,height:520,fill:'#fff'});for(let i=MIN;i<=MAX;i++){let v=O+i*S;el('line',{x1:v,y1:30,x2:v,y2:490,stroke:i===0?'#34485a':'#e2e9ef','stroke-width':i===0?2:1});el('line',{x1:30,y1:v,x2:490,y2:v,stroke:i===0?'#34485a':'#e2e9ef','stroke-width':i===0?2:1});if(i!==0){let tx=el('text',{x:v,y:O+16,'text-anchor':'middle','font-size':11,fill:'#526476'});tx.textContent=i;let ty=el('text',{x:O-9,y:v+4,'text-anchor':'end','font-size':11,fill:'#526476'});ty.textContent=-i}}let xlab=el('text',{x:493,y:O-9,'font-size':16,fill:'#34485a'});xlab.textContent='x';let ylab=el('text',{x:O+10,y:22,'font-size':16,fill:'#34485a'});ylab.textContent='y';
let defs=el('defs');let marker=el('marker',{id:'arrowline',markerWidth:30,markerHeight:30,refX:20,refY:10,orient:'auto-start-reverse',markerUnits:'userSpaceOnUse'},defs);el('path',{d:'M0 0 L22 10 L0 20 Z',fill:'#267bd3'},marker);if(first){let b=second||hover;if(b&&(b.x!==first.x||b.y!==first.y)){let l=lineThrough(first,b);if(l){let [x1,y1]=coord(l.a),[x2,y2]=coord(l.b);let clip=el('defs');let cp=el('clipPath',{id:'clipplot'},clip);el('rect',{x:30,y:30,width:460,height:460},cp);el('line',{x1,y1,x2,y2,class:second?'graphline':'preview','clip-path':'url(#clipplot)'}) ;if(second){let dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;let size=24,half=12;for(let [px,py,dir] of [[x1,y1,-1],[x2,y2,1]]){let bx=px-dir*ux*size,by=py-dir*uy*size;el('path',{d:'M'+px+' '+py+' L'+(bx-uy*half)+' '+(by+ux*half)+' L'+(bx+uy*half)+' '+(by-ux*half)+' Z',fill:'#267bd3','clip-path':'url(#clipplot)'})}}}}}
if(first&&!second&&hover&&(hover.x!==first.x||hover.y!==first.y)){let [hx,hy]=coord(hover);el('circle',{cx:hx,cy:hy,r:8,fill:'#267bd3',opacity:.25,stroke:'#267bd3','stroke-width':2});el('circle',{cx:hx,cy:hy,r:3.5,fill:'#267bd3'})}if(first){let [x,y]=coord(first);el('circle',{cx:x,cy:y,r:7,class:'point'})}if(second){let [x,y]=coord(second);el('circle',{cx:x,cy:y,r:7,class:'point'})}}
function pointFromEvent(e){let r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*520/r.width,y=(e.clientY-r.top)*520/r.height;return {x:Math.max(MIN,Math.min(MAX,Math.round((x-O)/S))),y:Math.max(MIN,Math.min(MAX,Math.round((O-y)/S)))}}
function renderPages(){count.replaceChildren();for(let i=1;i<=10;i++){let btn=document.createElement('button');btn.className='page'+(i===index?' active':'');btn.textContent=i;btn.title='Problem '+i;btn.addEventListener('click',()=>{if(i===index)return;index=i-1;newProblem()});count.appendChild(btn)}}function clear(){first=second=hover=null;done=false;next.disabled=true;document.body.classList.remove('correct');feedback.textContent='';feedback.className='feedback';prompt.textContent='';render()}
function newProblem(){if(index>=10){return}document.getElementById('reset').textContent='Try Again';problem=generate();index++;renderPages();eq.innerHTML=equationHTML(problem.m,problem.b);clear()}
svg.addEventListener('pointermove',e=>{if(first&&!second&&!done){hover=pointFromEvent(e);render()}});
svg.addEventListener('pointerleave',()=>{if(!second){hover=null;render()}});
svg.addEventListener('click',e=>{if(done||second)return;let p=pointFromEvent(e);if(!first){first=p;prompt.textContent='';feedback.textContent='';render();return}if(p.x===first.x&&p.y===first.y)return;second=p;hover=null;render();let good=first.x===0&&first.y===problem.b&&(second.y-first.y)*problem.m.d===(second.x-first.x)*problem.m.n;if(good){done=true;document.body.classList.add('correct');feedback.className='feedback good';feedback.textContent='';prompt.textContent='';next.disabled=false;if(index===10){next.textContent='10 of 10 Complete';next.disabled=true;prompt.textContent='';document.getElementById('reset').textContent='New Round';}else{next.textContent='Correct — Next Problem'}}else{feedback.className='feedback bad';feedback.textContent=first.x!==0||first.y!==problem.b?'Check your y-intercept.':'Check your slope.';prompt.textContent='';setTimeout(()=>{if(!done&&second===p){second=null;hover=null;render()}},1400)}});
document.getElementById('reset').addEventListener('click',()=>{if(index===10&&done){index=0;next.textContent='Correct — Next Problem';newProblem()}else clear()});next.addEventListener('click',newProblem);newProblem();
</script></body></html>
