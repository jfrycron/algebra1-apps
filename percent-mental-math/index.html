<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mental Math: Percentages</title><style>:root{font-family:Inter,Geist,system-ui,sans-serif;color:#172332}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fb;display:block;transition:background .15s}body.correct{background:#19bd4f}body.wrong{background:repeating-linear-gradient(45deg,#f8fafc 0,#f8fafc 10px,#e4e7ec 10px,#e4e7ec 20px)}main{width:min(96vw,1180px);margin:10px auto;background:transparent;border-radius:0;padding:0;box-shadow:none}header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:10px}h1{font-size:clamp(22px,3vw,36px);margin:0;font-weight:900;letter-spacing:-.03em}.count{color:#475467;font-size:14px;font-weight:800;background:#eef2f7;border:1px solid #d7dce7;border-radius:12px;padding:9px 15px;display:inline-block}.workspaceTop{display:flex;justify-content:flex-end;margin-bottom:6px}nav{display:flex;gap:8px;margin:0 0 30px;justify-content:center;flex-wrap:wrap}nav button{flex:0 1 110px;border:1px solid #cbd5df;background:#fff;border-radius:999px;padding:12px 6px;font:inherit;font-weight:650;cursor:pointer}nav button.active{background:#18344d;color:white;border-color:#18344d}nav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin:6px 0 25px}nav button{min-width:0;padding:13px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:default}nav button.done{background:#e8f7ec;border-color:#a8d8b6;color:#166534}nav button.active{background:#e8f0ff;border:2px solid #2563eb;color:#1d4ed8}nav button.locked{background:#f4f5f7;color:#8a94a4;border-color:#e3e6ec}nav button small{font-size:10px;font-weight:650;white-space:nowrap}.stageProgress{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#475467;font-size:14px;font-weight:800;margin:10px auto;max-width:720px}.progressTrack{max-width:720px;height:9px;border-radius:99px;background:#e9edf3;margin:0 auto;overflow:hidden}#progressFill{height:100%;width:0;background:#2563eb;border-radius:99px;transition:width .2s} .problem{text-align:center;font-size:clamp(35px,8vw,64px);font-weight:800;letter-spacing:-1.5px;margin:48px 0 34px}.entry{display:flex;gap:10px;align-items:stretch;max-width:520px;margin:auto}.dollar{font-size:30px;align-self:center}input{min-width:0;width:100%;padding:15px 18px;border:2px solid #cbd5df;border-radius:14px;font:inherit;font-size:30px;outline:none}input:focus{border-color:#245b91}#submit{background:#193e5d;color:white;border:0;border-radius:14px;padding:0 25px;font:inherit;font-weight:750;font-size:18px;cursor:pointer}#message{min-height:58px;margin-top:22px;text-align:center;font-size:19px;font-weight:650} .workspace{background:#fff;border:2px solid #d7dce7;border-radius:16px;box-shadow:0 8px 24px rgba(16,24,40,.10);min-height:480px;padding:24px}@media(max-width:650px){nav{gap:3px}nav button{font-size:12px;padding:10px 1px}nav button small{font-size:9px}.stageProgress{font-size:12px}.workspace{padding:12px}}@media(max-width:500px){.entry{flex-wrap:wrap}#submit{height:52px;width:100%}nav{margin-bottom:28px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><header><h1>Mental Math: Percentages</h1></header><section class="workspace"><div class="workspaceTop"><span class="count" id="count">0 correct</span></div><nav id="stages" aria-label="Learning path"></nav><div class="stageProgress"><span id="stageLabel">10% Practice</span><span id="progressLabel">0 of 5 correct in a row</span></div><div class="progressTrack"><div id="progressFill"></div></div><div class="problem" id="problem"></div><form id="form" autocomplete="off"><div class="entry"><span class="dollar">$</span><input id="answer" inputmode="decimal" aria-label="Answer in dollars" placeholder="0.00" autocomplete="off"><button id="submit" type="submit">Check</button></div></form><div id="message" role="status" aria-live="polite"></div></section></main><script>
const $=id=>document.getElementById(id);
const stages=[
 {label:'10%',sub:'Start',options:[10]},
 {label:'1%',sub:'',options:[1]},
 {label:'Mixed',sub:'10 & 1',options:[10,1]},
 {label:'20%',sub:'',options:[20]},
 {label:'2%',sub:'',options:[2]},
 {label:'5%',sub:'',options:[5]},
 {label:'Mixed',sub:'All five',options:[10,1,20,2,5]}
];
let stage=0,streak=0,correct=0,percent=10,cents=0,phase='answer',last='',finalCount=0;
function money(c){return(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function random(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function amount(p){
 // Early stages: friendly amounts. Final mixed stage gradually increases difficulty.
 let level=stage===6?Math.min(4,1+Math.floor(finalCount/8)):1;
 let cents;
 if(level===1) cents=random(1,15)*1000; // $10-$150, multiples of $10
 else if(level===2) cents=random(11,249)*100;
 else if(level===3) cents=random(75,1250)*100;
 else {
  cents=random(50,5000)*10; // $5.00-$500.00 in dimes
  // Ensure every percentage yields an exact number of cents.
  const step=p===1?100:p===2?50:p===5?20:p===10?10:5;
  cents=Math.max(step,Math.round(cents/step)*step);
 }
 return cents;
}
function renderPath(){
 $('stages').innerHTML=stages.map((s,i)=>{
  const state=i<stage?'done':i===stage?'active':'locked';
  const symbol=i<stage?'✓':i===stage?'●':'🔒';
  return '<button type="button" class="'+state+'" aria-label="Stage '+(i+1)+': '+s.label+(i<stage?', completed':i===stage?', current':', locked')+'" aria-current="'+(i===stage?'step':'false')+'" disabled><span>'+symbol+' '+s.label+'</span><small>'+s.sub+'</small></button>';
 }).join('');
 $('stageLabel').textContent=stage===6?'Infinite Mixed Practice':stages[stage].label+' Practice';
 $('progressLabel').textContent=stage===6?finalCount+' mixed questions correct':streak+' of 5 correct in a row';
 $('progressFill').style.width=stage===6?'100%':(streak*20)+'%';
}
function next(){
 document.body.className='';phase='answer';
 $('submit').textContent='Check';$('message').textContent='';$('answer').value='';
 let candidate,tries=0;
 do{
  const options=stages[stage].options;
  percent=options[random(0,options.length-1)];
  cents=amount(percent);
  candidate=percent+':'+cents;
  tries++;
 }while(candidate===last&&tries<40);
 last=candidate;
 $('problem').textContent=percent+'% of $'+money(cents);
 renderPath();$('answer').focus();
}
function check(){
 if(phase==='correct'){
  if(stage<6&&streak===5){stage++;streak=0;}
  next();return;
 }
 const raw=$('answer').value.trim().replace(/[$,\s]/g,'');
 if(!/^\d+(\.\d{0,2})?$/.test(raw)){$('message').textContent='Enter a dollar amount.';return}
 const given=Math.round(Number(raw)*100),expected=cents*percent/100;
 if(given===expected){
  correct++;
  if(stage===6)finalCount++;else streak++;
  $('count').textContent=correct+' correct';
  document.body.className='correct';
  $('message').textContent=stage<6&&streak===5?'Stage complete! Press Next to continue.':'Correct!';
  $('submit').textContent='Next';phase='correct';renderPath();
 }else{
  if(stage<6)streak=0;
  document.body.className='wrong';$('message').textContent='Not quite. Try again.';
  $('answer').select();renderPath();
 }
}
$('form').addEventListener('submit',e=>{e.preventDefault();check()});
next();
</script></body></html>
