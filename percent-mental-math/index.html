<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mental Math: Percentages</title><style>:root{font-family:Inter,Geist,system-ui,sans-serif;color:#172332}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fb;display:block;transition:background .15s}body.correct{background:#19bd4f}body.wrong{background:repeating-linear-gradient(45deg,#f8fafc 0,#f8fafc 10px,#e4e7ec 10px,#e4e7ec 20px)}main{width:min(96vw,1180px);margin:10px auto;background:transparent;border-radius:0;padding:0;box-shadow:none}header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:10px}h1{font-size:clamp(22px,3vw,36px);margin:0;font-weight:900;letter-spacing:-.03em}.count{color:#657487;font-size:14px}nav{display:flex;gap:8px;margin:0 0 30px;justify-content:center}nav button{flex:0 1 110px;border:1px solid #cbd5df;background:#fff;border-radius:999px;padding:12px 6px;font:inherit;font-weight:650;cursor:pointer}nav button.active{background:#18344d;color:white;border-color:#18344d} .problem{text-align:center;font-size:clamp(35px,8vw,64px);font-weight:800;letter-spacing:-1.5px;margin:55px 0 34px}.entry{display:flex;gap:10px;align-items:stretch;max-width:520px;margin:auto}.dollar{font-size:30px;align-self:center}input{min-width:0;width:100%;padding:15px 18px;border:2px solid #cbd5df;border-radius:14px;font:inherit;font-size:30px;outline:none}input:focus{border-color:#245b91}#submit{background:#193e5d;color:white;border:0;border-radius:14px;padding:0 25px;font:inherit;font-weight:750;font-size:18px;cursor:pointer}#message{min-height:58px;margin-top:22px;text-align:center;font-size:19px;font-weight:650} .workspace{background:#fff;border:2px solid #d7dce7;border-radius:16px;box-shadow:0 8px 24px rgba(16,24,40,.10);min-height:480px;padding:24px}@media(max-width:500px){.entry{flex-wrap:wrap}#submit{height:52px;width:100%}nav{margin-bottom:28px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><header><h1>Mental Math: Percentages</h1><span class="count" id="count">0 correct</span></header><section class="workspace"><nav aria-label="Practice mode"><button data-mode="10" class="active">10%</button><button data-mode="1">1%</button><button data-mode="mixed">Mixed</button></nav><div class="problem" id="problem"></div><form id="form" autocomplete="off"><div class="entry"><span class="dollar">$</span><input id="answer" inputmode="decimal" aria-label="Answer in dollars" placeholder="0.00" autocomplete="off"><button id="submit" type="submit">Check</button></div></form><div id="message" role="status" aria-live="polite"></div></section></main><script>const $=id=>document.getElementById(id);let mode='10',percent=10,cents=0,correct=0,phase='answer',last='';const amounts=[500,600,800,1000,1200,1500,2000,2500,3000,3500,4000,4500,5000,6000,6500,7500,8000,9000,10000,12000,12500,15000,18000,20000,25000,35000,45000,50000,65000,75000,95000,125000,650,850,1450,1750,2250,3750,4850,9950];function money(c){return(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function next(){document.body.className='';phase='answer';$('submit').textContent='Check';$('message').textContent='';$('answer').value='';let candidate;do{percent=mode==='mixed'?(Math.random()<.5?10:1):Number(mode);cents=amounts[Math.floor(Math.random()*amounts.length)];candidate=percent+':'+cents}while(candidate===last);last=candidate;$('problem').textContent=percent+'% of $'+money(cents);$('answer').focus()}function check(){if(phase==='correct'){next();return}let raw=$('answer').value.trim().replace(/[$,\s]/g,'');if(!/^\d+(\.\d{0,2})?$/.test(raw)){ $('message').textContent='Enter a dollar amount.';return}let given=Math.round(Number(raw)*100),expected=Math.round(cents*percent/100);if(given===expected){correct++;$('count').textContent=correct+' correct';document.body.className='correct';$('message').textContent='Correct!';$('submit').textContent='Next';phase='correct'}else{document.body.className='wrong';$('message').textContent='Not quite. Try again.';$('answer').select()}}$('form').addEventListener('submit',e=>{e.preventDefault();check()});document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===btn));next()}));next();</script></body></html>
