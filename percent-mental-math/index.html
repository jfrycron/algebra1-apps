<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mental Math: Percentages</title><style>:root{font-family:Inter,Geist,system-ui,sans-serif;color:#172332}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fb;display:block;transition:background .15s}body.correct{background:#19bd4f}body.wrong{background:repeating-linear-gradient(45deg,#f8fafc 0,#f8fafc 10px,#e4e7ec 10px,#e4e7ec 20px)}main{width:min(96vw,1180px);margin:10px auto;background:transparent;border-radius:0;padding:0;box-shadow:none}header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:10px}h1{font-size:clamp(22px,3vw,36px);margin:0;font-weight:900;letter-spacing:-.03em}.count{color:#475467;font-size:14px;font-weight:800;background:#eef2f7;border:1px solid #d7dce7;border-radius:12px;padding:9px 15px;display:inline-block}.workspaceTop{display:flex;justify-content:flex-end;margin-bottom:6px}nav{display:flex;gap:8px;margin:0 0 30px;justify-content:center;flex-wrap:wrap}nav button{flex:0 1 110px;border:1px solid #cbd5df;background:#fff;border-radius:999px;padding:12px 6px;font:inherit;font-weight:650;cursor:pointer}nav button.active{background:#18344d;color:white;border-color:#18344d} .problem{text-align:center;font-size:clamp(35px,8vw,64px);font-weight:800;letter-spacing:-1.5px;margin:55px 0 34px}.entry{display:flex;gap:10px;align-items:stretch;max-width:520px;margin:auto}.dollar{font-size:30px;align-self:center}input{min-width:0;width:100%;padding:15px 18px;border:2px solid #cbd5df;border-radius:14px;font:inherit;font-size:30px;outline:none}input:focus{border-color:#245b91}#submit{background:#193e5d;color:white;border:0;border-radius:14px;padding:0 25px;font:inherit;font-weight:750;font-size:18px;cursor:pointer}#message{min-height:58px;margin-top:22px;text-align:center;font-size:19px;font-weight:650} .workspace{background:#fff;border:2px solid #d7dce7;border-radius:16px;box-shadow:0 8px 24px rgba(16,24,40,.10);min-height:480px;padding:24px}@media(max-width:500px){.entry{flex-wrap:wrap}#submit{height:52px;width:100%}nav{margin-bottom:28px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><header><h1>Mental Math: Percentages</h1></header><section class="workspace"><div class="workspaceTop"><span class="count" id="count">0 correct</span></div><nav aria-label="Practice mode"><button data-mode="mixed" class="active">Mixed</button><button data-mode="10">10%</button><button data-mode="1">1%</button><button data-mode="20">20%</button><button data-mode="2">2%</button><button data-mode="5">5%</button></nav><div class="problem" id="problem"></div><form id="form" autocomplete="off"><div class="entry"><span class="dollar">$</span><input id="answer" inputmode="decimal" aria-label="Answer in dollars" placeholder="0.00" autocomplete="off"><button id="submit" type="submit">Check</button></div></form><div id="message" role="status" aria-live="polite"></div></section></main><script>
const $=id=>document.getElementById(id);
let mode='mixed',percent=10,cents=0,correct=0,phase='answer',last='',attempted=false;
const percentages=[10,1,20,2,5];
function money(c){return(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function random(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function level(){return Math.min(4,1+Math.floor(correct/8))}
function amount(p,l){
  // Generate exact-cent results, including at the advanced levels.
  // The base multiple is 100/p cents, adjusted for integral cents.
  const step=100/p;
  let low,high,unit;
  if(l===1){low=10;high=120;unit=100} // friendly whole-dollar values
  else if(l===2){low=11;high=249;unit=100} // arbitrary whole dollars
  else if(l===3){low=75;high=1250;unit=100} // larger whole dollars
  else {low=5;high=500;unit=10} // dollars and dimes, exact cents for all five percents
  let value=random(low,high)*unit;
  if(l===1){value=Math.round(value/1000)*1000;if(value===0)value=1000}
  // 1% of dime values yields tenths of cents; use whole-dollar values for 1%,
  // and 2% and 5% require multiples of 50 and 20 cents respectively.
  if(l===4 && p===1)value=random(5,500)*100;
  if(l===4 && p===2)value=Math.round(value/50)*50;
  if(l===4 && p===5)value=Math.round(value/20)*20;
  if(l===4 && p===10)value=Math.round(value/10)*10;
  if(l===4 && p===20)value=Math.round(value/5)*5;
  return value;
}
function next(){
 document.body.className='';phase='answer';attempted=false;
 $('submit').textContent='Check';$('message').textContent='';$('answer').value='';
 let candidate,tries=0;
 do{
  percent=mode==='mixed'?percentages[random(0,percentages.length-1)]:Number(mode);
  cents=amount(percent,level());candidate=percent+':'+cents;tries++;
 }while(candidate===last&&tries<30);
 last=candidate;$('problem').textContent=percent+'% of $'+money(cents);$('answer').focus();
}
function check(){
 if(phase==='correct'){next();return}
 let raw=$('answer').value.trim().replace(/[$,\s]/g,'');
 if(!/^\d+(\.\d{0,2})?$/.test(raw)){$('message').textContent='Enter a dollar amount.';return}
 let given=Math.round(Number(raw)*100),expected=cents*percent/100;
 if(given===expected){
  correct++;$('count').textContent=correct+' correct';document.body.className='correct';
  $('message').textContent='Correct!';$('submit').textContent='Next';phase='correct';
 }else{
  document.body.className='wrong';$('message').textContent='Not quite. Try again.';$('answer').select();
 }
}
$('form').addEventListener('submit',e=>{e.preventDefault();check()});
document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{
 mode=btn.dataset.mode;
 document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===btn));
 next();
}));
next();
</script></body></html>
