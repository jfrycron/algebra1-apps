<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decimal to Percent — Infinite Practice</title><style>
:root{font-family:Geist,Inter,"Segoe UI",Arial,sans-serif;color:#1b2935;background:#eaf0f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;transition:background .25s}body.complete{background:#24b354}.workspace{width:min(580px,100%);background:#fff;border:1px solid #cbd5df;border-radius:20px;padding:26px 28px;box-shadow:0 8px 25px #20304412}header{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:22px}h1{font-size:27px;letter-spacing:-.6px;margin:0 0 5px}.instructions{color:#64748b;font-size:14px;margin:0}.pill{border:1px solid #cbd5df;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:13px;color:#475569}table{border-collapse:collapse;table-layout:fixed;width:min(370px,100%);margin:auto}th,td{border:1px solid #cbd5df;text-align:center}th{background:#e5e9ee;font-size:18px;padding:10px}td{height:51px;font-size:21px}tbody tr:nth-child(even){background:#f7f9fb}.entry{display:flex;align-items:center;justify-content:center;gap:5px}input{width:90px;height:36px;border:1.5px solid #b8c6d5;border-radius:7px;text-align:center;font:inherit;font-size:19px;outline:none;background:#fff}input:focus{border-color:#2563eb}input.good{background:#e1f7e7;border-color:#1e9c54}input.bad{background:#fff0ee;border-color:#bb3f3f}input:disabled{opacity:1;color:#126437}.mark{width:19px;font-weight:700;font-size:21px}.mark.yes{color:#16803b}.mark.no{color:#b91c1c}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}.status{color:#64748b;font-size:13px;max-width:245px}.status.done{color:#16803b;font-weight:700}button{border:0;background:#243e57;color:white;border-radius:999px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}button:disabled{background:#bac4ce;cursor:not-allowed}@media(max-width:480px){.workspace{padding:18px 12px}h1{font-size:23px}td{height:48px}}
</style></head><body><main class="workspace"><header><div><h1>Decimal to Percent</h1><p class="instructions">Complete all eight rows, then check your answers.</p></div><span class="pill" id="round">Table 1</span></header><table><thead><tr><th>Decimal</th><th>Percent</th></tr></thead><tbody id="rows"></tbody></table><div class="footer"><span id="status" class="status">Fill in all eight cells.</span><button id="action" disabled>Check Answers</button></div></main><script>
const rows=document.getElementById('rows'),action=document.getElementById('action'),status=document.getElementById('status'),roundEl=document.getElementById('round');
let round=0,questions=[],seen=new Set(),results=Array(8).fill(false),hasChecked=false;
const initial=[['.6',60],['.125',12.5],['.29',29],['.009',.9],['.051',5.1],['.899',89.9],['.2375',23.75],['.8',80]];
function makeQuestions(){if(round===0){initial.forEach(x=>seen.add(x[0]));return initial.map(([d,p])=>({d,p}));}if(seen.size>9800)seen.clear();const next=[];while(next.length<8){const n=1+Math.floor(Math.random()*9999);const d=(n/10000).toString().replace(/^0(?=\.)/,'');if(seen.has(d))continue;seen.add(d);next.push({d,p:n/100});}return next}
function inputs(){return [...rows.querySelectorAll('input')]}
function refresh(){const all=inputs();if(results.every(Boolean)){action.disabled=false;action.textContent='Infinite Practice — New Table';status.textContent='All 8 correct!';status.className='status done';document.body.classList.add('complete');return}action.textContent='Check Answers';action.disabled=all.some(i=>!i.value.trim());if(!hasChecked){status.textContent='Fill in all eight cells.';status.className='status'}}
function draw(){document.body.classList.remove('complete');questions=makeQuestions();results=Array(8).fill(false);hasChecked=false;roundEl.textContent='Table '+(round+1);rows.innerHTML='';questions.forEach((q,index)=>{const tr=document.createElement('tr');const left=document.createElement('td');left.textContent=q.d;const right=document.createElement('td');const wrap=document.createElement('div');wrap.className='entry';const input=document.createElement('input');input.inputMode='decimal';input.autocomplete='off';input.setAttribute('aria-label','Percent for '+q.d);const suffix=document.createElement('span');suffix.textContent='%';const mark=document.createElement('span');mark.className='mark';mark.setAttribute('aria-live','polite');wrap.append(input,suffix,mark);right.append(wrap);tr.append(left,right);rows.append(tr);input.addEventListener('input',()=>{if(!results[index]){input.classList.remove('bad');mark.textContent=''}refresh()});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const editable=inputs().filter(x=>!x.disabled);const next=editable.find(x=>inputs().indexOf(x)>index)||editable[0];if(next&&next!==input)next.focus();else if(!action.disabled)action.focus()}})});refresh()}
function check(){if(results.every(Boolean)){round++;draw();inputs()[0].focus();return}const all=inputs();if(all.some(x=>!x.value.trim()))return;let count=0;all.forEach((input,i)=>{if(results[i]){count++;return}const raw=input.value.trim().replace(/%/g,'');const value=Number(raw);const ok=raw!==''&&Number.isFinite(value)&&Math.abs(value-questions[i].p)<1e-7;results[i]=ok;input.classList.toggle('good',ok);input.classList.toggle('bad',!ok);input.disabled=ok;const mark=input.parentNode.querySelector('.mark');mark.textContent=ok?'✓':'×';mark.className='mark '+(ok?'yes':'no');if(ok)count++});hasChecked=true;status.textContent=count===8?'All 8 correct!':count+' of 8 correct. Fix the marked cells and check again.';refresh();if(count<8)inputs().find(x=>!x.disabled)?.focus()}
action.addEventListener('click',check);draw();
</script></body></html>
